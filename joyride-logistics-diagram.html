                      <span style={{ fontSize: 12, fontWeight: 700, color: B.red, letterSpacing: 1, textTransform: "uppercase" }}>{dom}</span>
                      <span style={{ fontSize: 9, color: B.dim }}>({domDrivers.length} driver{domDrivers.length !== 1 ? "s" : ""})</span>
                      <div style={{ flex: 1, height: 1, background: "rgba(193,59,64,0.12)" }} />
                    </div>

                    {/* Driver rows */}
                    {domDrivers.map((d, dIdx) => {
                      const isSel = selectedDriver === d.id;
                      const isHov = hoveredDriver === d.id;
                      const isBkp = isDriverBackup(d.id);
                      const isMaxed = d.blockCount >= MAX_BLOCKS_PER_WEEK;
                      const driverBlocks = d.blocks || [];
                      // Collect blocks this driver has been assigned as backup for
                      const backupBlocks = [];
                      Object.entries(blockBackups).forEach(([key, backupDriverId]) => {
                        if (backupDriverId !== d.id) return;
                        const [tid, bn] = key.split("-").map(Number);
                        const truck = TRUCKS.find(t => t.id === tid);
                        if (!truck) return;
                        const blockId = truck.blockIds?.[bn - 1];
                        if (!blockId) return;
                        const trips = truck.blockTrips?.[blockId] || [];
                        let blkStart = null, blkEnd = null;
                        trips.forEach(t => {
                          if (t.stop1ArrDate && t.stop1ArrTime) {
                            const dt = `${t.stop1ArrDate} ${t.stop1ArrTime}`;
                            if (!blkStart || dt < blkStart) blkStart = dt;
                          }
                          if (t.stop2ArrDate && t.stop2ArrTime) {
                            const dt = `${t.stop2ArrDate} ${t.stop2ArrTime}`;
                            if (!blkEnd || dt > blkEnd) blkEnd = dt;
                          }
                        });
                        const stages = trips.map(t => t.stage).filter(Boolean);
                        const dominantStage = stages.length > 0
                          ? Object.entries(stages.reduce((acc, s) => { acc[s] = (acc[s] || 0) + 1; return acc; }, {})).sort((a, b) => b[1] - a[1])[0]?.[0]
                          : null;
                        backupBlocks.push({
                          blockId, truckId: tid, truckLabel: truck.operatorId,
                          trips, stage: dominantStage,
                          totalMiles: Math.round(trips.reduce((s, t) => s + t.distance, 0)),
                          blockStart: blkStart, blockEnd: blkEnd,
                          isBackupBlock: true, originalKey: key, blockNum: bn,
                        });
                      });
                      const allBlocks = [...driverBlocks, ...backupBlocks];
                      const rowHasAssigning = assigningBlock && allBlocks.some((blk, bIdx) => {
                        const truck = TRUCKS.find(t => t.id === blk.truckId);
                        const blockIndex = truck?.blockIds?.indexOf(blk.blockId);
                        const bn = blockIndex !== undefined && blockIndex >= 0 ? blockIndex + 1 : bIdx + 1;
                        return blockKey(blk.truckId, bn) === assigningBlock;
                      });

                      return (
                        <div
                          key={d.id}
                          ref={(el) => (driverRefs.current[d.id] = el)}
                          onClick={(e) => {
                            e.stopPropagation();
                            setSelectedDriver(isSel ? null : d.id);
                            setSelectedTruck(null);
                          }}
                          onMouseEnter={() => setHoveredDriver(d.id)}
                          onMouseLeave={() => setHoveredDriver(null)}
                          style={{
                            display: "flex", alignItems: "center", gap: 0, padding: "6px 0",
                            cursor: "pointer", borderRadius: 6, transition: "all 0.15s",
                            background: isSel ? "rgba(193,59,64,0.12)" : isBkp ? B.bkpBg : isHov ? "rgba(193,59,64,0.04)" : dIdx % 2 === 0 ? "transparent" : "rgba(255,255,255,0.012)",
                            borderLeft: isSel ? `3px solid ${B.red}` : "3px solid transparent",
                            opacity: isMaxed && !isSel ? 0.85 : 1,
                            position: "relative", overflow: "visible", zIndex: rowHasAssigning ? 100 : "auto",
                          }}
                        >
                          {/* Col A: Driver number */}
                          <div style={{ width: 36, textAlign: "center", fontSize: 11, fontWeight: 700, color: B.dim, flexShrink: 0 }}>
                            {d.driverNumber}
                          </div>

                          {/* Col B: Driver name + stats */}
                          <div style={{ width: 200, minWidth: 0, flexShrink: 0, paddingRight: 8 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600, color: isMaxed ? B.dim : B.text }}>
                              {d.hosSource && d.hosStatus && (
                                <span style={{
                                  width: 6, height: 6, borderRadius: "50%", flexShrink: 0,
                                  background: d.hosStatus === "driving" ? B.green : d.hosStatus === "on_duty" ? B.gold : d.hosStatus === "sleeper_berth" ? "#64b5f6" : "rgba(255,255,255,0.2)",
                                  border: d.hosStatus === "off_duty" ? `1.5px solid ${B.dim}` : "none",
                                  boxShadow: d.hosStatus === "driving" ? `0 0 4px ${B.green}` : "none",
                                }} />
                              )}
                              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.label}</span>
                              {d.preferredStartLabel && (
                                <span style={{
                                  fontSize: 7, fontWeight: 700, flexShrink: 0,
                                  padding: "1px 4px", borderRadius: 3, letterSpacing: 0.3,
                                  background: d.preferredShift === "AM" ? "rgba(100,181,246,0.12)" : d.preferredShift === "PM" ? "rgba(255,213,79,0.12)" : d.preferredShift === "NIGHT" ? "rgba(186,104,200,0.12)" : "rgba(255,255,255,0.06)",
                                  color: d.preferredShift === "AM" ? "#64b5f6" : d.preferredShift === "PM" ? B.gold : d.preferredShift === "NIGHT" ? B.bkpL : B.dim,
                                }}>
                                  {d.preferredStartLabel}
                                </span>
                              )}
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 2 }}>
                              <div style={{ width: 40, height: 3, borderRadius: 2, background: "rgba(255,255,255,0.06)", overflow: "hidden" }}>
                                <div style={{
                                  height: "100%", borderRadius: 2, transition: "width 0.3s",
                                  width: `${Math.min((d.blockCount / 3) * 100, 100)}%`,
                                  background: d.blockCount >= 3 ? B.cancelRed : d.blockCount >= 2 ? B.gold : B.green,
                                }} />
                              </div>
                              <span style={{ fontSize: 8, color: d.blockCount >= 3 ? B.cancelRed : B.dim, fontWeight: d.blockCount >= 3 ? 700 : 400 }}>
                                {d.blockCount}/3
                              </span>
                              <span style={{ fontSize: 7, fontWeight: 600, color: d.cycleRemaining > 30 ? B.greenL : d.cycleRemaining > 10 ? B.gold : B.cancelRed }}>
                                {d.cycleRemaining}h left
                              </span>
                              {d.hosSource && (
                                <span style={{ fontSize: 7, color: (d.hosDutyRemaining || 0) > 480 ? B.greenL : (d.hosDutyRemaining || 0) > 240 ? B.gold : B.cancelRed }}>
                                  · {Math.round((d.hosDutyRemaining || 0) / 60)}h duty
                                </span>
                              )}
                              <span style={{ fontSize: 7, color: B.dim }}>
                                · {d.tripCount}t
                              </span>
                              {isMaxed && <span style={{ fontSize: 7, color: B.cancelRed, fontWeight: 700 }}>FULL</span>}
                              {isBkp && <span style={{ fontSize: 7, color: B.bkpL, fontWeight: 600 }}>BKP</span>}
                            </div>
                          </div>

                          {/* Status column */}
                          <div style={{ width: 70, flexShrink: 0, textAlign: "center" }}>
                            {d.hosSource && d.hosStatus ? (
                              <div style={{
                                display: "inline-flex", alignItems: "center", gap: 3,
                                padding: "2px 6px", borderRadius: 4, fontSize: 7, fontWeight: 700,
                                textTransform: "uppercase", letterSpacing: 0.3,
                                background: d.hosStatus === "driving" ? B.greenBg
                                  : d.hosStatus === "on_duty" ? B.goldBg
                                  : d.hosStatus === "sleeper_berth" ? "rgba(100,181,246,0.10)"
                                  : "rgba(255,255,255,0.04)",
                                color: d.hosStatus === "driving" ? B.green
                                  : d.hosStatus === "on_duty" ? B.gold
                                  : d.hosStatus === "sleeper_berth" ? "#64b5f6"
                                  : B.dim,
                              }}>
                                <span style={{
                                  width: 5, height: 5, borderRadius: "50%", flexShrink: 0,
                                  background: d.hosStatus === "driving" ? B.green
                                    : d.hosStatus === "on_duty" ? B.gold
                                    : d.hosStatus === "sleeper_berth" ? "#64b5f6"
                                    : "transparent",
                                  border: d.hosStatus === "off_duty" ? `1px solid ${B.dim}` : "none",
                                  boxShadow: d.hosStatus === "driving" ? `0 0 4px ${B.green}` : "none",
                                }} />
                                {d.hosStatus.replace("_", " ")}
                              </div>
                            ) : (
                              <span style={{ fontSize: 7, color: B.dim }}>—</span>
                            )}
                          </div>

                          {/* Cols C, D, E: Driver's blocks */}
                          {allBlocks.map((blk, bIdx) => {
                            // For backup blocks, use the stored key; for own blocks, compute it
                            const truck = TRUCKS.find(t => t.id === blk.truckId);
                            const bn = blk.isBackupBlock ? blk.blockNum : (() => {
                              const blockIndex = truck?.blockIds?.indexOf(blk.blockId);
                              return blockIndex !== undefined && blockIndex >= 0 ? blockIndex + 1 : bIdx + 1;
                            })();
                            const key = blockKey(blk.truckId, bn);
                            const isCancelled = !!cancelledBlocks[key];
                            const backup = blockBackups[key];
                            const isAssigning = assigningBlock === key;
                            const available = isAssigning ? getAvailableForBlock(blk.truckId, bn) : [];
                            const stageColor = blk.stage ? STAGE_COLORS[blk.stage] : null;

                            return (
                              <div key={`${blk.blockId}-${blk.isBackupBlock ? 'bkp' : 'own'}`} style={{ width: 120, flexShrink: 0, position: "relative", zIndex: isAssigning ? 100 : 1 }}>
                                {blk.isBackupBlock ? (
                                  // Backup block — show with purple accent, non-cancellable
                                  <div style={{
                                    width: "100%", background: B.bkpBg,
                                    border: `2px solid rgba(186,104,200,0.4)`,
                                    borderTop: stageColor ? `3px solid ${stageColor}` : undefined,
                                    borderRadius: 10, padding: "8px 5px", textAlign: "center",
                                  }}>
                                    <div style={{ fontSize: 9, fontWeight: 700, color: B.bkpL, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                      {blk.blockId.slice(0, 8)}
                                    </div>
                                    <div style={{ fontSize: 7, color: B.bkpL, fontWeight: 600, marginTop: 2 }}>BKP</div>
                                    {blk.blockStart && (
                                      <div style={{ fontSize: 7, color: B.dim, marginTop: 2, lineHeight: 1.3 }}>
                                        <div style={{ color: B.greenL }}>{formatBlockTime(blk.blockStart)}</div>
                                        <div style={{ color: B.gold }}>{formatBlockTime(blk.blockEnd)}</div>
                                      </div>
                                    )}
                                  </div>
                                ) : (
                                <BlockNode
                                  label={blk.blockId.slice(0, 8)}
                                  driverLabel=""
                                  driverName=""
                                  highlight={false}
                                  cancelled={isCancelled}
                                  dropped={!!droppedBlocks[key]}
                                  backupAssigned={backup}
                                  backupName={backup ? getDriverName(backup) : null}
                                  assigning={isAssigning}
                                  compact={true}
                                  stageColor={stageColor}
                                  blockStart={blk.blockStart}
                                  blockEnd={blk.blockEnd}
                                  tooltip={`${blk.blockId}\nSeat: ${blk.truckLabel}\n${blk.trips.length} trips · ${blk.totalMiles} mi\n${blk.blockStart ? `Start: ${blk.blockStart}` : ""}\n${blk.blockEnd ? `End: ${blk.blockEnd}` : ""}\n${blk.trips.map(t => `${t.stop1} → ${t.stop2}`).join('\n')}`}
                                  availableBackups={available.map((ad) => ({ ...ad, onSelect: () => requestBackupAssignment(blk.truckId, bn, ad.id) }))}
                                  onCancel={() => toggleBlockCancel(blk.truckId, bn)}
                                  onAssign={() => setAssigningBlock(isAssigning ? null : key)}
                                  onRemoveBackup={() => removeBlockBackup(blk.truckId, bn)}
                                  onDrop={() => dropBlock(blk.truckId, bn)}
                                  onUndrop={() => undropBlock(blk.truckId, bn)}
                                />
                                )}
                              </div>
                            );
                          })}

                          {/* Empty block slots */}
                          {Array.from({ length: Math.max(0, 3 - allBlocks.length) }).map((_, i) => (
                            <div key={`empty-${i}`} style={{ width: 120, flexShrink: 0 }}>
                              <div style={{
                                width: "100%", height: 42, borderRadius: 8,
                                border: `1px dashed rgba(255,255,255,0.04)`,
                              }} />
                            </div>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          )}

          {/* ═══ DEMO MODE: Two-column layout with connection lines ═══ */}
          {!csvRows && (
          <div key={`${mode}-${csvRegion}`} ref={containerRef} style={{ position: "relative", display: "flex", padding: "24px 20px", gap: 0, background: B.bg }}>

            {positions && effectiveShowLines && (
              <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 1 }}>
                {connections.filter(({ driverId, truckId, type }) => {
                  return true;
                }).map(({ driverId, truckId, type }) => {
                  const dp = positions.drivers[driverId];
                  const bp = positions.blocks[truckId];
                  if (!dp || !bp) return null;
                  const color = getLineColor(driverId, truckId);
                  const dx = bp.x - dp.x;
                  const cpX = dx * 0.4;
                  const w = type === "backup" ? 2 : hoveredDriver === driverId ? 2 : 1.5;
                  const op = getLineOpacity(driverId);
                  const dash = type === "backup" ? "6,3" : "none";
                  const useStraight = !hasPrimarySecondary && type !== "backup";
                  return (
                    <g key={`${type}-d${driverId}-t${truckId}`}>
                      {useStraight ? (
                        <line
                          x1={dp.x} y1={dp.y} x2={bp.x} y2={bp.y}
                          stroke={color} strokeWidth={w} opacity={op} strokeDasharray={dash}
                        />
                      ) : (
                        <path
                          d={`M${dp.x},${dp.y} C${dp.x + cpX},${dp.y} ${bp.x - cpX},${bp.y} ${bp.x},${bp.y}`}
                          stroke={color} strokeWidth={w} fill="none"
                          opacity={op} strokeDasharray={dash}
                        />
                      )}
                      <circle cx={dp.x} cy={dp.y} r={2.5} fill={color} opacity={op * 1.5} />
                    </g>
                  );
                })}
              </svg>
            )}

            <div style={{ flex: csvRows ? "0 0 220px" : "0 0 150px", display: "flex", flexDirection: "column", zIndex: 2, paddingRight: 8 }}>
              <div style={{
                height: csvRows ? HEADER_H + 20 : HEADER_H, display: "flex", flexDirection: "column", justifyContent: "center", gap: 4,
                borderBottom: `1px solid ${B.bdr}`, boxSizing: "border-box", padding: "2px 4px",
                position: "sticky", top: 0, background: B.bg, zIndex: 5,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 10, fontWeight: 700, color: B.redLight, textTransform: "uppercase", letterSpacing: 1, flexShrink: 0 }}>
                    {DRIVERS.length}
                  </span>
                  {csvRows ? (
                    <input
                      type="text" placeholder="Search drivers..." value={driverSearch}
                      onChange={(e) => setDriverSearch(e.target.value)}
                      style={{
                        flex: 1, background: "rgba(255,255,255,0.05)", border: `1px solid ${B.bdr}`,
                        borderRadius: 4, padding: "3px 8px", fontSize: 10, color: B.text,
                        outline: "none", fontFamily: "'Montserrat', sans-serif",
                      }}
                      onFocus={(e) => (e.target.style.borderColor = B.red)}
                      onBlur={(e) => (e.target.style.borderColor = B.bdr)}
                    />
                  ) : (
                    <span style={{ fontSize: 11, fontWeight: 700, color: B.redLight, textTransform: "uppercase", letterSpacing: 1 }}>Drivers</span>
                  )}
                </div>
                {csvRows && (
                  <div style={{ display: "flex", gap: 2 }}>
                    {[
                      { key: "default", label: "Default" },
                      { key: "available", label: "Avail ↑" },
                      { key: "name", label: "A-Z" },
                      { key: "miles", label: "Miles ↓" },
                    ].map(s => (
                      <button key={s.key} onClick={() => setDriverSort(s.key)} style={{
                        padding: "1px 6px", borderRadius: 3, fontSize: 8, fontWeight: 600,
                        cursor: "pointer", fontFamily: "'Montserrat', sans-serif", border: "none",
                        background: driverSort === s.key ? "rgba(193,59,64,0.2)" : "rgba(255,255,255,0.04)",
                        color: driverSort === s.key ? B.redLight : B.dim,
                        transition: "all 0.15s",
                      }}>{s.label}</button>
                    ))}
                  </div>
                )}
              </div>
              {DRIVERS.filter(d => !driverSearch || d.label.toLowerCase().includes(driverSearch.toLowerCase()))
                .sort((a, b) => {
                  if (driverSort === "available") return (a.blockCount || 0) - (b.blockCount || 0);
                  if (driverSort === "name") return a.label.localeCompare(b.label);
                  if (driverSort === "miles") return (b.totalMiles || 0) - (a.totalMiles || 0);
                  return 0;
                })
                .map((d) => {
                const load = TRUCKS.find((t) => t.primaryDriver === d.id || t.secondaryDriver === d.id);

                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 300, overflowY: "auto" }}>
                    {blockEntries.map(([bid, trips]) => (
                      <div key={bid} style={{ background: B.surface, borderRadius: 8, padding: 10, border: `1px solid ${B.bdr}` }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                          <span style={{ fontSize: 11, fontWeight: 700, color: B.redLight }}>{bid}</span>
                          <span style={{ fontSize: 9, color: B.dim }}>{trips.length} trip{trips.length > 1 ? "s" : ""}</span>
                          <span style={{ fontSize: 9, color: B.greenL, marginLeft: "auto" }}>
                            {Math.round(trips.reduce((s, t) => s + t.distance, 0))} mi total
                          </span>
                        </div>
                        {trips.map((trip, idx) => (
                          <div key={idx} style={{
                            display: "flex", alignItems: "center", gap: 8, padding: "4px 0",
                            borderTop: idx > 0 ? `1px solid ${B.bdr}` : "none", fontSize: 10,
                          }}>
                            <span style={{ color: B.text, fontWeight: 600, minWidth: 70 }}>{trip.tripId.slice(0, 10)}</span>
                            <span style={{ color: B.green }}>{trip.stop1}</span>
                            <svg width="14" height="8" viewBox="0 0 14 8" style={{ flexShrink: 0 }}>
                              <line x1="0" y1="4" x2="9" y2="4" stroke={B.subtle} strokeWidth="1" />
                              <path d="M8,1 L13,4 L8,7" fill={B.subtle} />
                            </svg>
                            <span style={{ color: B.gold }}>{trip.stop2}</span>
                            <span style={{ color: B.dim, marginLeft: "auto" }}>{trip.distance}mi</span>
                            {trip.stage && (
                              <span style={{
                                fontSize: 8, padding: "1px 5px", borderRadius: 3, fontWeight: 600,
                                background: trip.stage === "In Transit" ? B.greenBg : trip.stage === "Tendered" ? B.goldBg : trip.stage === "Upcoming" ? "rgba(100,181,246,0.10)" : "rgba(255,255,255,0.05)",
                                color: STAGE_COLORS[trip.stage] || B.dim,
                              }}>{trip.stage}</span>
                            )}
                            {trip.driver && (
                              <span style={{ fontSize: 8, color: B.dim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 80 }}>{trip.driver}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              );
            }

            // Demo mode: show rotation timeline
            const timeline = [];
            for (let bn = 1; bn <= blocksPerLoad; bn++) {
              const key = blockKey(truck.id, bn);
              const origDriver = getOriginalDriver(truck.id, bn);
              const effDriver = blockBackups[key] || origDriver;
              const isCancelled = !!cancelledBlocks[key];
              const isPrimary = hasPrimarySecondary ? bn % 2 === 1 : true;
              timeline.push({
                label: `Block ${bn}`, driver: getDriverName(effDriver),
                type: isCancelled && !blockBackups[key] ? "cancelled" : isPrimary ? "primary" : "secondary",
                isBackup: !!blockBackups[key],
              });
              if (bn < blocksPerLoad) timeline.push({ label: "10hr Rest", type: "break" });
            }
            return (
              <div style={{
                margin: "0 20px 16px", background: B.card,
                border: `1px solid rgba(193,59,64,0.2)`, borderRadius: 12, padding: 16,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 8, background: B.redSub, border: `1.5px solid ${B.red}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: B.redLight }}>L{selectedTruck}</div>
                  <div>
                    <h4 style={{ margin: 0, color: B.white, fontSize: 14, fontWeight: 700 }}>
                      Load {selectedTruck} — Rotation Schedule
                    </h4>
                    <p style={{ margin: "2px 0 0", fontSize: 12, color: B.muted }}>
                      {hasPrimarySecondary
                        ? "Drivers alternate blocks with mandatory 10-hour rest. Click blocks above to simulate cancellations."
                        : "Single driver handles all blocks with mandatory 10-hour rest. Click blocks above to simulate cancellations."
                      }
                    </p>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 0, flexWrap: "wrap" }}>
                  {timeline.map((step, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center" }}>
                      <div style={{
                        padding: "6px 12px", borderRadius: 8, fontSize: 11, fontWeight: 600, textAlign: "center",
                        background: step.type === "break" ? B.goldBg : step.type === "cancelled" ? B.cancelBg : step.type === "primary" ? B.greenBg : B.goldBg,
                        color: step.type === "break" ? B.gold : step.type === "cancelled" ? B.cancelRed : step.isBackup ? B.bkpL : step.type === "primary" ? B.greenL : B.gold,
                        border: step.type === "break" ? `1px dashed rgba(255,213,79,0.3)` : step.type === "cancelled" ? `1px solid rgba(239,83,80,0.3)` : step.type === "primary" ? `1px solid rgba(102,187,106,0.3)` : `1px solid rgba(255,213,79,0.3)`,
                      }}>
                        <div>{step.label}</div>
                        {step.driver && (
                          <div style={{ fontSize: 9, opacity: 0.85, marginTop: 2 }}>
                            {step.driver}{step.isBackup ? " (BKP)" : ""}{step.type === "cancelled" ? " OPEN" : ""}
                          </div>
                        )}
                      </div>
                      {i < timeline.length - 1 && (
                        <svg width="20" height="8" viewBox="0 0 20 8" style={{ flexShrink: 0 }}>
                          <line x1="0" y1="4" x2="13" y2="4" stroke={B.subtle} strokeWidth="1" />
                          <path d="M12,1 L18,4 L12,7" fill={B.subtle} />
                        </svg>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}

          <div style={{
            padding: "12px 28px", borderTop: `1px solid ${B.bdr}`, background: B.header,
            display: "flex", alignItems: "center", justifyContent: "center",
            gap: 10, fontSize: 11, color: B.subtle,
          }}>
            <span style={{ color: B.red, fontWeight: 700 }}>JOYRIDE LOGISTICS, LLC</span>
            <span>·</span><span>joyridelogistics.com</span><span>·</span>
            <span>Fleet Operations Overview — {csvRows ? `${csvRegion !== "ALL" ? csvRegion + " Region" : "All Regions"} · Amazon Relay Data` : `${mode === "current" ? "New" : "Legacy"} System`}</span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JoyrideLogisticsDiagram />);
  </script>
</body>
</html>
