<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joyride Logistics LLC — Fleet Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #1c1f26; font-family: 'Montserrat', 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #252830; }
    ::-webkit-scrollbar-thumb { background: #555862; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

    const B = {
      red: "#C13B40", redLight: "#d4585d", redDark: "#9e2f33",
      redGlow: "rgba(193,59,64,0.15)", redSub: "rgba(193,59,64,0.08)",
      bg: "#1c1f26", header: "#14161c", card: "#252830",
      cardHover: "#2e313b", surface: "#2a2d36",
      bdr: "rgba(255,255,255,0.06)", bdrL: "rgba(255,255,255,0.10)",
      white: "#f0f1f4", text: "#d0d2d8", muted: "#8e919c",
      dim: "#6b6e78", subtle: "#555862",
      green: "#66bb6a", greenL: "#a5d6a7", greenBg: "rgba(102,187,106,0.10)",
      gold: "#ffd54f", goldDim: "#d4a53a", goldBg: "rgba(255,213,79,0.10)",
      bkp: "#ba68c8", bkpL: "#ce93d8", bkpBg: "rgba(186,104,200,0.10)",
      cancelRed: "#ef5350", cancelBg: "rgba(239,83,80,0.10)",
      grad: "linear-gradient(135deg, #C13B40 0%, #363535 60%, #C13B40 100%)",
    };

    const MODELS = {
      current: {
        label: "New System",
        tag: "20 / 10 / 4",
        numDrivers: 20,
        numTrucks: 10,
        blocksPerLoad: 4,
        hasPrimarySecondary: true,
      },
      legacy: {
        label: "Legacy System",
        tag: "20 / 20 / 3",
        numDrivers: 20,
        numTrucks: 20,
        blocksPerLoad: 3,
        hasPrimarySecondary: false,
      },
    };

    const DRIVER_NAMES = [
      "M. Neuer", "J. Kimmich", "D. Upamecano", "M. de Ligt", "A. Davies",
      "J. Musiala", "L. Goretzka", "T. Muller", "L. Sane", "S. Gnabry",
      "H. Kane", "K. Coman", "R. Guerreiro", "N. Mazraoui", "E. Laimer",
      "B. Pavard", "M. Tel", "P. Chupo", "J. Stanisic", "G. Peretz",
    ];

    function buildData(model) {
      const drivers = Array.from({ length: model.numDrivers }, (_, i) => ({ id: i + 1, label: DRIVER_NAMES[i] || `Driver ${i + 1}` }));
      let trucks;
      if (model.hasPrimarySecondary) {
        trucks = Array.from({ length: model.numTrucks }, (_, i) => ({
          id: i + 1, label: `Truck ${i + 1}`,
          primaryDriver: i * 2 + 1, secondaryDriver: i * 2 + 2,
        }));
      } else {
        trucks = Array.from({ length: model.numTrucks }, (_, i) => ({
          id: i + 1, label: `Truck ${i + 1}`,
          primaryDriver: i + 1, secondaryDriver: null,
        }));
      }
      return { drivers, trucks, blocksPerLoad: model.blocksPerLoad, hasPrimarySecondary: model.hasPrimarySecondary };
    }

    // ─── CSV Parser & Data Transformer ───────────────────────────
    function parseCSV(text) {
      const lines = text.split("\n").filter(l => l.trim());
      const headers = lines[0].split(",");
      return lines.slice(1).map(line => {
        const vals = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') { inQuotes = !inQuotes; }
          else if (line[i] === ',' && !inQuotes) { vals.push(current.trim()); current = ""; }
          else { current += line[i]; }
        }
        vals.push(current.trim());
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = vals[i] || ""; });
        return obj;
      });
    }

    function transformCSVData(rows, regionFilter) {
      // ── Step 1: Compute per-driver stats from ALL rows (before filtering) ──
      const driverStats = {}; // name → { totalMiles, tripCount, facilities, blockIds, workTypes }
      const driverSet = new Map(); // name → id
      let nextDriverId = 1;

      rows.forEach(row => {
        const name = (row["Driver Name"] || "").trim();
        if (!name) return;
        if (!driverSet.has(name)) driverSet.set(name, nextDriverId++);
        if (!driverStats[name]) driverStats[name] = { totalMiles: 0, tripCount: 0, facilities: new Set(), blockIds: new Set(), workTypes: new Set() };
        const s = driverStats[name];
        s.tripCount++;
        const dist = parseFloat(row["Estimate Distance"]) || 0;
        s.totalMiles += dist;
        const stop1 = (row["Stop 1"] || "").trim();
        const stop2 = (row["Stop 2"] || "").trim();
        if (stop1) s.facilities.add(stop1);
        if (stop2) s.facilities.add(stop2);
        const blockId = (row["Block ID"] || "").trim();
        if (blockId) s.blockIds.add(blockId);
        const shipper = (row["Shipper Account"] || "").trim();
        if (shipper) s.workTypes.add(shipper);
      });

      // Estimate weekly hours: assume avg 45mph, so hours ≈ miles/45
      Object.values(driverStats).forEach(s => {
        s.estWeeklyHours = Math.round((s.totalMiles / 45) * 10) / 10;
      });

      // ── Step 2: Group by Operator ID (= seat/load) ──
      const byOperator = {};
      rows.forEach(row => {
        const opId = (row["Operator ID"] || "").trim();
        const driverName = (row["Driver Name"] || "").trim();
        const blockId = (row["Block ID"] || "").trim();
        if (!opId && !driverName) return;

        if (opId) {
          if (!byOperator[opId]) byOperator[opId] = { trips: [], drivers: new Set(), blocks: new Set(), facilities: new Set() };
          byOperator[opId].trips.push(row);
          if (driverName) byOperator[opId].drivers.add(driverName);
          if (blockId) byOperator[opId].blocks.add(blockId);
          const s1 = (row["Stop 1"] || "").trim();
          const s2 = (row["Stop 2"] || "").trim();
          if (s1) byOperator[opId].facilities.add(s1);
          if (s2) byOperator[opId].facilities.add(s2);
        }
      });

      // ── Step 3: Extract regions, filter ──
      const regions = new Set();
      Object.keys(byOperator).forEach(opId => {
        const parts = opId.split("_");
        if (parts.length >= 2) regions.add(parts[1]);
      });

      const filteredOps = Object.entries(byOperator).filter(([opId]) => {
        if (!regionFilter || regionFilter === "ALL") return true;
        const parts = opId.split("_");
        return parts.length >= 2 && parts[1] === regionFilter;
      });
      filteredOps.sort(([a], [b]) => a.localeCompare(b));

      // ── Step 4: Build drivers and loads ──
      const allDriverNames = [];
      const trucks = [];
      let loadId = 1;

      filteredOps.forEach(([opId, data]) => {
        const driverArr = [...data.drivers];
        const primary = driverArr[0] ? driverSet.get(driverArr[0]) : null;
        const secondary = driverArr[1] ? driverSet.get(driverArr[1]) : null;
        driverArr.forEach(name => { if (!allDriverNames.includes(name)) allDriverNames.push(name); });

        trucks.push({
          id: loadId, label: opId, operatorId: opId,
          primaryDriver: primary, secondaryDriver: secondary || null,
          blockCount: Math.max(data.blocks.size, 1),
          tripData: data.trips, blockIds: [...data.blocks],
          facilities: [...data.facilities],
        });
        loadId++;
      });

      const drivers = allDriverNames.map(name => {
        const s = driverStats[name] || {};
        return {
          id: driverSet.get(name), label: name,
          totalMiles: Math.round(s.totalMiles || 0),
          estWeeklyHours: s.estWeeklyHours || 0,
          tripCount: s.tripCount || 0,
          blockCount: s.blockIds ? s.blockIds.size : 0,
          facilities: s.facilities ? [...s.facilities] : [],
          workTypes: s.workTypes ? [...s.workTypes] : [],
        };
      });

      const maxBlocks = Math.min(Math.max(...trucks.map(t => t.blockCount), 1), 6);
      const hasPrimSec = trucks.some(t => t.secondaryDriver !== null);

      return {
        drivers, trucks, blocksPerLoad: maxBlocks, hasPrimarySecondary: hasPrimSec,
        regions: [...regions].sort(), totalTrips: rows.length, csvMode: true,
        driverStats, // expose for backup ranking
      };
    }

    // ─── Upload Component ──────────────────────────────────────
    const CSVUpload = ({ onUpload, onClear, hasData }) => {
      const [dragging, setDragging] = useState(false);
      const fileRef = useRef(null);

      const handleFile = (file) => {
        if (!file || !file.name.endsWith(".csv")) return;
        const reader = new FileReader();
        reader.onload = (e) => onUpload(e.target.result);
        reader.readAsText(file);
      };

      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {hasData ? (
            <button onClick={onClear} style={{
              background: "rgba(100,100,100,0.3)", color: B.muted, border: `1px solid ${B.subtle}`,
              borderRadius: 4, padding: "5px 12px", fontSize: 10, fontWeight: 700,
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
              letterSpacing: 0.5,
            }}>Demo Mode</button>
          ) : null}
          <div
            onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
            onClick={() => fileRef.current?.click()}
            style={{
              padding: "5px 14px", borderRadius: 6, fontSize: 10, fontWeight: 700,
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
              letterSpacing: 0.5, transition: "all 0.2s",
              background: dragging ? "rgba(102,187,106,0.2)" : hasData ? "rgba(102,187,106,0.1)" : "rgba(193,59,64,0.1)",
              border: dragging ? `2px dashed ${B.green}` : hasData ? `1px solid rgba(102,187,106,0.3)` : `1px solid rgba(193,59,64,0.3)`,
              color: dragging ? B.greenL : hasData ? B.greenL : B.redLight,
            }}
          >
            {hasData ? "CSV Loaded" : "Upload CSV"}
            <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }}
              onChange={(e) => handleFile(e.target.files[0])} />
          </div>
        </div>
      );
    };

    // ─── Region Tabs ─────────────────────────────────────────────
    const RegionTabs = ({ regions, active, onSelect }) => (
      <div style={{ display: "flex", gap: 4 }}>
        {["ALL", ...regions].map(r => (
          <button key={r} onClick={() => onSelect(r)} style={{
            padding: "4px 10px", borderRadius: 4, fontSize: 10, fontWeight: 700,
            cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
            letterSpacing: 0.5, border: "none", transition: "all 0.2s",
            background: active === r ? B.red : "rgba(255,255,255,0.05)",
            color: active === r ? "#fff" : B.muted,
          }}>{r}</button>
        ))}
      </div>
    );

    const LOGO_SRC = "Joyride-logo-header-footer-01-768x293.png";

    const JoyrideLogo = ({ height = 40 }) => (
      <img src={LOGO_SRC} alt="Joyride Logistics LLC" style={{ height, objectFit: "contain", display: "block" }} />
    );

    const TruckSVG = ({ color = B.red, size = 40 }) => (
      <svg width={size} height={size * 0.64} viewBox="0 0 100 70" fill="none">
        <rect x="0" y="15" width="60" height="40" rx="5" fill={color} />
        <rect x="60" y="25" width="32" height="30" rx="5" fill={color} opacity="0.85" />
        <rect x="65" y="29" width="22" height="14" rx="3" fill="rgba(255,255,255,0.3)" />
        <circle cx="20" cy="58" r="8" fill="#222" /><circle cx="20" cy="58" r="4" fill="#444" />
        <circle cx="76" cy="58" r="8" fill="#222" /><circle cx="76" cy="58" r="4" fill="#444" />
        <rect x="92" y="32" width="5" height="4" rx="1" fill={B.gold} />
      </svg>
    );

    const PersonSVG = ({ color = B.red, size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="11" r="7" fill={color} />
        <path d="M8 34 C8 24 32 24 32 34" fill={color} />
      </svg>
    );

    const ModelToggle = ({ mode, onToggle }) => (
      <div style={{
        display: "flex", alignItems: "center", gap: 0,
        background: B.surface, borderRadius: 8, padding: 3,
        border: `1px solid ${B.bdrL}`,
      }}>
        {["current", "legacy"].map((m) => (
          <button key={m} onClick={() => onToggle(m)} style={{
            padding: "6px 16px", borderRadius: 6, border: "none", cursor: "pointer",
            fontSize: 11, fontWeight: 700, fontFamily: "'Montserrat', sans-serif",
            textTransform: "uppercase", letterSpacing: 0.5,
            transition: "all 0.2s ease",
            background: mode === m ? B.red : "transparent",
            color: mode === m ? "#fff" : B.muted,
          }}>
            {MODELS[m].label}
            <span style={{ fontSize: 9, marginLeft: 6, opacity: 0.7 }}>({MODELS[m].tag})</span>
          </button>
        ))}
      </div>
    );

    const BlockNode = ({ label, driverLabel, highlight, cancelled, onCancel, onAssign, assigning, availableBackups, backupAssigned, onRemoveBackup, dropped, onDrop, onUndrop }) => (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 105, position: "relative" }}>
        <div
          onClick={(e) => { e.stopPropagation(); (dropped ? onUndrop : onCancel)(); }}
          style={{
            width: "100%",
            background: dropped ? "rgba(100,100,100,0.12)" : cancelled ? B.cancelBg : B.surface,
            border: dropped ? `2px solid ${B.dim}` : cancelled ? `2px solid ${B.cancelRed}` : `1px solid ${B.bdrL}`,
            borderRadius: 10, padding: "16px 12px", textAlign: "center", cursor: "pointer",
            transition: "all 0.2s ease", opacity: dropped ? 0.4 : 1,
          }}
        >
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, color: dropped ? B.dim : cancelled ? B.cancelRed : B.text, textDecoration: dropped ? "line-through" : "none" }}>
            {label}
          </div>
          <div style={{
            fontSize: 11, marginTop: 4, fontWeight: 600,
            color: dropped ? B.dim : cancelled ? B.cancelRed : backupAssigned ? B.bkpL : B.muted,
            textDecoration: (cancelled && !backupAssigned) || dropped ? "line-through" : "none",
          }}>
            {dropped ? "N/A" : backupAssigned ? `D${backupAssigned}` : driverLabel}
            {backupAssigned && <span style={{ fontSize: 8, color: B.bkpL, marginLeft: 3 }}>(BKP)</span>}
          </div>
        </div>
        {dropped && (
          <span style={{ fontSize: 8, color: B.dim, fontWeight: 700, marginTop: 3, textTransform: "uppercase" }}>Cancelled</span>
        )}
        {cancelled && !backupAssigned && !dropped && (
          <div style={{ display: "flex", gap: 4, marginTop: 5 }}>
            <button
              onClick={(e) => { e.stopPropagation(); onAssign(); }}
              style={{
                backgroundImage: B.grad, backgroundSize: "200% auto",
                color: "#fff", border: "none", borderRadius: 4, padding: "4px 8px", fontSize: 8, fontWeight: 700,
                cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
                letterSpacing: 0.3, transition: "background-position 0.4s", whiteSpace: "nowrap",
              }}
              onMouseEnter={(e) => (e.currentTarget.style.backgroundPosition = "right center")}
              onMouseLeave={(e) => (e.currentTarget.style.backgroundPosition = "left center")}
            >
              Backup
            </button>
            <button
              onClick={(e) => { e.stopPropagation(); onDrop(); }}
              style={{
                background: "rgba(100,100,100,0.2)", color: B.muted, border: `1px solid ${B.subtle}`,
                borderRadius: 4, padding: "4px 8px", fontSize: 8, fontWeight: 700,
                cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
                letterSpacing: 0.3, whiteSpace: "nowrap",
              }}
            >
              Cancel
            </button>
          </div>
        )}
        {backupAssigned && (
          <div style={{ marginTop: 3, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ fontSize: 9, color: B.bkpL, fontWeight: 600 }}>Backup</span>
            <button
              onClick={(e) => { e.stopPropagation(); onRemoveBackup(); }}
              style={{ background: "rgba(239,83,80,0.15)", color: "#ef9a9a", border: "1px solid rgba(239,83,80,0.3)", borderRadius: 4, padding: "1px 5px", fontSize: 8, cursor: "pointer", lineHeight: "14px" }}
            >
              ✕
            </button>
          </div>
        )}
        {assigning && (
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              position: "absolute", top: "100%", left: "50%", transform: "translateX(-50%)", marginTop: 4,
              background: B.card, border: `1.5px solid ${B.bkp}`, borderRadius: 10, padding: 8, zIndex: 100, minWidth: 160,
              boxShadow: "0 12px 32px rgba(0,0,0,0.5)",
            }}
          >
            <div style={{ fontSize: 10, fontWeight: 700, color: B.bkpL, marginBottom: 5, textAlign: "center", textTransform: "uppercase", letterSpacing: 0.5 }}>
              Select Backup
            </div>
            {availableBackups.length > 0 && availableBackups[0].hoursScore > 0 && (
              <div style={{ fontSize: 8, color: B.dim, textAlign: "center", marginBottom: 4, fontStyle: "italic" }}>
                Ranked by proximity & weekly hours
              </div>
            )}
            {availableBackups.length === 0 ? (
              <div style={{ fontSize: 11, color: B.dim, textAlign: "center", padding: 6 }}>No available drivers</div>
            ) : (
              <div style={{ maxHeight: 220, overflowY: "auto" }}>
                {availableBackups.map((d, idx) => (
                  <div
                    key={d.id}
                    onClick={d.onSelect}
                    style={{
                      display: "flex", alignItems: "center", gap: 6, padding: "5px 8px", borderRadius: 6,
                      cursor: "pointer", fontSize: 11, fontWeight: 600, transition: "background 0.15s",
                      background: "transparent", marginBottom: 2, color: B.text,
                      borderLeft: idx === 0 && d.proximityScore > 0 ? `2px solid ${B.green}` : "2px solid transparent",
                    }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = B.bkpBg)}
                    onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
                  >
                    <PersonSVG size={14} color={idx === 0 && d.proximityScore > 0 ? B.green : B.bkp} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.label}</div>
                      {(d.hoursScore > 0 || d.proximityScore > 0) && (
                        <div style={{ fontSize: 8, color: B.dim, display: "flex", gap: 6, marginTop: 1 }}>
                          {d.hoursScore > 0 && <span>{d.hoursScore}h/wk</span>}
                          {d.totalMiles > 0 && <span>{d.totalMiles}mi</span>}
                          {d.proximityScore > 0 && <span style={{ color: B.greenL }}>{d.proximityScore} shared stops</span>}
                        </div>
                      )}
                    </div>
                    <span style={{ fontSize: 9, color: B.dim, flexShrink: 0 }}>(L{d.homeTruck})</span>
                  </div>
                ))}
              </div>
            )}
            <button
              onClick={() => onAssign()}
              style={{ width: "100%", marginTop: 5, background: B.surface, color: B.muted, border: `1px solid ${B.bdr}`, borderRadius: 6, padding: "4px 0", fontSize: 9, cursor: "pointer" }}
            >
              Cancel
            </button>
          </div>
        )}
      </div>
    );

    function JoyrideLogisticsDiagram() {
      const containerRef = useRef(null);
      const driverRefs = useRef({});
      const truckRefs = useRef({});
      const blockGroupRefs = useRef({});

      const [mode, setMode] = useState("current");
      const [positions, setPositions] = useState(null);
      const [cancelledBlocks, setCancelledBlocks] = useState({});
      const [droppedBlocks, setDroppedBlocks] = useState({});
      const [blockBackups, setBlockBackups] = useState({});
      const [cascadeCancelled, setCascadeCancelled] = useState({});
      const [assigningBlock, setAssigningBlock] = useState(null);
      const [hoveredDriver, setHoveredDriver] = useState(null);
      const [hoveredTruck, setHoveredTruck] = useState(null);
      const [selectedTruck, setSelectedTruck] = useState(null);

      // CSV state
      const [csvRows, setCsvRows] = useState(null);
      const [csvRegion, setCsvRegion] = useState("ALL");
      const [csvRegions, setCsvRegions] = useState([]);
      const [csvStats, setCsvStats] = useState(null);

      // Save/restore state per mode so switching tabs preserves work
      const savedStates = useRef({});

      const handleCSVUpload = (text) => {
        const rows = parseCSV(text);
        setCsvRows(rows);
        const initial = transformCSVData(rows, "ALL");
        setCsvRegions(initial.regions);
        setCsvRegion("ALL");
        setCsvStats({ drivers: initial.drivers.length, loads: initial.trucks.length, trips: initial.totalTrips });
        // Reset diagram state for fresh CSV view
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        savedStates.current = {};
      };

      const handleCSVClear = () => {
        setCsvRows(null);
        setCsvRegion("ALL");
        setCsvRegions([]);
        setCsvStats(null);
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        savedStates.current = {};
      };

      const handleRegionChange = (r) => {
        setCsvRegion(r);
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
      };

      // Build data from CSV or fallback to demo MODELS
      const data = csvRows ? transformCSVData(csvRows, csvRegion) : buildData(MODELS[mode]);
      const { drivers: DRIVERS, trucks: TRUCKS, blocksPerLoad, hasPrimarySecondary } = data;
      const BLOCK_NUMS = Array.from({ length: blocksPerLoad }, (_, i) => i + 1);

      const handleToggle = (newMode) => {
        if (newMode === mode) return;
        // Save current mode's state
        savedStates.current[mode] = {
          cancelledBlocks, droppedBlocks, blockBackups, cascadeCancelled,
        };
        // Clear refs for new layout
        driverRefs.current = {};
        truckRefs.current = {};
        blockGroupRefs.current = {};
        // Restore saved state for new mode, or start fresh
        const saved = savedStates.current[newMode];
        if (saved) {
          setCancelledBlocks(saved.cancelledBlocks);
          setDroppedBlocks(saved.droppedBlocks);
          setBlockBackups(saved.blockBackups);
          setCascadeCancelled(saved.cascadeCancelled);
        } else {
          setCancelledBlocks({});
          setDroppedBlocks({});
          setBlockBackups({});
          setCascadeCancelled({});
        }
        setAssigningBlock(null);
        setSelectedTruck(null);
        setHoveredDriver(null);
        setHoveredTruck(null);
        setMode(newMode);
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      const blockKey = (truckId, blockNum) => `${truckId}-${blockNum}`;

      const getOriginalDriver = (truckId, blockNum) => {
        const truck = TRUCKS.find((t) => t.id === truckId);
        if (!hasPrimarySecondary) return truck.primaryDriver;
        return blockNum % 2 === 1 ? truck.primaryDriver : truck.secondaryDriver;
      };

      const isDriverCalledOff = (driverId) => {
        for (const [key, cancelled] of Object.entries(cancelledBlocks)) {
          if (!cancelled) continue;
          if (cascadeCancelled[key]) continue; // Skip cascade-cancelled blocks
          const [tid, bnum] = key.split("-").map(Number);
          if (getOriginalDriver(tid, bnum) === driverId && !blockBackups[key]) return true;
        }
        return false;
      };

      const isDriverBackup = (driverId) => Object.values(blockBackups).includes(driverId);

      const getDriverBackupBlocks = (driverId) => {
        const blocks = [];
        for (const [key, bid] of Object.entries(blockBackups)) {
          if (bid === driverId) {
            const [tid, bnum] = key.split("-").map(Number);
            blocks.push({ truckId: tid, blockNum: bnum });
          }
        }
        return blocks;
      };

      const getAvailableForBlock = (truckId, blockNum) => {
        const usedAsBackup = new Set(Object.values(blockBackups));
        const truck = TRUCKS.find((t) => t.id === truckId);
        const loadFacilities = truck?.facilities || [];
        const available = DRIVERS.filter((d) => {
          if (usedAsBackup.has(d.id)) return false;
          if (d.id === truck.primaryDriver || d.id === truck.secondaryDriver) return false;
          for (const bk of Object.keys(cancelledBlocks)) {
            if (!cancelledBlocks[bk]) continue;
            if (cascadeCancelled[bk]) continue;
            const [tid, bn] = bk.split("-").map(Number);
            if (getOriginalDriver(tid, bn) === d.id && !blockBackups[bk]) return false;
          }
          return true;
        }).map((d) => {
          const homeTruck = TRUCKS.find((t) => t.primaryDriver === d.id || t.secondaryDriver === d.id);
          // Proximity score: count shared facilities between driver and the load
          const driverFacs = d.facilities || [];
          const sharedFacilities = driverFacs.filter(f => loadFacilities.includes(f));
          const proximityScore = sharedFacilities.length;
          // Hours score: fewer weekly hours = more available
          const hoursScore = d.estWeeklyHours || 0;
          return { ...d, homeTruck: homeTruck?.id, proximityScore, sharedFacilities, hoursScore };
        });

        // Sort: highest proximity first, then lowest hours first
        available.sort((a, b) => {
          if (b.proximityScore !== a.proximityScore) return b.proximityScore - a.proximityScore;
          return a.hoursScore - b.hoursScore;
        });

        return available;
      };

      const toggleBlockCancel = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setCancelledBlocks((prev) => {
          const next = { ...prev };
          if (next[key]) {
            delete next[key];
            setBlockBackups((bb) => { const n = { ...bb }; delete n[key]; return n; });
            setCascadeCancelled((cc) => { const n = { ...cc }; delete n[key]; return n; });
          } else {
            next[key] = true;
          }
          return next;
        });
        setAssigningBlock(null);
      };

      const assignBlockBackup = (truckId, blockNum, driverId) => {
        const key = blockKey(truckId, blockNum);
        setBlockBackups((prev) => ({ ...prev, [key]: driverId }));
        setAssigningBlock(null);

        // Cascade: cancel the SAME block number on the backup driver's home load
        const homeTruck = TRUCKS.find((t) => t.primaryDriver === driverId || t.secondaryDriver === driverId);
        if (homeTruck && getOriginalDriver(homeTruck.id, blockNum) === driverId) {
          const bk = blockKey(homeTruck.id, blockNum);
          if (!cancelledBlocks[bk]) {
            setCancelledBlocks((prev) => ({ ...prev, [bk]: true }));
            setCascadeCancelled((prev) => ({ ...prev, [bk]: true }));
          }
        }
      };

      const removeBlockBackup = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setBlockBackups((prev) => { const n = { ...prev }; delete n[key]; return n; });
      };

      const dropBlock = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setDroppedBlocks((prev) => ({ ...prev, [key]: true }));
        setAssigningBlock(null);
      };

      const undropBlock = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setDroppedBlocks((prev) => { const n = { ...prev }; delete n[key]; return n; });
      };

      const resetAll = () => {
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        delete savedStates.current[mode];
      };

      const measurePositions = useCallback(() => {
        if (!containerRef.current) return;
        const cr = containerRef.current.getBoundingClientRect();
        const ox = cr.left, oy = cr.top;
        const dp = {}, tp = {}, bp = {};
        for (const [id, el] of Object.entries(driverRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); dp[id] = { x: r.right - ox, y: r.top + r.height / 2 - oy }; }
        }
        for (const [id, el] of Object.entries(truckRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); tp[id] = { left: { x: r.left - ox, y: r.top + r.height / 2 - oy }, right: { x: r.right - ox, y: r.top + r.height / 2 - oy } }; }
        }
        for (const [id, el] of Object.entries(blockGroupRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); bp[id] = { x: r.left - ox, y: r.top + r.height / 2 - oy }; }
        }
        setPositions({ drivers: dp, trucks: tp, blocks: bp });
      }, [mode, csvRegion]);

      useEffect(() => {
        const t = setTimeout(measurePositions, 150);
        window.addEventListener("resize", measurePositions);
        return () => { clearTimeout(t); window.removeEventListener("resize", measurePositions); };
      }, [measurePositions]);

      useLayoutEffect(() => {
        measurePositions();
      }, [mode, csvRegion, measurePositions]);

      useEffect(() => {
        const t = setTimeout(measurePositions, 60);
        return () => clearTimeout(t);
      }, [cancelledBlocks, blockBackups, assigningBlock, measurePositions]);

      const getLineColor = (driverId, truckId) => {
        if (Object.entries(blockBackups).some(([k, v]) => v === driverId && k.startsWith(`${truckId}-`))) return B.bkp;
        const truck = TRUCKS.find((t) => t.id === truckId);
        if (hoveredDriver === driverId || hoveredTruck === truckId) return B.red;
        if (truck?.primaryDriver === driverId) return B.green;
        return B.gold;
      };

      const getLineOpacity = (driverId) => {
        if (hoveredDriver && hoveredDriver !== driverId) return 0.05;
        if (hoveredTruck && !TRUCKS.find((t) => t.id === hoveredTruck && (t.primaryDriver === driverId || t.secondaryDriver === driverId))) return 0.05;
        return 0.45;
      };

      const getLineWidth = (driverId) => (hoveredDriver === driverId ? 2.5 : 1.2);

      const connections = [];
      for (const truck of TRUCKS) {
        connections.push({ driverId: truck.primaryDriver, truckId: truck.id, type: "primary" });
        if (hasPrimarySecondary && truck.secondaryDriver) {
          connections.push({ driverId: truck.secondaryDriver, truckId: truck.id, type: "secondary" });
        }
      }
      const backupConnectionsAdded = new Set();
      for (const [key, driverId] of Object.entries(blockBackups)) {
        const [tid] = key.split("-").map(Number);
        const connKey = `${driverId}-${tid}`;
        if (!backupConnectionsAdded.has(connKey)) {
          connections.push({ driverId, truckId: tid, type: "backup" });
          backupConnectionsAdded.add(connKey);
        }
      }

      const cancelCount = Object.keys(cancelledBlocks).length;
      const backupCount = Object.keys(blockBackups).length;
      const droppedCount = Object.keys(droppedBlocks).length;

      const HEADER_H = 36;
      const SLOT_H = hasPrimarySecondary ? 116 : 90;
      const DRIVER_H = hasPrimarySecondary ? SLOT_H / 2 : SLOT_H;
      const ROW = { boxSizing: "border-box" };

      return (
        <div style={{ fontFamily: "'Montserrat', 'Inter', system-ui, sans-serif", background: B.bg, minHeight: "100vh", color: B.text }}>

          <div style={{
            background: B.header, padding: "14px 28px",
            display: "flex", alignItems: "center", justifyContent: "space-between",
            borderBottom: `2px solid ${B.red}`,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <JoyrideLogo height={36} />
              <div style={{ width: 1, height: 24, background: "rgba(255,255,255,0.12)" }} />
              <span style={{ fontSize: 13, fontWeight: 600, color: B.muted, letterSpacing: 0.5 }}>Fleet Operations</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
              {!csvRows && <ModelToggle mode={mode} onToggle={handleToggle} />}
              {csvRows && csvRegions.length > 0 && (
                <RegionTabs regions={csvRegions} active={csvRegion} onSelect={handleRegionChange} />
              )}
              <CSVUpload onUpload={handleCSVUpload} onClear={handleCSVClear} hasData={!!csvRows} />
              {csvStats && (
                <div style={{ fontSize: 10, color: B.greenL, fontWeight: 600 }}>
                  {csvStats.drivers} drivers · {csvStats.loads} seats · {csvStats.trips} trips
                </div>
              )}
              {cancelCount > 0 && (
                <div style={{ fontSize: 12, color: "#ef9a9a", fontWeight: 500 }}>
                  {cancelCount} block{cancelCount > 1 ? "s" : ""} called off
                  {backupCount > 0 && ` · ${backupCount} backup${backupCount > 1 ? "s" : ""}`}
                  {droppedCount > 0 && ` · ${droppedCount} dropped`}
                </div>
              )}
              {(cancelCount > 0 || backupCount > 0 || droppedCount > 0) && (
                <button onClick={resetAll} style={{
                  backgroundImage: B.grad, backgroundSize: "200% auto",
                  color: "#fff", border: "none", borderRadius: 4, padding: "7px 18px",
                  fontSize: 11, fontWeight: 700, cursor: "pointer",
                  fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
                  letterSpacing: 1, transition: "background-position 0.4s",
                }}
                  onMouseEnter={(e) => (e.currentTarget.style.backgroundPosition = "right center")}
                  onMouseLeave={(e) => (e.currentTarget.style.backgroundPosition = "left center")}
                >Reset All</button>
              )}
            </div>
          </div>

          <div style={{
            display: "flex", gap: 20, padding: "10px 28px",
            background: B.card, borderBottom: `1px solid ${B.bdr}`,
            fontSize: 12, flexWrap: "wrap", alignItems: "center",
          }}>
            <span style={{ fontWeight: 700, color: B.redLight, textTransform: "uppercase", letterSpacing: 1, fontSize: 11 }}>Legend</span>
            {[
              { color: B.green, label: hasPrimarySecondary ? "Primary Driver" : "Assigned Driver", type: "line" },
              ...(hasPrimarySecondary ? [{ color: B.gold, label: "Secondary Driver", type: "line" }] : []),
              { color: B.bkp, label: "Backup Assigned", type: "line" },
              { color: B.cancelRed, label: "Cancelled Block", type: "dot" },
            ].map((item) => (
              <span key={item.label} style={{ display: "flex", alignItems: "center", gap: 6, color: B.muted }}>
                <span style={{
                  width: item.type === "dot" ? 10 : 20, height: item.type === "dot" ? 10 : 2.5,
                  background: item.color, display: "inline-block",
                  borderRadius: item.type === "dot" ? 2 : 1,
                }} />
                {item.label}
              </span>
            ))}
            <span style={{ color: B.dim, marginLeft: "auto", fontStyle: "italic", fontSize: 11 }}>
              {hasPrimarySecondary
                ? "Click a block to cancel · Assign backup from dropdown"
                : "1 driver per load · 3 blocks per load · Click a block to cancel"
              }
            </span>
          </div>

          <div key={`${mode}-${csvRegion}`} ref={containerRef} style={{ position: "relative", display: "flex", padding: "24px 20px", gap: 0, background: B.bg }}>

            {positions && (
              <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 1 }}>
                {connections.map(({ driverId, truckId, type }) => {
                  const dp = positions.drivers[driverId];
                  const bp = positions.blocks[truckId];
                  if (!dp || !bp) return null;
                  const color = getLineColor(driverId, truckId);
                  const dx = bp.x - dp.x;
                  const cpX = dx * 0.4;
                  const w = type === "backup" ? 2 : hoveredDriver === driverId ? 2 : 1.5;
                  const op = getLineOpacity(driverId);
                  const dash = type === "backup" ? "6,3" : "none";
                  const useStraight = !hasPrimarySecondary && type !== "backup";
                  return (
                    <g key={`${type}-d${driverId}-t${truckId}`}>
                      {useStraight ? (
                        <line
                          x1={dp.x} y1={dp.y} x2={bp.x} y2={bp.y}
                          stroke={color} strokeWidth={w} opacity={op} strokeDasharray={dash}
                        />
                      ) : (
                        <path
                          d={`M${dp.x},${dp.y} C${dp.x + cpX},${dp.y} ${bp.x - cpX},${bp.y} ${bp.x},${bp.y}`}
                          stroke={color} strokeWidth={w} fill="none"
                          opacity={op} strokeDasharray={dash}
                        />
                      )}
                      <circle cx={dp.x} cy={dp.y} r={2.5} fill={color} opacity={op * 1.5} />
                    </g>
                  );
                })}
              </svg>
            )}

            <div style={{ flex: csvRows ? "0 0 200px" : "0 0 150px", display: "flex", flexDirection: "column", zIndex: 2, paddingRight: 8 }}>
              <div style={{
                fontSize: 12, fontWeight: 700, color: B.redLight, textAlign: "center",
                textTransform: "uppercase", letterSpacing: 1.5, height: HEADER_H,
                display: "flex", alignItems: "center", justifyContent: "center",
                borderBottom: `1px solid ${B.bdr}`, boxSizing: "border-box",
              }}>
                {DRIVERS.length} Drivers
              </div>
              {DRIVERS.map((d) => {
                const load = TRUCKS.find((t) => t.primaryDriver === d.id || t.secondaryDriver === d.id);
                const isPrimary = load?.primaryDriver === d.id;
                const isBkp = isDriverBackup(d.id);
                const isHov = hoveredDriver === d.id;
                const bkpBlocks = getDriverBackupBlocks(d.id);
                return (
                  <div key={d.id} ref={(el) => (driverRefs.current[d.id] = el)}
                    onMouseEnter={() => setHoveredDriver(d.id)} onMouseLeave={() => setHoveredDriver(null)}
                    style={{
                      ...ROW, display: "flex", alignItems: "center", gap: 6, padding: "0 10px",
                      height: DRIVER_H, borderRadius: 8,
                      background: isBkp ? B.bkpBg : isHov ? B.redSub : "transparent",
                      border: isBkp ? `1.5px solid rgba(186,104,200,0.3)` : isHov ? `1.5px solid rgba(193,59,64,0.3)` : `1.5px solid transparent`,
                      transition: "all 0.2s ease",
                    }}
                  >
                    <PersonSVG size={16} color={isBkp ? B.bkp : isHov ? B.red : isPrimary ? B.green : B.gold} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: csvRows ? 11 : 12, fontWeight: 600, color: B.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {d.label}
                      </div>
                      {csvRows && d.estWeeklyHours > 0 && (
                        <div style={{ fontSize: 8, color: B.dim, display: "flex", gap: 4 }}>
                          <span>{d.estWeeklyHours}h/wk</span>
                          <span>·</span>
                          <span>{d.totalMiles}mi</span>
                          <span>·</span>
                          <span>{d.tripCount} trips</span>
                        </div>
                      )}
                    </div>
                    {isBkp && <span style={{ fontSize: 8, color: B.bkpL, fontWeight: 700 }}>BKP</span>}
                    {bkpBlocks.length > 0 && (
                      <span style={{ fontSize: 8, color: B.bkpL }}>L{bkpBlocks[0].truckId}B{bkpBlocks[0].blockNum}</span>
                    )}
                    <span style={{
                      width: 7, height: 7, borderRadius: "50%", flexShrink: 0,
                      background: isBkp ? B.bkp : isPrimary ? B.green : B.gold,
                    }} />
                  </div>
                );
              })}
            </div>

            <div style={{ flex: 1, display: "flex", flexDirection: "column", zIndex: 4, paddingLeft: 30 }}>
              <div style={{
                fontSize: 12, fontWeight: 700, color: B.redLight, textAlign: "center",
                textTransform: "uppercase", letterSpacing: 1.5, height: HEADER_H,
                display: "flex", alignItems: "center", justifyContent: "center",
                borderBottom: `1px solid ${B.bdr}`, boxSizing: "border-box",
              }}>
                {csvRows
                  ? `${TRUCKS.length} Seats${csvRegion !== "ALL" ? ` (${csvRegion})` : ""} · Up to ${blocksPerLoad} Blocks`
                  : `${TRUCKS.length} Loads · ${blocksPerLoad} Blocks Each`
                }
              </div>
              {TRUCKS.map((load) => {
                const isHl = hoveredTruck === load.id || selectedTruck === load.id;
                return (
                  <div key={load.id} ref={(el) => (blockGroupRefs.current[load.id] = el)}
                    onClick={() => setSelectedTruck(selectedTruck === load.id ? null : load.id)}
                    style={{ ...ROW, display: "flex", gap: 18, alignItems: "center", height: SLOT_H, cursor: "pointer" }}
                    onMouseEnter={() => setHoveredTruck(load.id)} onMouseLeave={() => setHoveredTruck(null)}
                  >
                    <div style={{
                      fontSize: csvRows ? 8 : 10, fontWeight: 700, color: isHl ? B.redLight : B.muted,
                      width: csvRows ? 48 : 28, textAlign: "center", flexShrink: 0, lineHeight: 1.2,
                    }}>
                      {load.operatorId ? load.operatorId.split("_").slice(-1)[0] : `L${load.id}`}
                    </div>
                    {BLOCK_NUMS.map((bn) => {
                      const key = blockKey(load.id, bn);
                      const origDriver = getOriginalDriver(load.id, bn);
                      const isCancelled = !!cancelledBlocks[key];
                      const backup = blockBackups[key];
                      const isAssigning = assigningBlock === key;
                      const available = isAssigning ? getAvailableForBlock(load.id, bn) : [];
                      return (
                        <BlockNode
                          key={bn}
                          label={`B${bn}`}
                          driverLabel={origDriver ? `D${origDriver}` : "—"}
                          highlight={isHl}
                          cancelled={isCancelled}
                          dropped={!!droppedBlocks[key]}
                          backupAssigned={backup}
                          assigning={isAssigning}
                          availableBackups={available.map((d) => ({ ...d, onSelect: () => assignBlockBackup(load.id, bn, d.id) }))}
                          onCancel={() => toggleBlockCancel(load.id, bn)}
                          onAssign={() => setAssigningBlock(isAssigning ? null : key)}
                          onRemoveBackup={() => removeBlockBackup(load.id, bn)}
                          onDrop={() => dropBlock(load.id, bn)}
                          onUndrop={() => undropBlock(load.id, bn)}
                        />
                      );
                    })}
                    <div style={{ display: "flex", flexDirection: "column", gap: 2, marginLeft: 8, fontSize: 9, color: B.dim, whiteSpace: "nowrap" }}>
                      {hasPrimarySecondary ? (
                        <>
                          <span style={{ color: B.green }}>P: D{load.primaryDriver} → B1, B3</span>
                          <span style={{ color: B.gold }}>S: D{load.secondaryDriver} → B2, B4</span>
                        </>
                      ) : (
                        <span style={{ color: B.green }}>D{load.primaryDriver} → B1, B2, B3</span>
                      )}
                      <span style={{ color: B.subtle }}>10hr rest between</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {selectedTruck && (() => {
            const truck = TRUCKS.find((t) => t.id === selectedTruck);
            if (!truck) return null;
            const timeline = [];
            for (let bn = 1; bn <= blocksPerLoad; bn++) {
              const key = blockKey(truck.id, bn);
              const origDriver = getOriginalDriver(truck.id, bn);
              const effDriver = blockBackups[key] || origDriver;
              const isCancelled = !!cancelledBlocks[key];
              const isPrimary = hasPrimarySecondary ? bn % 2 === 1 : true;
              timeline.push({
                label: `Block ${bn}`, driver: `Driver ${effDriver}`,
                type: isCancelled && !blockBackups[key] ? "cancelled" : isPrimary ? "primary" : "secondary",
                isBackup: !!blockBackups[key],
              });
              if (bn < blocksPerLoad) timeline.push({ label: "10hr Rest", type: "break" });
            }
            return (
              <div style={{
                margin: "0 20px 16px", background: B.card,
                border: `1px solid rgba(193,59,64,0.2)`, borderRadius: 12, padding: 16,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 8, background: B.redSub, border: `1.5px solid ${B.red}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: B.redLight }}>L{selectedTruck}</div>
                  <div>
                    <h4 style={{ margin: 0, color: B.white, fontSize: 14, fontWeight: 700 }}>
                      Load {selectedTruck} — Rotation Schedule
                    </h4>
                    <p style={{ margin: "2px 0 0", fontSize: 12, color: B.muted }}>
                      {hasPrimarySecondary
                        ? "Drivers alternate blocks with mandatory 10-hour rest. Click blocks above to simulate cancellations."
                        : "Single driver handles all blocks with mandatory 10-hour rest. Click blocks above to simulate cancellations."
                      }
                    </p>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 0, flexWrap: "wrap" }}>
                  {timeline.map((step, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center" }}>
                      <div style={{
                        padding: "6px 12px", borderRadius: 8, fontSize: 11, fontWeight: 600, textAlign: "center",
                        background: step.type === "break" ? B.goldBg : step.type === "cancelled" ? B.cancelBg : step.type === "primary" ? B.greenBg : B.goldBg,
                        color: step.type === "break" ? B.gold : step.type === "cancelled" ? B.cancelRed : step.isBackup ? B.bkpL : step.type === "primary" ? B.greenL : B.gold,
                        border: step.type === "break" ? `1px dashed rgba(255,213,79,0.3)` : step.type === "cancelled" ? `1px solid rgba(239,83,80,0.3)` : step.type === "primary" ? `1px solid rgba(102,187,106,0.3)` : `1px solid rgba(255,213,79,0.3)`,
                      }}>
                        <div>{step.label}</div>
                        {step.driver && (
                          <div style={{ fontSize: 9, opacity: 0.85, marginTop: 2 }}>
                            {step.driver}{step.isBackup ? " (BKP)" : ""}{step.type === "cancelled" ? " OPEN" : ""}
                          </div>
                        )}
                      </div>
                      {i < timeline.length - 1 && (
                        <svg width="20" height="8" viewBox="0 0 20 8" style={{ flexShrink: 0 }}>
                          <line x1="0" y1="4" x2="13" y2="4" stroke={B.subtle} strokeWidth="1" />
                          <path d="M12,1 L18,4 L12,7" fill={B.subtle} />
                        </svg>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}

          <div style={{
            padding: "12px 28px", borderTop: `1px solid ${B.bdr}`, background: B.header,
            display: "flex", alignItems: "center", justifyContent: "center",
            gap: 10, fontSize: 11, color: B.subtle,
          }}>
