                                    borderTop: stageColor ? `3px solid ${stageColor}` : undefined,
                                    borderRadius: 10, padding: "8px 5px", textAlign: "center",
                                  }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 2px" }}>
                                      <span style={{ fontSize: 6, color: B.bkpL, fontWeight: 600 }}>BKP</span>
                                      <span style={{ fontSize: 6, color: B.dim }}>{seatLabel}{durationHrs ? ` · ${durationHrs}h` : ""}</span>
                                    </div>
                                    <div style={{ fontSize: 9, fontWeight: 700, color: B.bkpL, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                      {blk.blockId.slice(0, 8)}
                                    </div>
                                    {blk.blockStart && (
                                      <div style={{ fontSize: 7, color: B.dim, marginTop: 2, lineHeight: 1.3 }}>
                                        <div style={{ color: B.greenL }}>{formatBlockTime(blk.blockStart)}</div>
                                        <div style={{ color: B.gold }}>{formatBlockTime(blk.blockEnd)}</div>
                                      </div>
                                    )}
                                  </div>
                                ) : (
                                <BlockNode
                                  label={blk.blockId.slice(0, 8)}
                                  driverLabel=""
                                  driverName=""
                                  highlight={false}
                                  cancelled={isCancelled}
                                  dropped={!!droppedBlocks[key]}
                                  backupAssigned={backup}
                                  backupName={backup ? getDriverName(backup) : null}
                                  assigning={isAssigning}
                                  compact={true}
                                  stageColor={stageColor}
                                  blockStart={blk.blockStart}
                                  blockEnd={blk.blockEnd}
                                  seatLabel={seatLabel}
                                  durationHrs={durationHrs}
                                  tooltip={`${blk.blockId}\nSeat: ${blk.truckLabel}\n${blk.trips.length} trips · ${blk.totalMiles} mi${durationHrs ? ` · ${durationHrs}h` : ""}\n${blk.blockStart ? `Start: ${blk.blockStart}` : ""}\n${blk.blockEnd ? `End: ${blk.blockEnd}` : ""}\n${blk.trips.map(t => `${t.stop1} → ${t.stop2}`).join('\n')}`}
                                  availableBackups={available.map((ad) => ({ ...ad, onSelect: () => requestBackupAssignment(blk.truckId, bn, ad.id) }))}
                                  onCancel={() => toggleBlockCancel(blk.truckId, bn)}
                                  onAssign={() => setAssigningBlock(isAssigning ? null : key)}
                                  onRemoveBackup={() => removeBlockBackup(blk.truckId, bn)}
                                  onDrop={() => dropBlock(blk.truckId, bn)}
                                  onUndrop={() => undropBlock(blk.truckId, bn)}
                                />
                                )}
                              </div>
                            );
                          })}

                          {/* Suggest block "+" slot — only if driver has room */}
                          {allBlocks.length < MAX_BLOCKS_PER_WEEK && (() => {
                            // Compute the next available window for this driver
                            const REST_MS = 10 * 3600000;
                            const existingEnds = allBlocks
                              .map(b => parseBlockDate(b.blockEnd || ""))
                              .filter(t => t !== Infinity)
                              .sort((a, b) => a - b);
                            const latestEnd = existingEnds.length > 0 ? existingEnds[existingEnds.length - 1] : null;
                            const earliestAvail = latestEnd ? new Date(latestEnd + REST_MS) : null;

                            // Suggest start time based on preferred start
                            let suggestedTime = "";
                            if (earliestAvail) {
                              const prefHour = d.avgStartHour || d.modeStartHour;
                              if (prefHour !== null && prefHour !== undefined) {
                                // Find the next occurrence of preferred hour after earliestAvail
                                const availDate = new Date(earliestAvail);
                                const suggestDate = new Date(availDate);
                                suggestDate.setHours(Math.floor(prefHour), Math.round((prefHour % 1) * 60), 0, 0);
                                if (suggestDate <= availDate) suggestDate.setDate(suggestDate.getDate() + 1);
                                const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                                const h = suggestDate.getHours();
                                const m = suggestDate.getMinutes();
                                const h12 = h % 12 || 12;
                                const ap = h >= 12 ? "p" : "a";
                                suggestedTime = `${months[suggestDate.getMonth()]} ${suggestDate.getDate()} ${h12}${m > 0 ? `:${m.toString().padStart(2,"0")}` : ""}${ap}`;
                              } else {
                                // No preference — just show earliest available
                                const ad = new Date(earliestAvail);
                                const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                                const h = ad.getHours();
                                const h12 = h % 12 || 12;
                                const ap = h >= 12 ? "p" : "a";
                                suggestedTime = `${months[ad.getMonth()]} ${ad.getDate()} ${h12}${ap}+`;
                              }
                            }

                            const isSuggesting = suggestingFor === d.id;
                            const suggestedBlocks = isSuggesting ? getSuggestedBlocks(d.id) : [];

                            return (
                              <div key="suggest" style={{ width: 100, flexShrink: 0, position: "relative", zIndex: isSuggesting ? 100 : 1 }}
                                title={suggestedTime ? `Suggested next block: ${suggestedTime}\nClick to see available blocks` : "Click to see available blocks"}>
                                <div
                                  onClick={(e) => { e.stopPropagation(); setSuggestingFor(isSuggesting ? null : d.id); }}
                                  style={{
                                    width: "100%", borderRadius: 10, padding: "8px 5px", textAlign: "center",
                                    border: isSuggesting ? `2px solid ${B.green}` : `2px dashed rgba(102,187,106,0.25)`,
                                    background: isSuggesting ? "rgba(102,187,106,0.08)" : "rgba(102,187,106,0.03)",
                                    cursor: "pointer", transition: "all 0.2s",
                                  }}>
                                  <div style={{ fontSize: 16, color: B.green, fontWeight: 300, lineHeight: 1 }}>+</div>
                                  <div style={{ fontSize: 7, color: B.greenL, fontWeight: 600, marginTop: 2 }}>SUGGEST</div>
                                  {suggestedTime && (
                                    <div style={{ fontSize: 7, color: B.dim, marginTop: 2, lineHeight: 1.3 }}>
                                      <div style={{ color: B.greenL }}>{suggestedTime}</div>
                                    </div>
                                  )}
                                </div>
                                {/* Suggestion dropdown */}
                                {isSuggesting && (
                                  <div onClick={(e) => e.stopPropagation()} style={{
                                    position: "absolute", top: "100%", left: "50%", transform: "translateX(-50%)", marginTop: 4,
                                    background: B.card, border: `1.5px solid ${B.green}`, borderRadius: 10, padding: 8, zIndex: 500,
                                    minWidth: 260, maxHeight: 280, overflowY: "auto",
                                    boxShadow: "0 12px 32px rgba(0,0,0,0.7)",
                                  }}>
                                    <div style={{ fontSize: 10, fontWeight: 700, color: B.greenL, marginBottom: 4, textAlign: "center", textTransform: "uppercase", letterSpacing: 0.5 }}>
                                      Available Blocks
                                    </div>
                                    <div style={{ fontSize: 8, color: B.dim, textAlign: "center", marginBottom: 6, fontStyle: "italic" }}>
                                      Fit schedule, same domicile, 10h rest
                                    </div>
                                    {suggestedBlocks.length === 0 ? (
                                      <div style={{ fontSize: 10, color: B.dim, textAlign: "center", padding: 12 }}>
                                        No cancelled blocks match this driver's schedule
                                      </div>
                                    ) : (
                                      suggestedBlocks.map((sb, si) => (
                                        <div key={sb.blockId}
                                          onClick={() => {
                                            // Assign this driver as backup for the suggested block
                                            requestBackupAssignment(sb.truckId, sb.bn, d.id);
                                            setSuggestingFor(null);
                                          }}
                                          style={{
                                            display: "flex", alignItems: "center", gap: 6, padding: "6px 8px", borderRadius: 6,
                                            cursor: "pointer", fontSize: 10, fontWeight: 600, transition: "all 0.15s",
                                            background: si === 0 ? "rgba(102,187,106,0.06)" : "transparent",
                                            borderLeft: si === 0 ? `3px solid ${B.green}` : "3px solid transparent",
                                            color: B.text, marginBottom: 2,
                                          }}
                                          onMouseEnter={(e) => (e.currentTarget.style.background = B.greenBg)}
                                          onMouseLeave={(e) => (e.currentTarget.style.background = si === 0 ? "rgba(102,187,106,0.06)" : "transparent")}
                                        >
                                          <div style={{ flex: 1, minWidth: 0 }}>
                                            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                                              <span style={{ fontWeight: 700 }}>{sb.blockId.slice(0, 10)}</span>
                                              {si === 0 && <span style={{ fontSize: 7, color: B.green, fontWeight: 700, background: B.greenBg, padding: "1px 4px", borderRadius: 3 }}>★ BEST</span>}
                                              {sb.startScore > 0 && <span style={{ fontSize: 7, color: sb.startScore > 7 ? B.greenL : B.gold }}>⏰ {sb.startScore}/10</span>}
                                            </div>
                                            <div style={{ display: "flex", gap: 4, marginTop: 2, fontSize: 8, color: B.dim }}>
                                              <span style={{ color: B.greenL }}>{sb.blockStart}</span>
                                              <span>→</span>
                                              <span style={{ color: B.gold }}>{sb.blockEnd}</span>
                                              {sb.durationHrs && <span>· {sb.durationHrs}h</span>}
                                            </div>
                                            <div style={{ fontSize: 7, color: B.dim, marginTop: 1 }}>
                                              Seat {sb.seatLabel} · was {sb.originalDriver}
                                            </div>
                                          </div>
                                        </div>
                                      ))
                                    )}
                                    <button onClick={() => setSuggestingFor(null)}
                                      style={{ width: "100%", marginTop: 5, background: B.surface, color: B.muted, border: `1px solid ${B.bdr}`, borderRadius: 6, padding: "4px 0", fontSize: 9, cursor: "pointer" }}>
                                      Close
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })()}
                          {/* Remaining empty slots after suggestion */}
                          {Array.from({ length: Math.max(0, 2 - allBlocks.length) }).map((_, i) => (
                            <div key={`empty-${i}`} style={{ width: 120, flexShrink: 0 }}>
                              <div style={{
                                width: "100%", height: 42, borderRadius: 8,
                                border: `1px dashed rgba(255,255,255,0.04)`,
                              }} />
                            </div>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          )}

          {/* ═══ DEMO MODE: Two-column layout with connection lines ═══ */}
          {!csvRows && !scheduleTab && (
          <div key={`${mode}-${csvRegion}`} ref={containerRef} style={{ position: "relative", display: "flex", padding: "24px 20px", gap: 0, background: B.bg }}>

            {positions && effectiveShowLines && (
              <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 1 }}>
                {connections.filter(({ driverId, truckId, type }) => {
                  return true;
                }).map(({ driverId, truckId, type }) => {
                  const dp = positions.drivers[driverId];
                  const bp = positions.blocks[truckId];
                  if (!dp || !bp) return null;
                  const color = getLineColor(driverId, truckId);
                  const dx = bp.x - dp.x;
                  const cpX = dx * 0.4;
                  const w = type === "backup" ? 2 : hoveredDriver === driverId ? 2 : 1.5;
                  const op = getLineOpacity(driverId);
                  const dash = type === "backup" ? "6,3" : "none";
                  const useStraight = !hasPrimarySecondary && type !== "backup";
                  return (
                    <g key={`${type}-d${driverId}-t${truckId}`}>
                      {useStraight ? (
                        <line
                          x1={dp.x} y1={dp.y} x2={bp.x} y2={bp.y}
                          stroke={color} strokeWidth={w} opacity={op} strokeDasharray={dash}
                        />
                      ) : (
                        <path
                          d={`M${dp.x},${dp.y} C${dp.x + cpX},${dp.y} ${bp.x - cpX},${bp.y} ${bp.x},${bp.y}`}
                          stroke={color} strokeWidth={w} fill="none"
                          opacity={op} strokeDasharray={dash}
                        />
                      )}
                      <circle cx={dp.x} cy={dp.y} r={2.5} fill={color} opacity={op * 1.5} />
                    </g>
                  );
                })}
              </svg>
            )}

            <div style={{ flex: "0 0 150px", display: "flex", flexDirection: "column", zIndex: 2, paddingRight: 8 }}>
              <div style={{
                height: csvRows ? HEADER_H + 20 : HEADER_H, display: "flex", flexDirection: "column", justifyContent: "center", gap: 4,
                borderBottom: `1px solid ${B.bdr}`, boxSizing: "border-box", padding: "2px 4px",
                position: "sticky", top: 0, background: B.bg, zIndex: 5,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 10, fontWeight: 700, color: B.redLight, textTransform: "uppercase", letterSpacing: 1, flexShrink: 0 }}>
                    {DRIVERS.length}
                  </span>
                  {csvRows ? (
                    <input
                      type="text" placeholder="Search drivers..." value={driverSearch}
                      onChange={(e) => setDriverSearch(e.target.value)}
                      style={{
                        flex: 1, background: "rgba(255,255,255,0.05)", border: `1px solid ${B.bdr}`,
                        borderRadius: 4, padding: "3px 8px", fontSize: 10, color: B.text,
                        outline: "none", fontFamily: "'Montserrat', sans-serif",
                      }}
                      onFocus={(e) => (e.target.style.borderColor = B.red)}
                      onBlur={(e) => (e.target.style.borderColor = B.bdr)}
                    />
                  ) : (
                    <span style={{ fontSize: 11, fontWeight: 700, color: B.redLight, textTransform: "uppercase", letterSpacing: 1 }}>Drivers</span>
                  )}
                </div>
                {csvRows && (
                  <div style={{ display: "flex", gap: 2 }}>
                    {[
                      { key: "default", label: "Default" },
                      { key: "available", label: "Avail ↑" },
                      { key: "name", label: "A-Z" },
                      { key: "miles", label: "Miles ↓" },
                    ].map(s => (
                      <button key={s.key} onClick={() => setDriverSort(s.key)} style={{
                        padding: "1px 6px", borderRadius: 3, fontSize: 8, fontWeight: 600,
                        cursor: "pointer", fontFamily: "'Montserrat', sans-serif", border: "none",
                        background: driverSort === s.key ? "rgba(193,59,64,0.2)" : "rgba(255,255,255,0.04)",
                        color: driverSort === s.key ? B.redLight : B.dim,
                        transition: "all 0.15s",
                      }}>{s.label}</button>
                    ))}
                  </div>
                )}
              </div>
              {DRIVERS.filter(d => !driverSearch || d.label.toLowerCase().includes(driverSearch.toLowerCase()))
                .sort((a, b) => {
                  if (driverSort === "available") return (a.blockCount || 0) - (b.blockCount || 0);
                  if (driverSort === "name") return a.label.localeCompare(b.label);
                  if (driverSort === "miles") return (b.totalMiles || 0) - (a.totalMiles || 0);
                  return 0;
                })
                .map((d) => {
                const load = TRUCKS.find((t) => t.primaryDriver === d.id || t.secondaryDriver === d.id);
                const isPrimary = load?.primaryDriver === d.id;
                const isBkp = isDriverBackup(d.id);
                const isHov = hoveredDriver === d.id;
                const bkpBlocks = getDriverBackupBlocks(d.id);
                const isMaxed = csvRows && d.blockCount >= MAX_BLOCKS_PER_WEEK;
                const isSel = selectedDriver === d.id;
                return (
                  <div key={d.id} ref={(el) => (driverRefs.current[d.id] = el)}
                    title={csvRows ? `${d.label}\n${d.blockCount}/${MAX_BLOCKS_PER_WEEK} blocks · ${d.totalMiles}mi · ${d.tripCount} trips\n${d.hosSource ? `HOS: ${d.hosStatus || "unknown"} · ${d.hosDutyRemaining != null ? Math.round(d.hosDutyRemaining / 60) + "h duty left" : ""}` : `${d.estWeeklyHours || 0}h est/wk`}\nFacilities: ${(d.facilities || []).slice(0, 6).join(", ")}${(d.facilities || []).length > 6 ? ` +${d.facilities.length - 6} more` : ""}` : ""}
                    onMouseEnter={() => setHoveredDriver(d.id)} onMouseLeave={() => setHoveredDriver(null)}
                    onClick={(e) => {
                      e.stopPropagation();
                      const newSel = isSel ? null : d.id;
                      setSelectedDriver(newSel);
                      setSelectedTruck(null);
                      // Auto-scroll to the driver's load
                      if (newSel && load) {
                        const loadEl = blockGroupRefs.current[load.id];
                        if (loadEl) loadEl.scrollIntoView({ behavior: "smooth", block: "center" });
                      }
                    }}
                    style={{
                      ...ROW, display: "flex", alignItems: "center", gap: 6, padding: "0 10px",
                      height: DRIVER_H, borderRadius: 8, cursor: "pointer",
                      opacity: isMaxed && !isSel && !isBkp ? 0.85 : 1,
                      background: isSel ? "rgba(193,59,64,0.15)" : isBkp ? B.bkpBg : isHov ? B.redSub : "transparent",
                      border: isSel ? `2px solid ${B.red}` : isBkp ? `1.5px solid rgba(186,104,200,0.3)` : isHov ? `1.5px solid rgba(193,59,64,0.3)` : `1.5px solid transparent`,
                      transition: "all 0.2s ease",
                    }}
                  >
                    <PersonSVG size={16} color={isMaxed ? B.dim : isBkp ? B.bkp : isHov ? B.red : isPrimary ? B.green : B.gold} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{
                        fontSize: csvRows ? 11 : 12, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        color: isMaxed ? B.dim : B.text, display: "flex", alignItems: "center", gap: 4,
                      }}>
                        {d.hosSource && d.hosStatus && (
                          <span style={{
                            width: 6, height: 6, borderRadius: "50%", flexShrink: 0,
                            background: d.hosStatus === "driving" ? B.green
                              : d.hosStatus === "on_duty" ? B.gold
                              : d.hosStatus === "sleeper_berth" ? "#64b5f6"
                              : "rgba(255,255,255,0.2)",
                            border: d.hosStatus === "off_duty" ? `1.5px solid ${B.dim}` : "none",
                            boxShadow: d.hosStatus === "driving" ? `0 0 4px ${B.green}` : "none",
                          }} />
                        )}
                        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.label}</span>
                      </div>
                      {csvRows && (
                        <div style={{ display: "flex", flexDirection: "column", gap: 2, marginTop: 2 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <div style={{ flex: 1, height: 3, borderRadius: 2, background: "rgba(255,255,255,0.06)", overflow: "hidden" }}>
                              <div style={{
                                height: "100%", borderRadius: 2, transition: "width 0.3s",
                                width: `${Math.min((d.blockCount / MAX_BLOCKS_PER_WEEK) * 100, 100)}%`,
                                background: d.blockCount >= MAX_BLOCKS_PER_WEEK ? B.cancelRed : d.blockCount >= MAX_BLOCKS_PER_WEEK - 1 ? B.gold : B.green,
                              }} />
                            </div>
                            <span style={{ fontSize: 8, color: d.blockCount >= MAX_BLOCKS_PER_WEEK ? B.cancelRed : B.dim, flexShrink: 0, fontWeight: d.blockCount >= MAX_BLOCKS_PER_WEEK ? 700 : 400 }}>
                              {d.blockCount}/{MAX_BLOCKS_PER_WEEK}
                            </span>
                          </div>
                          <div style={{ fontSize: 7, color: B.dim, display: "flex", gap: 3 }}>
                            {d.hosSource ? (
                              <>
                                <span style={{ color: d.hosDutyRemaining > 480 ? B.greenL : d.hosDutyRemaining > 240 ? B.gold : B.cancelRed }}>
                                  {Math.round((d.hosDutyRemaining || 0) / 60)}h duty
                                </span>
                                <span>·</span>
                                <span>{d.tripCount}t</span>
                              </>
                            ) : (
                              <>
                                <span>{d.totalMiles}mi</span>
                                <span>·</span>
                                <span>{d.tripCount}t</span>
                              </>
                            )}
                            {isMaxed && (
                              <>
                                <span>·</span>
                                <span style={{ color: B.cancelRed, fontWeight: 600 }}>FULL</span>
                              </>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                    {csvRows && load && (
                      <span style={{
                        fontSize: 7, color: B.dim, fontWeight: 600, padding: "1px 4px",
                        background: "rgba(255,255,255,0.04)", borderRadius: 3, flexShrink: 0,
                      }}>
                        {load.operatorId ? load.operatorId.split("_").slice(-1)[0] : `L${load.id}`}
                      </span>
                    )}
                    {isBkp && <span style={{ fontSize: 8, color: B.bkpL, fontWeight: 700 }}>BKP</span>}
                    {bkpBlocks.length > 0 && (
                      <span style={{ fontSize: 7, color: B.bkpL }}>→L{bkpBlocks[0].truckId}</span>
                    )}
                  </div>
                );
              })}
            </div>

            <div style={{ flex: 1, display: "flex", flexDirection: "column", zIndex: 4, paddingLeft: 30, minWidth: 0, overflowX: "auto" }}>
              <div style={{
                fontSize: 12, fontWeight: 700, color: B.redLight, textAlign: "center",
                textTransform: "uppercase", letterSpacing: 1.5, height: csvRows ? HEADER_H + 20 : HEADER_H,
                display: "flex", alignItems: "center", justifyContent: "center",
                borderBottom: `1px solid ${B.bdr}`, boxSizing: "border-box",
                position: "sticky", top: 0, background: B.bg, zIndex: 5,
              }}>
                {csvRows
                  ? `${TRUCKS.length} Seats${csvRegion !== "ALL" ? ` (${csvRegion})` : ""} · Up to ${blocksPerLoad} Blocks`
                  : `${TRUCKS.length} Loads · ${blocksPerLoad} Blocks Each`
                }
              </div>
              {TRUCKS.map((load, loadIdx) => {
                const isHl = hoveredTruck === load.id || selectedTruck === load.id;
                const isDriverLoad = !selectedDriver || driverLoadMap[load.id];
                return (
                  <div key={load.id} ref={(el) => (blockGroupRefs.current[load.id] = el)}
                    onClick={() => { setSelectedTruck(selectedTruck === load.id ? null : load.id); if (selectedDriver) setSelectedDriver(null); }}
                    style={{
                      ...ROW, display: "flex", gap: csvRows ? 6 : 14, alignItems: "center", height: SLOT_H, cursor: "pointer",
                      opacity: isDriverLoad ? 1 : 0.4,
                      transition: "all 0.2s ease",
                      background: selectedDriver && isDriverLoad ? "rgba(193,59,64,0.06)" : isHl ? "rgba(193,59,64,0.04)" : loadIdx % 2 === 0 ? "transparent" : "rgba(255,255,255,0.015)",
                      borderLeft: selectedDriver && isDriverLoad ? `3px solid ${B.red}` : isHl ? `3px solid ${B.red}` : "3px solid transparent",
                      borderRadius: 4, paddingLeft: 2, minWidth: "fit-content",
                    }}
                    onMouseEnter={() => setHoveredTruck(load.id)} onMouseLeave={() => setHoveredTruck(null)}
                  >
                    <div style={{
                      fontSize: csvRows ? 9 : 10, fontWeight: 700, color: isHl ? B.redLight : B.muted,
                      width: csvRows ? 44 : 28, textAlign: "center", flexShrink: 0, lineHeight: 1.3,
                      background: isHl ? "rgba(193,59,64,0.08)" : "transparent",
                      borderRadius: 4, padding: "2px 0",
                    }}>
                      {load.operatorId ? load.operatorId.split("_").slice(-1)[0] : `L${load.id}`}
                    </div>
                    {BLOCK_NUMS.map((bn) => {
                      // In CSV mode, only render blocks that actually exist
                      if (csvRows && load.blockIds && bn > load.blockIds.length) return null;
                      const key = blockKey(load.id, bn);
                      const origDriver = getOriginalDriver(load.id, bn);
                      const isCancelled = !!cancelledBlocks[key];
                      const backup = blockBackups[key];
                      const isAssigning = assigningBlock === key;
                      const available = isAssigning ? getAvailableForBlock(load.id, bn) : [];
                      // Check if this block belongs to selected driver
                      const isDriverBlock = !selectedDriver || origDriver === selectedDriver || backup === selectedDriver;
                      // Get CSV block label and trip stage if available
                      const csvBlockId = csvRows && load.blockIds && load.blockIds[bn - 1];
                      const blockTripData = csvBlockId && load.blockTrips?.[csvBlockId];
                      const dominantStage = blockTripData && blockTripData.length > 0
                        ? blockTripData.reduce((acc, t) => { acc[t.stage] = (acc[t.stage] || 0) + 1; return acc; }, {})
                        : null;
                      const stageKey = dominantStage ? Object.entries(dominantStage).sort((a,b) => b[1] - a[1])[0]?.[0] : null;
                      return (
                        <div key={bn} style={{ opacity: isDriverLoad && !isDriverBlock && selectedDriver ? 0.25 : 1, transition: "opacity 0.2s" }}>
                          <BlockNode
                            label={csvBlockId ? csvBlockId.slice(0, 8) : `B${bn}`}
                            driverLabel={origDriver ? `D${origDriver}` : "—"}
                            driverName={getDriverName(origDriver)}
                            highlight={isHl}
                            cancelled={isCancelled}
                            dropped={!!droppedBlocks[key]}
                            backupAssigned={backup}
                            backupName={backup ? getDriverName(backup) : null}
                            assigning={isAssigning}
                            compact={!!csvRows}
                            stageColor={stageKey ? STAGE_COLORS[stageKey] : null}
                            tooltip={csvBlockId && load.blockTrips?.[csvBlockId]
                              ? `${csvBlockId}\n${load.blockTrips[csvBlockId].length} trips · ${Math.round(load.blockTrips[csvBlockId].reduce((s,t) => s + t.distance, 0))} mi\n${load.blockTrips[csvBlockId].map(t => `${t.stop1} → ${t.stop2}`).join('\n')}`
                              : null}
                            availableBackups={available.map((d) => ({ ...d, onSelect: () => requestBackupAssignment(load.id, bn, d.id) }))}
                            onCancel={() => toggleBlockCancel(load.id, bn)}
                            onAssign={() => setAssigningBlock(isAssigning ? null : key)}
                            onRemoveBackup={() => removeBlockBackup(load.id, bn)}
                            onDrop={() => dropBlock(load.id, bn)}
                            onUndrop={() => undropBlock(load.id, bn)}
                          />
                        </div>
                      );
                    })}
                    <div style={{ display: "flex", flexDirection: "column", gap: 2, marginLeft: 6, fontSize: 9, color: B.dim, whiteSpace: "nowrap", maxWidth: csvRows ? 90 : 160, overflow: "hidden", flexShrink: 0 }}>
                      {csvRows ? (
                        <>
                          <span style={{ color: B.muted, fontSize: 8 }}>{load.blockIds?.length || 0}b · {load.tripData?.length || 0}t</span>
                          <span style={{ color: B.subtle, fontSize: 7, overflow: "hidden", textOverflow: "ellipsis" }}>
                            {load.facilities?.slice(0, 2).join("→")}
                          </span>
                        </>
                      ) : hasPrimarySecondary ? (
                        <>
                          <span style={{ color: B.green }}>P: {getDriverName(load.primaryDriver)}</span>
                          <span style={{ color: B.gold }}>S: {getDriverName(load.secondaryDriver)}</span>
                        </>
                      ) : (
                        <span style={{ color: B.green }}>{getDriverName(load.primaryDriver)}</span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          )}

          {/* Backup Confirmation Banner — fixed at top, no overlay, no fading */}
          {pendingBackup && (
            <div className="panel-enter" style={{
              position: "fixed", top: 0, left: 0, right: 0, zIndex: 1000,
              background: B.card, borderBottom: `2px solid ${B.bkp}`,
              padding: "12px 28px", display: "flex", alignItems: "center", justifyContent: "center", gap: 16,
              boxShadow: "0 4px 20px rgba(0,0,0,0.4)",
            }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: B.bkpL, textTransform: "uppercase", letterSpacing: 0.5 }}>
                Confirm Backup:
              </span>
              <span style={{ fontSize: 12, color: B.text }}>
                Assign <span style={{ color: B.bkpL, fontWeight: 700 }}>{pendingBackup.driverName}</span> to{" "}
                <span style={{ color: B.muted }}>
                  {(() => {
                    const truck = TRUCKS.find(t => t.id === pendingBackup.truckId);
                    const blockId = truck?.blockIds?.[pendingBackup.blockNum - 1];
                    return blockId ? blockId.slice(0, 10) : "";
                  })()}
                </span>?
              </span>
              <button onClick={confirmBackupAssignment} style={{
                padding: "6px 20px", borderRadius: 6, border: "none", cursor: "pointer",
                background: B.bkp, color: "#fff", fontSize: 10, fontWeight: 700,
                fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase", letterSpacing: 0.5,
              }}>✓ Confirm</button>
              <button onClick={cancelPendingBackup} style={{
                padding: "6px 20px", borderRadius: 6, border: `1px solid ${B.bdr}`, cursor: "pointer",
                background: B.surface, color: B.muted, fontSize: 10, fontWeight: 700,
                fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase", letterSpacing: 0.5,
              }}>✕ Cancel</button>
            </div>
          )}

          {/* Driver Detail Panel — popup overlay */}
          {selectedDriver && selectedDriverInfo && (
            <div style={{
              position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(0,0,0,0.3)", zIndex: 900,
              display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: 80,
            }} onClick={() => setSelectedDriver(null)}>
            <div className="panel-enter" onClick={(e) => e.stopPropagation()} style={{
              background: B.card, width: "90%", maxWidth: 700, maxHeight: "70vh", overflowY: "auto",
              border: `2px solid rgba(193,59,64,0.3)`, borderRadius: 14, padding: 20,
              boxShadow: "0 20px 60px rgba(0,0,0,0.5)",
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
                <PersonSVG size={28} color={B.red} />
                <div style={{ flex: 1 }}>
                  <h4 style={{ margin: 0, color: B.white, fontSize: 15, fontWeight: 700 }}>
                    {selectedDriverInfo.label}
                  </h4>
                  <p style={{ margin: "2px 0 0", fontSize: 11, color: B.muted }}>
                    {selectedDriverInfo.currentLocation && `📍 ${selectedDriverInfo.currentLocation}`}
                    {selectedDriverInfo.currentLocation && selectedDriverInfo.vehicleName && " · "}
                    {selectedDriverInfo.vehicleName && `🚛 ${selectedDriverInfo.vehicleName}`}
                    {!selectedDriverInfo.currentLocation && !selectedDriverInfo.vehicleName && "Click a driver to see details. Click outside to close."}
                  </p>
                </div>
                {csvRows && (
                  <div style={{ display: "flex", gap: 16, fontSize: 11, color: B.text }}>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: (selectedDriverInfo.blockCount || 0) >= MAX_BLOCKS_PER_WEEK ? B.cancelRed : (selectedDriverInfo.blockCount || 0) >= MAX_BLOCKS_PER_WEEK - 1 ? B.gold : B.green }}>
                        {selectedDriverInfo.blockCount || 0}/{MAX_BLOCKS_PER_WEEK}
                      </div>
                      <div style={{ fontSize: 9, color: B.dim }}>Blocks/Wk</div>
                    </div>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: B.text }}>{selectedDriverInfo.totalMiles || 0}</div>
                      <div style={{ fontSize: 9, color: B.dim }}>Total Miles</div>
                    </div>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: B.text }}>{selectedDriverInfo.tripCount || 0}</div>
                      <div style={{ fontSize: 9, color: B.dim }}>Trips</div>
                    </div>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: (selectedDriverInfo.cycleRemaining || 0) > 30 ? B.greenL : (selectedDriverInfo.cycleRemaining || 0) > 10 ? B.gold : B.cancelRed }}>
                        {selectedDriverInfo.cycleRemaining || 0}h
                      </div>
                      <div style={{ fontSize: 9, color: B.dim }}>{selectedDriverInfo.hosSource ? "Cycle Left (ELD)" : "Cycle Left (Est)"}</div>
                    </div>
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: B.text }}>
                        {selectedDriverInfo.estDriveHours || 0}h
                      </div>
                      <div style={{ fontSize: 9, color: B.dim }}>{selectedDriverInfo.hosSource ? "Actual Driven" : "Est Drive Hrs"}</div>
                    </div>
                    {selectedDriverInfo.hosSource && (
                      <div style={{ textAlign: "center" }}>
                        <div style={{ fontSize: 18, fontWeight: 700, color: (selectedDriverInfo.hosDutyRemaining || 0) > 480 ? B.greenL : (selectedDriverInfo.hosDutyRemaining || 0) > 240 ? B.gold : B.cancelRed }}>
                          {Math.round((selectedDriverInfo.hosDutyRemaining || 0) / 60)}h
                        </div>
                        <div style={{ fontSize: 9, color: B.dim }}>Duty Left</div>
                      </div>
                    )}
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: (selectedDriverInfo.blockCount || 0) >= MAX_BLOCKS_PER_WEEK ? B.cancelRed : B.green }}>
                        {(selectedDriverInfo.blockCount || 0) >= MAX_BLOCKS_PER_WEEK ? "MAXED" : "AVAILABLE"}
                      </div>
                      <div style={{ fontSize: 9, color: B.dim }}>Backup Status</div>
                    </div>
                    {selectedDriverInfo.preferredStartLabel && (
                      <div style={{ textAlign: "center" }}>
                        <div style={{
                          fontSize: 16, fontWeight: 700,
                          color: selectedDriverInfo.preferredShift === "AM" ? "#64b5f6" : selectedDriverInfo.preferredShift === "PM" ? B.gold : selectedDriverInfo.preferredShift === "NIGHT" ? B.bkpL : B.dim,
                        }}>
                          {selectedDriverInfo.preferredStartLabel}
                        </div>
                        <div style={{ fontSize: 9, color: B.dim }}>Pref Start ({selectedDriverInfo.shiftConsistency}%)</div>
                      </div>
                    )}
                    {selectedDriverInfo.hosSource && selectedDriverInfo.hosStatus && (
                      <div style={{ textAlign: "center" }}>
                        <div style={{
                          fontSize: 10, fontWeight: 700, textTransform: "uppercase",
                          padding: "4px 8px", borderRadius: 4,
                          background: selectedDriverInfo.hosStatus === "driving" ? B.greenBg
                            : selectedDriverInfo.hosStatus === "on_duty" ? B.goldBg
                            : selectedDriverInfo.hosStatus === "sleeper_berth" ? "rgba(100,181,246,0.1)"
                            : "rgba(255,255,255,0.04)",
                          color: selectedDriverInfo.hosStatus === "driving" ? B.green
                            : selectedDriverInfo.hosStatus === "on_duty" ? B.gold
                            : selectedDriverInfo.hosStatus === "sleeper_berth" ? "#64b5f6"
                            : B.dim,
                        }}>
                          {selectedDriverInfo.hosStatus.replace("_", " ")}
                        </div>
                        <div style={{ fontSize: 9, color: B.dim, marginTop: 2 }}>ELD Status</div>
                      </div>
                    )}
                  </div>
                )}
                <button onClick={() => setSelectedDriver(null)} style={{
                  background: "rgba(255,255,255,0.05)", color: B.muted, border: `1px solid ${B.bdr}`,
                  borderRadius: 6, padding: "4px 10px", fontSize: 10, cursor: "pointer",
                  fontFamily: "'Montserrat', sans-serif",
                }}>✕ Close</button>
              </div>
              {/* Assigned loads & blocks */}
              {(() => {
                const driverLoads = TRUCKS.filter(t => t.primaryDriver === selectedDriver || t.secondaryDriver === selectedDriver);
                if (driverLoads.length > 0) return (
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 6 }}>
                    <span style={{ fontSize: 9, color: B.dim, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, lineHeight: "22px" }}>Assigned:</span>
                    {driverLoads.map(l => (
                      <span key={l.id} onClick={(e) => { e.stopPropagation(); setSelectedTruck(l.id); setSelectedDriver(null); }}
                        style={{
                          fontSize: 9, padding: "3px 8px", borderRadius: 4, fontWeight: 600, cursor: "pointer",
                          background: "rgba(193,59,64,0.08)", color: B.redLight, border: `1px solid rgba(193,59,64,0.2)`,
                          transition: "all 0.15s",
                        }}
                        onMouseEnter={(e) => { e.currentTarget.style.background = "rgba(193,59,64,0.2)"; }}
                        onMouseLeave={(e) => { e.currentTarget.style.background = "rgba(193,59,64,0.08)"; }}
                      >
                        {l.operatorId ? l.operatorId.split("_").slice(-1)[0] : `L${l.id}`}
                        {csvRows && ` · ${l.blockIds?.length || 0}b`}
                      </span>
                    ))}
                  </div>
                );
                return null;
              })()}
              {csvRows && selectedDriverInfo.facilities && selectedDriverInfo.facilities.length > 0 && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
                  <span style={{ fontSize: 9, color: B.dim, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, lineHeight: "22px" }}>Facilities:</span>
                  {selectedDriverInfo.facilities.slice(0, 12).map(f => (
                    <span key={f} style={{
                      fontSize: 8, padding: "2px 6px", borderRadius: 3, fontWeight: 600,
                      background: "rgba(102,187,106,0.08)", color: B.greenL, border: `1px solid rgba(102,187,106,0.2)`,
                    }}>{f}</span>
                  ))}
                  {selectedDriverInfo.facilities.length > 12 && (
                    <span style={{ fontSize: 8, color: B.dim, lineHeight: "22px" }}>+{selectedDriverInfo.facilities.length - 12} more</span>
                  )}
                </div>
              )}
              {/* HOS Details from Samsara */}
              {selectedDriverInfo.hosSource && (
                <div style={{ marginTop: 10, padding: "10px 12px", background: B.surface, borderRadius: 8, border: `1px solid ${B.bdr}` }}>
                  <div style={{ fontSize: 9, fontWeight: 700, color: B.muted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>Hours of Service (ELD)</div>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    {[
                      { label: "Drive Left", value: selectedDriverInfo.hosDriveRemainingFmt, color: B.greenL },
                      { label: "Shift Left", value: selectedDriverInfo.hosDutyRemainingFmt, color: B.gold },
                      { label: "Cycle Left", value: selectedDriverInfo.hosCycleRemainingFmt, color: "#64b5f6" },
                      { label: "Break In", value: selectedDriverInfo.hosBreakRemainingFmt, color: B.bkpL },
                    ].filter(s => s.value).map(s => (
                      <div key={s.label} style={{ textAlign: "center", minWidth: 60 }}>
                        <div style={{ fontSize: 16, fontWeight: 700, color: s.color }}>{s.value}</div>
                        <div style={{ fontSize: 8, color: B.dim }}>{s.label}</div>
                      </div>
                    ))}
                    {selectedDriverInfo.hosTimeInStatus !== null && (
                      <div style={{ textAlign: "center", minWidth: 60 }}>
                        <div style={{ fontSize: 16, fontWeight: 700, color: B.text }}>{Math.floor((selectedDriverInfo.hosTimeInStatus || 0) / 60)}h{(selectedDriverInfo.hosTimeInStatus || 0) % 60}m</div>
                        <div style={{ fontSize: 8, color: B.dim }}>In Status</div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
            </div>
          )}

          {/* Load Detail Panel */}
          {selectedTruck && !selectedDriver && (() => {
            const truck = TRUCKS.find((t) => t.id === selectedTruck);
            if (!truck) return null;

            // CSV mode: show real trip data per block
            if (csvRows && truck.blockTrips) {
              const blockEntries = Object.entries(truck.blockTrips);
              return (
                <div style={{
                  margin: "0 20px 16px", background: B.card,
                  border: `1px solid rgba(193,59,64,0.2)`, borderRadius: 12, padding: 16,
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
                    <TruckSVG size={30} />
                    <div style={{ flex: 1 }}>
                      <h4 style={{ margin: 0, color: B.white, fontSize: 14, fontWeight: 700 }}>
                        {truck.operatorId || `Load ${selectedTruck}`}
                      </h4>
                      <div style={{ display: "flex", gap: 8, margin: "4px 0 0", alignItems: "center", flexWrap: "wrap" }}>
                        <span style={{ fontSize: 10, color: B.muted }}>
                          {truck.tripData?.length || 0} trips · {blockEntries.length} blocks
                        </span>
                        {/* Driver badges */}
                        {[...new Set([truck.primaryDriver, truck.secondaryDriver].filter(Boolean))].map(did => {
                          const dName = getDriverName(did);
                          return (
                            <span key={did} onClick={(e) => { e.stopPropagation(); setSelectedDriver(did); setSelectedTruck(null); }}
                              style={{
                                fontSize: 9, padding: "2px 6px", borderRadius: 3, fontWeight: 600, cursor: "pointer",
                                background: "rgba(102,187,106,0.08)", color: B.greenL, border: `1px solid rgba(102,187,106,0.2)`,
                                transition: "all 0.15s",
                              }}
                              onMouseEnter={(e) => { e.currentTarget.style.background = "rgba(102,187,106,0.2)"; }}
                              onMouseLeave={(e) => { e.currentTarget.style.background = "rgba(102,187,106,0.08)"; }}
                            >{dName}</span>
                          );
                        })}
                      </div>
                      <div style={{ display: "flex", gap: 4, marginTop: 4, flexWrap: "wrap" }}>
                        {truck.facilities?.slice(0, 6).map(f => (
                          <span key={f} style={{ fontSize: 8, padding: "1px 5px", borderRadius: 3, background: "rgba(255,255,255,0.04)", color: B.dim, border: `1px solid ${B.bdr}` }}>{f}</span>
                        ))}
                      </div>
                    </div>
                    <button onClick={() => setSelectedTruck(null)} style={{
                      background: "rgba(255,255,255,0.05)", color: B.muted, border: `1px solid ${B.bdr}`,
                      borderRadius: 6, padding: "4px 10px", fontSize: 10, cursor: "pointer",
                      fontFamily: "'Montserrat', sans-serif",
                    }}>✕ Close</button>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 300, overflowY: "auto" }}>
                    {blockEntries.map(([bid, trips]) => (
                      <div key={bid} style={{ background: B.surface, borderRadius: 8, padding: 10, border: `1px solid ${B.bdr}` }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                          <span style={{ fontSize: 11, fontWeight: 700, color: B.redLight }}>{bid}</span>
                          <span style={{ fontSize: 9, color: B.dim }}>{trips.length} trip{trips.length > 1 ? "s" : ""}</span>
                          <span style={{ fontSize: 9, color: B.greenL, marginLeft: "auto" }}>
                            {Math.round(trips.reduce((s, t) => s + t.distance, 0))} mi total
                          </span>
                        </div>
                        {trips.map((trip, idx) => (
                          <div key={idx} style={{
                            display: "flex", alignItems: "center", gap: 8, padding: "4px 0",
                            borderTop: idx > 0 ? `1px solid ${B.bdr}` : "none", fontSize: 10,
                          }}>
                            <span style={{ color: B.text, fontWeight: 600, minWidth: 70 }}>{trip.tripId.slice(0, 10)}</span>
                            <span style={{ color: B.green }}>{trip.stop1}</span>
                            <svg width="14" height="8" viewBox="0 0 14 8" style={{ flexShrink: 0 }}>
                              <line x1="0" y1="4" x2="9" y2="4" stroke={B.subtle} strokeWidth="1" />
                              <path d="M8,1 L13,4 L8,7" fill={B.subtle} />
                            </svg>
                            <span style={{ color: B.gold }}>{trip.stop2}</span>
                            <span style={{ color: B.dim, marginLeft: "auto" }}>{trip.distance}mi</span>
                            {trip.stage && (
                              <span style={{
                                fontSize: 8, padding: "1px 5px", borderRadius: 3, fontWeight: 600,
                                background: trip.stage === "In Transit" ? B.greenBg : trip.stage === "Tendered" ? B.goldBg : trip.stage === "Upcoming" ? "rgba(100,181,246,0.10)" : "rgba(255,255,255,0.05)",
                                color: STAGE_COLORS[trip.stage] || B.dim,
                              }}>{trip.stage}</span>
                            )}
                            {trip.driver && (
                              <span style={{ fontSize: 8, color: B.dim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 80 }}>{trip.driver}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              );
            }

            // Demo mode: show rotation timeline
            const timeline = [];
            for (let bn = 1; bn <= blocksPerLoad; bn++) {
              const key = blockKey(truck.id, bn);
              const origDriver = getOriginalDriver(truck.id, bn);
              const effDriver = blockBackups[key] || origDriver;
              const isCancelled = !!cancelledBlocks[key];
              const isPrimary = hasPrimarySecondary ? bn % 2 === 1 : true;
              timeline.push({
                label: `Block ${bn}`, driver: getDriverName(effDriver),
                type: isCancelled && !blockBackups[key] ? "cancelled" : isPrimary ? "primary" : "secondary",
                isBackup: !!blockBackups[key],
              });
              if (bn < blocksPerLoad) timeline.push({ label: "10hr Rest", type: "break" });
            }
            return (
              <div style={{
                margin: "0 20px 16px", background: B.card,
                border: `1px solid rgba(193,59,64,0.2)`, borderRadius: 12, padding: 16,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 8, background: B.redSub, border: `1.5px solid ${B.red}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: B.redLight }}>L{selectedTruck}</div>
                  <div>
                    <h4 style={{ margin: 0, color: B.white, fontSize: 14, fontWeight: 700 }}>
                      Load {selectedTruck} — Rotation Schedule
                    </h4>
                    <p style={{ margin: "2px 0 0", fontSize: 12, color: B.muted }}>
                      {hasPrimarySecondary
                        ? "Drivers alternate blocks with mandatory 10-hour rest. Click blocks above to simulate cancellations."
                        : "Single driver handles all blocks with mandatory 10-hour rest. Click blocks above to simulate cancellations."
                      }
                    </p>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 0, flexWrap: "wrap" }}>
                  {timeline.map((step, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center" }}>
                      <div style={{
                        padding: "6px 12px", borderRadius: 8, fontSize: 11, fontWeight: 600, textAlign: "center",
                        background: step.type === "break" ? B.goldBg : step.type === "cancelled" ? B.cancelBg : step.type === "primary" ? B.greenBg : B.goldBg,
                        color: step.type === "break" ? B.gold : step.type === "cancelled" ? B.cancelRed : step.isBackup ? B.bkpL : step.type === "primary" ? B.greenL : B.gold,
                        border: step.type === "break" ? `1px dashed rgba(255,213,79,0.3)` : step.type === "cancelled" ? `1px solid rgba(239,83,80,0.3)` : step.type === "primary" ? `1px solid rgba(102,187,106,0.3)` : `1px solid rgba(255,213,79,0.3)`,
                      }}>
                        <div>{step.label}</div>
                        {step.driver && (
                          <div style={{ fontSize: 9, opacity: 0.85, marginTop: 2 }}>
                            {step.driver}{step.isBackup ? " (BKP)" : ""}{step.type === "cancelled" ? " OPEN" : ""}
                          </div>
                        )}
                      </div>
                      {i < timeline.length - 1 && (
                        <svg width="20" height="8" viewBox="0 0 20 8" style={{ flexShrink: 0 }}>
                          <line x1="0" y1="4" x2="13" y2="4" stroke={B.subtle} strokeWidth="1" />
                          <path d="M12,1 L18,4 L12,7" fill={B.subtle} />
                        </svg>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}

          <div style={{
            padding: "12px 28px", borderTop: `1px solid ${B.bdr}`, background: B.header,
            display: "flex", alignItems: "center", justifyContent: "center",
            gap: 10, fontSize: 11, color: B.subtle,
          }}>
            <span style={{ color: B.red, fontWeight: 700 }}>JOYRIDE LOGISTICS, LLC</span>
            <span>·</span><span>joyridelogistics.com</span><span>·</span>
            <span>Fleet Operations Overview — {csvRows ? `${csvRegion !== "ALL" ? csvRegion + " Region" : "All Regions"} · Amazon Relay Data` : `${mode === "current" ? "New" : "Legacy"} System`}</span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
