<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joyride Logistics LLC — Fleet Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #1c1f26; font-family: 'Montserrat', 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #252830; }
    ::-webkit-scrollbar-thumb { background: #555862; border-radius: 3px; }
    @keyframes blockPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .block-cancel { animation: blockPulse 0.3s ease; }
    .panel-enter { animation: fadeSlideIn 0.25s ease; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-v="2">
    /* cache-bust v2 */
    const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

    const B = {
      red: "#C13B40", redLight: "#d4585d", redDark: "#9e2f33",
      redGlow: "rgba(193,59,64,0.15)", redSub: "rgba(193,59,64,0.08)",
      bg: "#1c1f26", header: "#14161c", card: "#252830",
      cardHover: "#2e313b", surface: "#2a2d36",
      bdr: "rgba(255,255,255,0.06)", bdrL: "rgba(255,255,255,0.10)",
      white: "#f0f1f4", text: "#d0d2d8", muted: "#8e919c",
      dim: "#6b6e78", subtle: "#555862",
      green: "#66bb6a", greenL: "#a5d6a7", greenBg: "rgba(102,187,106,0.10)",
      gold: "#ffd54f", goldDim: "#d4a53a", goldBg: "rgba(255,213,79,0.10)",
      bkp: "#ba68c8", bkpL: "#ce93d8", bkpBg: "rgba(186,104,200,0.10)",
      cancelRed: "#ef5350", cancelBg: "rgba(239,83,80,0.10)",
      grad: "linear-gradient(135deg, #C13B40 0%, #363535 60%, #C13B40 100%)",
    };

    const MODELS = {
      current: {
        label: "New System",
        tag: "20 / 10 / 4",
        numDrivers: 20,
        numTrucks: 10,
        blocksPerLoad: 4,
        hasPrimarySecondary: true,
      },
      legacy: {
        label: "Legacy System",
        tag: "20 / 20 / 3",
        numDrivers: 20,
        numTrucks: 20,
        blocksPerLoad: 3,
        hasPrimarySecondary: false,
      },
    };

    const DRIVER_NAMES = [
      "M. Neuer", "J. Kimmich", "D. Upamecano", "M. de Ligt", "A. Davies",
      "J. Musiala", "L. Goretzka", "T. Muller", "L. Sane", "S. Gnabry",
      "H. Kane", "K. Coman", "R. Guerreiro", "N. Mazraoui", "E. Laimer",
      "B. Pavard", "M. Tel", "P. Chupo", "J. Stanisic", "G. Peretz",
    ];

    function buildData(model) {
      const drivers = Array.from({ length: model.numDrivers }, (_, i) => ({ id: i + 1, label: DRIVER_NAMES[i] || `Driver ${i + 1}` }));
      let trucks;
      if (model.hasPrimarySecondary) {
        trucks = Array.from({ length: model.numTrucks }, (_, i) => ({
          id: i + 1, label: `Truck ${i + 1}`,
          primaryDriver: i * 2 + 1, secondaryDriver: i * 2 + 2,
        }));
      } else {
        trucks = Array.from({ length: model.numTrucks }, (_, i) => ({
          id: i + 1, label: `Truck ${i + 1}`,
          primaryDriver: i + 1, secondaryDriver: null,
        }));
      }
      return { drivers, trucks, blocksPerLoad: model.blocksPerLoad, hasPrimarySecondary: model.hasPrimarySecondary };
    }

    // ─── CSV Parser & Data Transformer ───────────────────────────
    function parseCSV(text) {
      const lines = text.split("\n").filter(l => l.trim());
      const parseRow = (line) => {
        const vals = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') {
            if (inQuotes && i + 1 < line.length && line[i + 1] === '"') {
              current += '"'; i++; // escaped quote "" → literal "
            } else {
              inQuotes = !inQuotes;
            }
          } else if (line[i] === ',' && !inQuotes) { vals.push(current.trim()); current = ""; }
          else { current += line[i]; }
        }
        vals.push(current.trim());
        return vals;
      };
      const headers = parseRow(lines[0]);
      return lines.slice(1).map(line => {
        const vals = parseRow(line);
        // Pad short rows to match header count
        while (vals.length < headers.length) vals.push("");
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = vals[i] || ""; });
        return obj;
      });
    }

    function transformCSVData(rows, regionFilter, savedProfilesData) {
      // ── Step 1: Compute per-driver stats from ALL rows (before filtering) ──
      const driverStats = {}; // name → { totalMiles, tripCount, facilities, blockIds, workTypes }
      const driverSet = new Map(); // name → id
      let nextDriverId = 1;

      rows.forEach(row => {
        const name = (row["Driver Name"] || "").trim();
        if (!name) return;
        if (!driverSet.has(name)) driverSet.set(name, nextDriverId++);
        if (!driverStats[name]) driverStats[name] = { totalMiles: 0, tripCount: 0, facilities: new Set(), blockIds: new Set(), workTypes: new Set() };
        const s = driverStats[name];
        s.tripCount++;
        const dist = parseFloat(row["Estimate Distance"]) || 0;
        s.totalMiles += dist;
        const stop1 = (row["Stop 1"] || "").trim();
        const stop2 = (row["Stop 2"] || "").trim();
        if (stop1) s.facilities.add(stop1);
        if (stop2) s.facilities.add(stop2);
        const blockId = (row["Block ID"] || "").trim();
        if (blockId) s.blockIds.add(blockId);
        const shipper = (row["Shipper Account"] || "").trim();
        if (shipper) s.workTypes.add(shipper);
      });

      // Estimate weekly hours
      Object.values(driverStats).forEach(s => {
        s.estWeeklyHours = Math.round((s.totalMiles / 45) * 10) / 10;
      });

      // ── Step 2: Group by Operator ID (= seat/load) ──
      const byOperator = {};
      let droppedRows = 0;
      rows.forEach(row => {
        const opId = (row["Operator ID"] || "").trim();
        const driverName = (row["Driver Name"] || "").trim();
        const blockId = (row["Block ID"] || "").trim();
        if (!opId && !driverName) { droppedRows++; return; }

        if (opId) {
          if (!byOperator[opId]) byOperator[opId] = { trips: [], drivers: new Set(), blocks: new Set(), facilities: new Set() };
          byOperator[opId].trips.push(row);
          if (driverName) byOperator[opId].drivers.add(driverName);
          if (blockId) byOperator[opId].blocks.add(blockId);
          const s1 = (row["Stop 1"] || "").trim();
          const s2 = (row["Stop 2"] || "").trim();
          if (s1) byOperator[opId].facilities.add(s1);
          if (s2) byOperator[opId].facilities.add(s2);
        }
      });
      if (droppedRows > 0) console.warn(`CSV: ${droppedRows} row(s) skipped (no Operator ID or Driver Name)`);

      // ── Step 3: Extract regions, filter ──
      const regions = new Set();
      Object.keys(byOperator).forEach(opId => {
        const parts = opId.split("_");
        if (parts.length >= 2) regions.add(parts[1]);
      });

      const filteredOps = Object.entries(byOperator).filter(([opId]) => {
        if (!regionFilter || regionFilter === "ALL") return true;
        const parts = opId.split("_");
        return parts.length >= 2 && parts[1] === regionFilter;
      });
      filteredOps.sort(([a], [b]) => a.localeCompare(b));

      // ── Step 4: Build drivers and loads ──
      const allDriverNames = [];
      const trucks = [];
      let loadId = 1;

      filteredOps.forEach(([opId, data]) => {
        const driverArr = [...data.drivers];
        const primary = driverArr[0] ? driverSet.get(driverArr[0]) : null;
        const secondary = driverArr[1] ? driverSet.get(driverArr[1]) : null;
        driverArr.forEach(name => { if (!allDriverNames.includes(name)) allDriverNames.push(name); });

        // Build per-block trip details and per-block driver mapping
        const blockTrips = {};
        const blockDriverMap = {}; // blockId → driverName
        data.trips.forEach(row => {
          const bid = (row["Block ID"] || "").trim();
          if (!bid) return;
          if (!blockTrips[bid]) blockTrips[bid] = [];
          blockTrips[bid].push({
            tripId: (row["Trip ID"] || "").trim(),
            stop1: (row["Stop 1"] || "").trim(),
            stop2: (row["Stop 2"] || "").trim(),
            distance: parseFloat(row["Estimate Distance"]) || 0,
            plannedArr: (row["Stop 1 Planned Arrival"] || "").trim(),
            plannedDep: (row["Stop 1 Planned Departure"] || "").trim(),
            stop2Arr: (row["Stop 2 Planned Arrival"] || "").trim(),
            stage: (row["Trip Stage"] || "").trim(),
            driver: (row["Driver Name"] || "").trim(),
            // Date/time fields (with fallbacks)
            stop1ArrDate: (row["Stop 1 Planned Arrival Date"] || "").trim(),
            stop1ArrTime: (row["Stop 1 Planned Arrival Time"] || "").trim(),
            stop1DepDate: (row["Stop 1  Planned Departure Date"] || "").trim(),
            stop1DepTime: (row["Stop 1  Planned Departure Time"] || "").trim(),
            stop2ArrDate: (row["Stop 2 Planned Arrival Date"] || row["Stop 2  Planned Departure Date"] || "").trim(),
            stop2ArrTime: (row["Stop 2 Planned Arrival Time"] || row["Stop 2  Planned Departure Time"] || "").trim(),
          });
          // Track which driver owns each block
          const dName = (row["Driver Name"] || "").trim();
          if (dName && !blockDriverMap[bid]) blockDriverMap[bid] = dName;
        });

        // Build ordered list of block drivers (index-aligned with blockIds)
        const blockIds = [...data.blocks];
        const blockDrivers = blockIds.map(bid => {
          const dName = blockDriverMap[bid];
          return dName ? (driverSet.get(dName) || null) : null;
        });

        trucks.push({
          id: loadId, label: opId, operatorId: opId,
          primaryDriver: primary, secondaryDriver: secondary || null,
          blockCount: Math.max(data.blocks.size, 1),
          tripData: data.trips, blockIds,
          blockDrivers, // actual driver ID per block index (aligned with blockIds)
          facilities: [...data.facilities],
          blockTrips, // { blockId → [{tripId, stop1, stop2, distance, ...}] }
        });
        loadId++;
      });

      // ── Step 5: Build per-driver block list and domicile info ──
      // Determine each driver's domicile from their most-used Operator ID region
      const driverDomicileMap = {}; // driverName → region
      const driverRegionCount = {}; // driverName → { region → count }
      rows.forEach(row => {
        const name = (row["Driver Name"] || "").trim();
        const opId = (row["Operator ID"] || "").trim();
        if (!name || !opId) return;
        const parts = opId.split("_");
        if (parts.length < 2) return;
        const region = parts[1];
        if (!driverRegionCount[name]) driverRegionCount[name] = {};
        driverRegionCount[name][region] = (driverRegionCount[name][region] || 0) + 1;
      });
      Object.entries(driverRegionCount).forEach(([name, regions]) => {
        driverDomicileMap[name] = Object.entries(regions).sort((a, b) => b[1] - a[1])[0][0];
      });

      // Build per-driver block data (which blocks does each driver actually have)
      const driverBlocksMap = {}; // driverId → [{ blockId, truckId, truckLabel, trips, stage }]
      trucks.forEach(truck => {
        (truck.blockIds || []).forEach((blockId, idx) => {
          const driverId = truck.blockDrivers?.[idx];
          if (!driverId) return;
          if (!driverBlocksMap[driverId]) driverBlocksMap[driverId] = [];
          const trips = truck.blockTrips?.[blockId] || [];
          const stages = trips.map(t => t.stage).filter(Boolean);
          const dominantStage = stages.length > 0
            ? Object.entries(stages.reduce((acc, s) => { acc[s] = (acc[s] || 0) + 1; return acc; }, {})).sort((a, b) => b[1] - a[1])[0]?.[0]
            : null;
          // Compute block start (earliest Stop 1 arrival) and end (latest Stop 2 arrival)
          let blockStart = null, blockEnd = null;
          trips.forEach(t => {
            if (t.stop1ArrDate && t.stop1ArrTime) {
              const dt = `${t.stop1ArrDate} ${t.stop1ArrTime}`;
              if (!blockStart || dt < blockStart) blockStart = dt;
            }
            if (t.stop2ArrDate && t.stop2ArrTime) {
              const dt = `${t.stop2ArrDate} ${t.stop2ArrTime}`;
              if (!blockEnd || dt > blockEnd) blockEnd = dt;
            }
          });

          driverBlocksMap[driverId].push({
            blockId, truckId: truck.id, truckLabel: truck.operatorId,
            trips, stage: dominantStage,
            totalMiles: Math.round(trips.reduce((s, t) => s + t.distance, 0)),
            blockStart, blockEnd,
          });
        });
      });

      // Sort each driver's blocks chronologically and compute total scheduled hours
      const driverScheduledHours = {}; // driverId → total hours from block time spans
      Object.entries(driverBlocksMap).forEach(([driverId, blocks]) => {
        blocks.sort((a, b) => parseBlockDate(a.blockStart) - parseBlockDate(b.blockStart));
        // Sum hours from each block's start→end span
        let totalHrs = 0;
        blocks.forEach(blk => {
          const startMs = parseBlockDate(blk.blockStart);
          const endMs = parseBlockDate(blk.blockEnd);
          if (startMs !== Infinity && endMs !== Infinity && endMs > startMs) {
            totalHrs += (endMs - startMs) / 3600000; // ms → hours
          }
        });
        driverScheduledHours[driverId] = Math.round(totalHrs * 10) / 10;
      });

      // ── Step 6: Preferred start time analysis (from block start times) ──
      // Helper: format decimal hour → "6:45pm", "5am" etc.
      const fmtHour = (h) => {
        const hr = Math.floor(h) % 24;
        const m = Math.round((h - Math.floor(h)) * 60);
        const h12 = hr % 12 || 12;
        const ap = hr >= 12 ? "pm" : "am";
        return (m > 0) ? `${h12}:${m.toString().padStart(2, "0")}${ap}` : `${h12}${ap}`;
      };

      const driverStartPrefs = {};
      const driverIdToName = new Map();
      driverSet.forEach((id, name) => driverIdToName.set(id, name));
      Object.entries(driverBlocksMap).forEach(([driverId, blocks]) => {
        // Extract the hour-of-day from each block's start time
        const blockStartHours = [];
        blocks.forEach(blk => {
          if (!blk.blockStart) return;
          const parts = blk.blockStart.split(" ");
          if (parts.length < 2) return;
          const [hr, min] = parts[1].split(":").map(Number);
          if (!isNaN(hr)) blockStartHours.push(hr + (min || 0) / 60);
        });

        // Merge historical start times from saved profiles
        const driverName = driverIdToName.get(parseInt(driverId));
        if (driverName && savedProfilesData && savedProfilesData[driverName]) {
          const saved = savedProfilesData[driverName];
          const existingHours = new Set(blockStartHours.map(h => Math.round(h * 100)));
          (saved.startTimes || []).forEach(t => {
            const rounded = Math.round(t.hour * 100);
            if (!existingHours.has(rounded)) {
              blockStartHours.push(t.hour);
              existingHours.add(rounded);
            }
          });
        }

        if (blockStartHours.length === 0) {
          driverStartPrefs[driverId] = { preferredStartLabel: null, preferredStartLabels: [], preferredShift: null, shiftConsistency: 0 };
          return;
        }

        // Cluster block start times: group times within 2 hours of each other
        const sorted = [...blockStartHours].sort((a, b) => a - b);
        const clusters = []; // [{ hours: [], avg: number }]
        sorted.forEach(h => {
          // Try to add to an existing cluster (within 2h of cluster average)
          let added = false;
          for (const c of clusters) {
            if (Math.abs(h - c.avg) <= 2 || Math.abs(h - c.avg - 24) <= 2 || Math.abs(h - c.avg + 24) <= 2) {
              c.hours.push(h);
              c.avg = c.hours.reduce((a, b) => a + b, 0) / c.hours.length;
              added = true;
              break;
            }
          }
          if (!added) clusters.push({ hours: [h], avg: h });
        });

        // Build labels: show ALL cluster averages (never drop singletons)
        // This ensures every distinct start window is visible and usable by the scheduler
        let preferredStartLabels = [];

        if (blockStartHours.length < 3) {
          if (clusters.length === 1 && clusters[0].hours.length >= 2) {
            preferredStartLabels = [fmtHour(clusters[0].avg)];
          } else {
            preferredStartLabels = sorted.map(h => fmtHour(h));
          }
        } else {
          // 3+ blocks: show ALL clusters — larger clusters first, then singletons
          const sortedClusters = clusters.sort((a, b) => b.hours.length - a.hours.length);
          preferredStartLabels = sortedClusters.map(c => fmtHour(c.avg));
          // Cap at 3 labels to avoid clutter
          if (preferredStartLabels.length > 3) preferredStartLabels = preferredStartLabels.slice(0, 3);
        }

        // Shift classification based on primary cluster
        const primaryAvg = clusters.sort((a, b) => b.hours.length - a.hours.length)[0]?.avg || 0;
        const preferredShift = primaryAvg >= 4 && primaryAvg < 10 ? "AM"
          : primaryAvg >= 10 && primaryAvg < 15 ? "MID"
          : primaryAvg >= 15 && primaryAvg < 21 ? "PM" : "NIGHT";
        const shiftHours = blockStartHours.filter(h =>
          preferredShift === "AM" ? (h >= 4 && h < 10) :
          preferredShift === "MID" ? (h >= 10 && h < 15) :
          preferredShift === "PM" ? (h >= 15 && h < 21) :
          (h >= 21 || h < 4)
        );
        const shiftConsistency = Math.round((shiftHours.length / blockStartHours.length) * 100);

        driverStartPrefs[driverId] = {
          preferredStartLabel: preferredStartLabels.join(", "),
          preferredStartLabels,
          preferredShift,
          shiftConsistency,
          blockStartCount: blockStartHours.length,
          blockStartHours, // raw hours for scheduler matching
          startClusters: clusters.map(c => ({ avg: c.avg, count: c.hours.length })),
        };
      });

      // Number drivers within each domicile
      const domicileNumbers = {}; // region → counter
      const driversByDomicile = {}; // region → [driverName]
      allDriverNames.forEach(name => {
        const dom = driverDomicileMap[name] || "OTHER";
        if (!driversByDomicile[dom]) driversByDomicile[dom] = [];
        driversByDomicile[dom].push(name);
      });

      const drivers = allDriverNames.map(name => {
        const s = driverStats[name] || {};
        const dom = driverDomicileMap[name] || "OTHER";
        if (!domicileNumbers[dom]) domicileNumbers[dom] = 1;
        const driverNum = domicileNumbers[dom]++;
        const dId = driverSet.get(name);
        const schedHrs = driverScheduledHours[dId] || 0;
        const estDriveHours = Math.round((s.totalMiles || 0) / 45 * 10) / 10; // miles ÷ 45mph
        const CYCLE_MAX = 70; // 70-hour/8-day cycle
        const cycleUsed = estDriveHours; // best estimate without ELD
        const cycleRemaining = Math.max(Math.round((CYCLE_MAX - cycleUsed) * 10) / 10, 0);
        return {
          id: dId, label: name,
          totalMiles: Math.round(s.totalMiles || 0),
          estDriveHours,
          estWeeklyHours: estDriveHours,
          scheduledHours: schedHrs,
          cycleRemaining,
          tripCount: s.tripCount || 0,
          blockCount: s.blockIds ? s.blockIds.size : 0,
          facilities: s.facilities ? [...s.facilities] : [],
          workTypes: s.workTypes ? [...s.workTypes] : [],
          domicile: dom,
          driverNumber: driverNum,
          blocks: driverBlocksMap[dId] || [],
          // Preferred start time profile (derived from block start times)
          ...(driverStartPrefs[dId] || { preferredStartLabel: null, preferredStartLabels: [], preferredShift: null, shiftConsistency: 0 }),
        };
      });

      const maxBlocks = Math.min(Math.max(...trucks.map(t => t.blockCount), 1), 6);
      const hasPrimSec = trucks.some(t => t.secondaryDriver !== null);

      // Get ordered list of domiciles present
      const domicileOrder = [...new Set(drivers.map(d => d.domicile))].sort();

      return {
        drivers, trucks, blocksPerLoad: maxBlocks, hasPrimarySecondary: hasPrimSec,
        regions: [...regions].sort(), totalTrips: rows.length, csvMode: true,
        driverStats, driverBlocksMap, domicileOrder,
      };
    }

    // ─── Upload Component ──────────────────────────────────────
    const CSVUpload = ({ onUpload, onClear, hasData }) => {
      const [dragging, setDragging] = useState(false);
      const fileRef = useRef(null);

      const handleFile = (file) => {
        if (!file || !file.name.endsWith(".csv")) return;
        const reader = new FileReader();
        reader.onload = (e) => onUpload(e.target.result);
        reader.readAsText(file);
      };

      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {hasData ? (
            <button onClick={onClear} style={{
              background: "rgba(100,100,100,0.3)", color: B.muted, border: `1px solid ${B.subtle}`,
              borderRadius: 4, padding: "5px 12px", fontSize: 10, fontWeight: 700,
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
              letterSpacing: 0.5,
            }}>Demo Mode</button>
          ) : null}
          <div
            onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
            onClick={() => fileRef.current?.click()}
            style={{
              padding: "5px 14px", borderRadius: 6, fontSize: 10, fontWeight: 700,
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
              letterSpacing: 0.5, transition: "all 0.2s",
              background: dragging ? "rgba(102,187,106,0.2)" : hasData ? "rgba(102,187,106,0.1)" : "rgba(193,59,64,0.1)",
              border: dragging ? `2px dashed ${B.green}` : hasData ? `1px solid rgba(102,187,106,0.3)` : `1px solid rgba(193,59,64,0.3)`,
              color: dragging ? B.greenL : hasData ? B.greenL : B.redLight,
            }}
          >
            {hasData ? "CSV Loaded" : "Upload CSV"}
            <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }}
              onChange={(e) => handleFile(e.target.files[0])} />
          </div>
        </div>
      );
    };

    // ─── Region Tabs ─────────────────────────────────────────────
    const RegionTabs = ({ regions, active, onSelect }) => (
      <div style={{ display: "flex", gap: 4 }}>
        {["ALL", ...regions].map(r => (
          <button key={r} onClick={() => onSelect(r)} style={{
            padding: "4px 10px", borderRadius: 4, fontSize: 10, fontWeight: 700,
            cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
            letterSpacing: 0.5, border: "none", transition: "all 0.2s",
            background: active === r ? B.red : "rgba(255,255,255,0.05)",
            color: active === r ? "#fff" : B.muted,
          }}>{r}</button>
        ))}
      </div>
    );

    // ─── Samsara ELD Connect ─────────────────────────────────
    const SamsaraConnect = ({ connected, onConnect, onDisconnect, loading, error, matchInfo }) => {
      const [open, setOpen] = useState(false);
      const [token, setToken] = useState("");
      const dropRef = useRef(null);

      // Close dropdown on outside click
      useEffect(() => {
        const handler = (e) => { if (dropRef.current && !dropRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, []);

      return (
        <div ref={dropRef} style={{ position: "relative" }}>
          <button onClick={() => setOpen(!open)} style={{
            display: "flex", alignItems: "center", gap: 6,
            padding: "5px 12px", borderRadius: 6, fontSize: 10, fontWeight: 700,
            cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
            letterSpacing: 0.5, transition: "all 0.2s", border: "none",
            background: connected ? "rgba(102,187,106,0.12)" : "rgba(193,59,64,0.10)",
            color: connected ? B.greenL : B.redLight,
          }}>
            {connected && <span style={{ width: 6, height: 6, borderRadius: "50%", background: B.green, boxShadow: `0 0 6px ${B.green}`, animation: "pulse 2s infinite" }} />}
            {loading ? "Connecting..." : connected ? "ELD Live" : "Connect ELD"}
          </button>

          {open && (
            <div className="panel-enter" style={{
              position: "absolute", top: "100%", right: 0, marginTop: 6,
              background: B.card, border: `1.5px solid ${connected ? "rgba(102,187,106,0.3)" : B.bdrL}`,
              borderRadius: 10, padding: 14, zIndex: 200, width: 280,
              boxShadow: "0 12px 32px rgba(0,0,0,0.5)",
            }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: B.text, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>
                Samsara ELD Integration
              </div>

              {!connected ? (
                <>
                  <div style={{ fontSize: 9, color: B.muted, marginBottom: 8 }}>
                    Enter your Samsara API token to pull real driver HOS data. Token is stored in server memory only — never saved to disk.
                  </div>
                  <input
                    type="password"
                    placeholder="Samsara API Token"
                    value={token}
                    onChange={(e) => setToken(e.target.value)}
                    style={{
                      width: "100%", padding: "7px 10px", borderRadius: 6,
                      background: B.surface, border: `1px solid ${B.bdrL}`,
                      color: B.text, fontSize: 11, fontFamily: "'Montserrat', sans-serif",
                      outline: "none", marginBottom: 8,
                    }}
                    onKeyDown={(e) => { if (e.key === "Enter" && token) { onConnect(token); setToken(""); } }}
                  />
                  {error && <div style={{ fontSize: 9, color: B.cancelRed, marginBottom: 6 }}>{error}</div>}
                  <button
                    onClick={() => { if (token) { onConnect(token); setToken(""); } }}
                    disabled={!token || loading}
                    style={{
                      width: "100%", padding: "6px 0", borderRadius: 6, border: "none",
                      background: token ? B.red : B.surface, color: token ? "#fff" : B.dim,
                      fontSize: 10, fontWeight: 700, cursor: token ? "pointer" : "not-allowed",
                      fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
                    }}
                  >
                    {loading ? "Validating..." : "Connect"}
                  </button>
                </>
              ) : (
                <>
                  <div style={{ fontSize: 9, color: B.greenL, marginBottom: 6 }}>
                    ● Connected to Samsara — HOS data refreshes every 60s
                  </div>
                  {matchInfo && (
                    <div style={{ fontSize: 9, color: matchInfo.unmatched > 0 ? B.gold : B.muted, marginBottom: 6 }}>
                      {matchInfo.matched}/{matchInfo.total} drivers matched
                      {matchInfo.unmatched > 0 && ` · ${matchInfo.unmatched} unmatched`}
                    </div>
                  )}
                  <button
                    onClick={() => { onDisconnect(); setOpen(false); }}
                    style={{
                      width: "100%", padding: "6px 0", borderRadius: 6,
                      background: "rgba(239,83,80,0.1)", color: B.cancelRed,
                      border: `1px solid rgba(239,83,80,0.3)`, fontSize: 10, fontWeight: 700,
                      cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
                    }}
                  >
                    Disconnect
                  </button>
                </>
              )}
            </div>
          )}
        </div>
      );
    };

    // ─── Fuzzy Name Matching ──────────────────────────────────
    function normalizeName(name) {
      return (name || "").toLowerCase().trim().replace(/[^a-z\s]/g, "").replace(/\s+/g, " ");
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++)
        for (let j = 1; j <= n; j++)
          dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      return dp[m][n];
    }

    function matchDriverNames(csvDrivers, samsaraDrivers) {
      const matchMap = {}; // csvDriverId → samsaraDriverId
      const unmatched = [];
      const samsaraList = (samsaraDrivers || []).map(sd => ({
        id: sd.id,
        name: sd.name || "",
        norm: normalizeName(sd.name),
        parts: normalizeName(sd.name).split(" "),
      }));

      for (const csvD of csvDrivers) {
        const csvNorm = normalizeName(csvD.label);
        const csvParts = csvNorm.split(" ");

        // 1. Exact normalized match
        let match = samsaraList.find(s => s.norm === csvNorm);

        // 2. Last name + first initial
        if (!match && csvParts.length >= 2) {
          const csvLast = csvParts[csvParts.length - 1];
          const csvFirstInit = csvParts[0][0];
          match = samsaraList.find(s =>
            s.parts.length >= 2 &&
            s.parts[s.parts.length - 1] === csvLast &&
            s.parts[0][0] === csvFirstInit
          );
        }

        // 3. Reversed name match (Samsara may store "Last, First")
        if (!match && csvParts.length >= 2) {
          const reversed = [...csvParts].reverse().join(" ");
          match = samsaraList.find(s => s.norm === reversed);
        }

        // 4. Levenshtein similarity > 0.8
        if (!match) {
          let bestScore = 0, bestMatch = null;
          for (const s of samsaraList) {
            const maxLen = Math.max(csvNorm.length, s.norm.length);
            if (maxLen === 0) continue;
            const similarity = 1 - levenshtein(csvNorm, s.norm) / maxLen;
            if (similarity > 0.8 && similarity > bestScore) {
              bestScore = similarity;
              bestMatch = s;
            }
          }
          match = bestMatch;
        }

        if (match) {
          matchMap[csvD.id] = match.id;
        } else {
          unmatched.push(csvD.label);
        }
      }

      return { matchMap, unmatched, matched: csvDrivers.length - unmatched.length, total: csvDrivers.length };
    }

    // ─── Enrich Drivers with HOS Data ─────────────────────────
    function enrichWithHOS(drivers, hosData, matchMap, locationData, samsaraDriversList) {
      if (!hosData || !hosData.data) return drivers;
      const hosDrivers = hosData.data;

      // ── Build vehicle → location lookup from /fleet/vehicles/locations ──
      const vehicleLocMap = {}; // vehicleId → formattedLocation string
      if (locationData?.data) {
        locationData.data.forEach(v => {
          const loc = v.location;
          if (!loc) return;
          const label = loc.reverseGeo?.formattedLocation
            || (loc.latitude && loc.longitude ? `${loc.latitude.toFixed(3)}, ${loc.longitude.toFixed(3)}` : null);
          if (!label) return;
          if (v.id) vehicleLocMap[v.id] = label;
          if (v.name) vehicleLocMap[v.name] = label;
        });
      }

      // ── Build samsaraDriverId → vehicleId from /fleet/drivers staticAssignedVehicle ──
      const driverStaticVehicle = {}; // samsaraDriverId → vehicleId
      if (samsaraDriversList?.data) {
        samsaraDriversList.data.forEach(drv => {
          if (drv.staticAssignedVehicle?.id) {
            driverStaticVehicle[drv.id] = drv.staticAssignedVehicle.id;
          }
        });
      }

      // Format remaining times as "Xh Ym"
      const fmtRemaining = (min) => {
        if (min === null) return null;
        const h = Math.floor(min / 60);
        const m = min % 60;
        return m > 0 ? `${h}h${m}m` : `${h}h`;
      };

      const statusMap = {
        "driving": "driving", "Driving": "driving",
        "onDuty": "on_duty", "On Duty": "on_duty", "ON_DUTY": "on_duty",
        "offDuty": "off_duty", "Off Duty": "off_duty", "OFF_DUTY": "off_duty",
        "sleeperBerth": "sleeper_berth", "Sleeper Berth": "sleeper_berth", "SLEEPER_BERTH": "sleeper_berth",
      };

      return drivers.map(d => {
        const samsaraId = matchMap[d.id];
        if (!samsaraId) return d;

        const hosEntry = hosDrivers.find(h => h.driver?.id === samsaraId);
        if (!hosEntry) return d;

        // ── HOS Clocks (confirmed field names from Samsara API) ──
        const clocks = hosEntry.clocks || {};
        const driveRemainingMs = clocks.drive?.driveRemainingDurationMs ?? null;
        const dutyRemainingMs = clocks.shift?.shiftRemainingDurationMs ?? null;
        const cycleRemainingMs = clocks.cycle?.cycleRemainingDurationMs ?? null;
        const breakRemainingMs = clocks.break?.timeUntilBreakDurationMs ?? null;

        const driveRemainingMin = driveRemainingMs !== null ? Math.round(driveRemainingMs / 60000) : null;
        const dutyRemainingMin = dutyRemainingMs !== null ? Math.round(dutyRemainingMs / 60000) : null;
        const cycleRemainingMin = cycleRemainingMs !== null ? Math.round(cycleRemainingMs / 60000) : null;
        const breakRemainingMin = breakRemainingMs !== null ? Math.round(breakRemainingMs / 60000) : null;

        // ── Duty Status (confirmed: hosEntry.currentDutyStatus.hosStatusType) ──
        const currentStatus = hosEntry.currentDutyStatus?.hosStatusType || null;

        // ── Vehicle & Location ──
        // Priority 1: HOS currentVehicle (driver is actively in this truck right now)
        // Priority 2: staticAssignedVehicle from /fleet/drivers
        const currentVehicleId = hosEntry.currentVehicle?.id || null;
        const currentVehicleName = hosEntry.currentVehicle?.name || null;
        const staticVehicleId = driverStaticVehicle[samsaraId] || null;

        const resolvedVehicleId = currentVehicleId || staticVehicleId;
        const resolvedLocation = vehicleLocMap[currentVehicleId]
          || vehicleLocMap[currentVehicleName]
          || vehicleLocMap[staticVehicleId]
          || null;

        // ── Calculate real weekly hours from 70-hr cycle ──
        const cycleMaxMin = 70 * 60;
        const realWeeklyHours = cycleRemainingMin !== null
          ? Math.round((cycleMaxMin - cycleRemainingMin) / 6) / 10
          : d.estWeeklyHours;

        return {
          ...d,
          hosStatus: statusMap[currentStatus] || currentStatus,
          hosDriveRemaining: driveRemainingMin,
          hosDutyRemaining: dutyRemainingMin,
          hosCycleRemaining: cycleRemainingMin,
          hosBreakRemaining: breakRemainingMin,
          hosDriveRemainingFmt: fmtRemaining(driveRemainingMin),
          hosDutyRemainingFmt: fmtRemaining(dutyRemainingMin),
          hosCycleRemainingFmt: fmtRemaining(cycleRemainingMin),
          hosBreakRemainingFmt: fmtRemaining(breakRemainingMin),
          cycleRemaining: cycleRemainingMin !== null ? Math.round(cycleRemainingMin / 6) / 10 : d.cycleRemaining,
          estWeeklyHours: realWeeklyHours,
          hosSource: "samsara",
          vehicleName: currentVehicleName || null,
          vehicleId: resolvedVehicleId,
          currentLocation: resolvedLocation,
        };
      });
    }

    // ─── Schedule Maker: Greedy Best-Fit Algorithm ─────────────
    function getPreferredWindows(profile, driver) {
      // Extract preferred start windows from driver's actual block start hours (best source)
      // Falls back to profile's saved start times if driver data unavailable
      let hours = [];
      // Priority 1: driver's blockStartHours from current CSV (most accurate)
      if (driver?.blockStartHours && driver.blockStartHours.length > 0) {
        hours = driver.blockStartHours;
      }
      // Priority 2: driver's startClusters (pre-computed during transform)
      else if (driver?.startClusters && driver.startClusters.length > 0) {
        return driver.startClusters.map(c => ({ center: c.avg, count: c.count }));
      }
      // Priority 3: saved profile start times
      else if (profile?.startTimes && profile.startTimes.length > 0) {
        hours = profile.startTimes.map(t => t.hour);
      }
      if (hours.length === 0) return [];
      // Cluster hours within 2h of each other
      const clusters = [];
      const used = new Set();
      for (let i = 0; i < hours.length; i++) {
        if (used.has(i)) continue;
        const cluster = [hours[i]];
        used.add(i);
        for (let j = i + 1; j < hours.length; j++) {
          if (used.has(j)) continue;
          const diff = Math.min(Math.abs(hours[j] - cluster[0]), 24 - Math.abs(hours[j] - cluster[0]));
          if (diff <= 2) { cluster.push(hours[j]); used.add(j); }
        }
        const avg = cluster.reduce((a, b) => a + b, 0) / cluster.length;
        clusters.push({ center: avg, count: cluster.length });
      }
      // Return ALL clusters (never drop singletons — every start time matters)
      return clusters;
    }

    const MAX_START_DELTA = 6; // Hard cutoff: ±6h from any known start window

    function scoreDriver(driver, block, assignedCount, profiles) {
      const WEIGHTS = { seat: 0.30, startTime: 0.35, cycle: 0.10, balance: 0.15, proximity: 0.10 };

      // ── Operator ID / Seat match ──
      // Strongest signal: if driver historically runs this seat, they should get it again
      let seatScore = 0;
      if (block.operatorId && driver.blocks) {
        // Count how many of driver's historical blocks are on this same Operator ID
        const blockSeatNum = block.operatorId.split("_").pop(); // e.g., "1000"
        const driverSeatCounts = {};
        let totalBlocks = 0;
        driver.blocks.forEach(b => {
          const sn = (b.truckLabel || "").split("_").pop();
          if (sn) { driverSeatCounts[sn] = (driverSeatCounts[sn] || 0) + 1; totalBlocks++; }
        });
        const matchCount = driverSeatCounts[blockSeatNum] || 0;
        if (matchCount > 0 && totalBlocks > 0) {
          // Strong match: driver has run this exact seat before
          // Score scales with how dominant this seat is for the driver
          seatScore = 0.5 + 0.5 * (matchCount / totalBlocks); // 0.5–1.0 range
        }
      }

      // ── Start time match ──
      // Strategy: use driver's ACTUAL block start hours from CSV as ground truth.
      // Hard cutoff at ±6h — if no window is within 6h, return -1 (reject).
      let startScore = 0;
      let minDelta = 24; // track closest delta for hard cutoff check
      const blockHour = (() => {
        if (!block.blockStart) return null;
        const parts = block.blockStart.split(" ");
        if (parts.length < 2) return null;
        const [h, m] = parts[1].split(":").map(Number);
        return isNaN(h) ? null : h + (m || 0) / 60;
      })();
      if (blockHour !== null) {
        // Use raw start hours directly — every historical block start is a data point
        const rawHours = driver.blockStartHours || [];
        const windows = getPreferredWindows(profiles[driver.label], driver);
        const totalStarts = rawHours.length || 1;

        if (rawHours.length > 0) {
          // Compare against EVERY individual historical start hour, not just cluster centers
          // This captures the actual spread of the driver's schedule
          let bestScore = 0;
          rawHours.forEach(h => {
            const diff = Math.min(Math.abs(blockHour - h), 24 - Math.abs(blockHour - h));
            if (diff < minDelta) minDelta = diff;
          });
          // Also check cluster centers (accounts for profile history)
          windows.forEach(w => {
            const diff = Math.min(Math.abs(blockHour - w.center), 24 - Math.abs(blockHour - w.center));
            if (diff < minDelta) minDelta = diff;
          });

          // ── HARD CUTOFF: reject if > 6h from any known start ──
          if (minDelta > MAX_START_DELTA) return -1;

          // Score using Gaussian on closest window, with consistency & cluster bonuses
          windows.forEach(w => {
            const diff = Math.min(Math.abs(blockHour - w.center), 24 - Math.abs(blockHour - w.center));
            if (diff > MAX_START_DELTA) return; // skip windows outside 6h
            const consistency = driver.shiftConsistency || 50;
            const sigma = consistency >= 80 ? 1.5 : consistency >= 50 ? 2.5 : 3.5;
            const gaussian = Math.exp(-(diff * diff) / (2 * sigma * sigma));
            const clusterWeight = Math.min(w.count / totalStarts + 0.3, 1.0);
            const windowScore = gaussian * clusterWeight;
            if (windowScore > bestScore) bestScore = windowScore;
          });
          startScore = bestScore;
        } else if (windows.length > 0) {
          // Only profile data, no CSV data — use windows but still enforce cutoff
          windows.forEach(w => {
            const diff = Math.min(Math.abs(blockHour - w.center), 24 - Math.abs(blockHour - w.center));
            if (diff < minDelta) minDelta = diff;
          });
          if (minDelta > MAX_START_DELTA) return -1;
          startScore = Math.max(0, (MAX_START_DELTA - minDelta) / MAX_START_DELTA);
        } else {
          startScore = 0.15; // No data at all — very low neutral
        }
      }

      // ── Cycle capacity ──
      const cycleHours = driver.hosSource ? (driver.hosCycleRemaining || 0) / 60 : (driver.cycleRemaining || 70);
      const cycleScore = Math.min(cycleHours / 70, 1);

      // ── Load balance — prefer drivers with fewer blocks ──
      const balanceScore = Math.max(0, (MAX_BLOCKS - assignedCount) / MAX_BLOCKS);

      // ── Facility proximity ──
      let proxScore = 0;
      if (driver.facilities && block.trips) {
        const driverFacs = new Set(driver.facilities.map(f => f.toLowerCase()));
        const blockFacs = new Set();
        block.trips.forEach(t => { if (t.stop1) blockFacs.add(t.stop1.toLowerCase()); if (t.stop2) blockFacs.add(t.stop2.toLowerCase()); });
        let shared = 0;
        blockFacs.forEach(f => { if (driverFacs.has(f)) shared++; });
        proxScore = blockFacs.size > 0 ? shared / blockFacs.size : 0;
      }

      return (seatScore * WEIGHTS.seat) + (startScore * WEIGHTS.startTime) + (cycleScore * WEIGHTS.cycle) + (balanceScore * WEIGHTS.balance) + (proxScore * WEIGHTS.proximity);
    }

    function greedySchedule(blocks, drivers, profiles, hosData) {
      // Minimum 10h rest required between any two adjacent blocks
      const BLOCK_DURATION_MS = 37 * 3600000;  // 37h per block (fallback when end time unknown)
      const REST_1_2_MS = 10 * 3600000;         // 10h minimum rest between any two blocks
      const MAX_BLOCKS = 4;

      const parseTime = (str) => {
        if (!str) return Infinity;
        const parts = str.split(" ");
        if (parts.length < 2) return Infinity;
        const [m, d, y] = parts[0].split("/").map(Number);
        const [h, min] = parts[1].split(":").map(Number);
        return new Date(y, m - 1, d, h, min || 0).getTime();
      };
      const getHour = (str) => {
        if (!str) return null;
        const parts = str.split(" ");
        if (parts.length < 2) return null;
        const [h, m] = parts[1].split(":").map(Number);
        return isNaN(h) ? null : h + (m || 0) / 60;
      };

      // ═══ STEP 1: Build driver seat profiles ═══
      const driverProfiles = drivers.map(d => {
        const seatCounts = {};
        (d.blocks || []).forEach(b => {
          const sn = (b.truckLabel || "").split("_").pop();
          if (sn) seatCounts[sn] = (seatCounts[sn] || 0) + 1;
        });
        const seats = Object.entries(seatCounts).sort((a, b) => b[1] - a[1]);
        return {
          ...d,
          primarySeat: seats[0]?.[0] || null,
          secondarySeats: seats.slice(1).map(s => s[0]),
          allSeats: new Set(seats.map(s => s[0])),
          numSeats: seats.length,
          totalHistBlocks: seats.reduce((sum, s) => sum + s[1], 0),
          prefHours: d.blockStartHours || [],
        };
      });

      // ═══ STEP 2: Sort drivers — most constrained first ═══
      // Single-seat drivers first (least flexible), then by historical block count desc
      driverProfiles.sort((a, b) => {
        if (a.numSeats !== b.numSeats) return a.numSeats - b.numSeats; // fewer seats = more constrained
        return b.totalHistBlocks - a.totalHistBlocks; // more history = higher priority
      });

      // ═══ STEP 3: Build available block pool ═══
      const available = new Set(blocks.map((_, i) => i)); // track by index
      const blockList = blocks.map(b => ({
        ...b,
        seatNum: (b.operatorId || "").split("_").pop(),
        startMs: parseTime(b.blockStart),
        endMs: parseTime(b.blockEnd),
        startHour: getHour(b.blockStart),
      }));

      const schedule = {}; // driverId → Block[]
      const schedDriverWins = {}; // driverId → [[startMs, endMs], ...]
      drivers.forEach(d => { schedDriverWins[d.id] = []; });

      // Helper: check rest requirements — flat 10h minimum between any two blocks
      const fitsWindows = (driverId, startMs, endMs) => {
        if (startMs === Infinity) return true;
        const windows = schedDriverWins[driverId] || [];
        const effEnd = (endMs && endMs !== Infinity) ? endMs : startMs + BLOCK_DURATION_MS;
        return windows.every(([s, e]) => {
          const existEnd = (e && e !== Infinity) ? e : s + BLOCK_DURATION_MS;
          return startMs >= existEnd + REST_1_2_MS || effEnd <= s - REST_1_2_MS;
        });
      };

      // Helper: score a block for a driver
      const scoreBlock = (dp, blk) => {
        // Seat match: primary = 1.0, secondary = 0.5, unknown = 0.1
        let seatScore = 0.1;
        if (blk.seatNum === dp.primarySeat) seatScore = 1.0;
        else if (dp.secondarySeats.includes(blk.seatNum)) seatScore = 0.5;

        // Time match: Gaussian against driver's preferred hours
        let timeScore = 0.3; // neutral if no pref data
        if (blk.startHour !== null && dp.prefHours.length > 0) {
          let minDelta = 24;
          dp.prefHours.forEach(h => {
            const diff = Math.min(Math.abs(blk.startHour - h), 24 - Math.abs(blk.startHour - h));
            if (diff < minDelta) minDelta = diff;
          });
          if (minDelta > MAX_START_DELTA) timeScore = 0; // hard cutoff
          else {
            const sigma = (dp.shiftConsistency || 50) >= 80 ? 1.5 : 2.5;
            timeScore = Math.exp(-(minDelta * minDelta) / (2 * sigma * sigma));
          }
        }

        return seatScore * 0.5 + timeScore * 0.5;
      };

      // ═══ STEP 4: For each driver, pick their best 4 blocks ═══
      driverProfiles.forEach(dp => {
        if (!dp.domicile) return;

        // Find all available blocks in same domicile
        const candidates = [];
        available.forEach(idx => {
          const blk = blockList[idx];
          // Domicile check (from Operator ID)
          const blkDom = (blk.operatorId || "").split("_")[1] || blk.domicile || "";
          if (blkDom !== dp.domicile) return;
          // Rest check against already-assigned blocks
          if (!fitsWindows(dp.id, blk.startMs, blk.endMs)) return;
          const score = scoreBlock(dp, blk);
          if (score > 0) candidates.push({ idx, blk, score });
        });

        // Sort chronologically first, then by score for ties within same day
        candidates.sort((a, b) => a.blk.startMs - b.blk.startMs || b.score - a.score);

        // ── Pick up to 4 blocks SPREAD across the date range ──
        // Divide candidates into 4 time windows and pick best from each
        const validTimes = candidates.filter(c => c.blk.startMs !== Infinity).map(c => c.blk.startMs);
        const buckets = [[], [], [], []];
        if (validTimes.length === 0) {
          // No valid timestamps — put all candidates in first bucket
          buckets[0] = candidates.slice();
        } else {
        const minTime = Math.min(...validTimes);
        const maxTime = Math.max(...validTimes);
        const span = maxTime - minTime || 1;
        const quarters = [minTime, minTime + span / 4, minTime + span / 2, minTime + 3 * span / 4, maxTime + 1];

        candidates.forEach(c => {
          const t = c.blk.startMs;
          if (t === Infinity) { buckets[3].push(c); return; }
          if (t < quarters[1]) buckets[0].push(c);
          else if (t < quarters[2]) buckets[1].push(c);
          else if (t < quarters[3]) buckets[2].push(c);
          else buckets[3].push(c);
        });
        } // end validTimes guard
        buckets.forEach(b => b.sort((a, b) => b.score - a.score));

        // Pick one from each bucket, then fill remaining from any bucket
        let picked = 0;
        const pickedWindows = [];
        const pickFromBucket = (bucket) => {
          for (const c of bucket) {
            if (picked >= MAX_BLOCKS) return false;
            const effEnd = (c.blk.endMs && c.blk.endMs !== Infinity) ? c.blk.endMs : c.blk.startMs + BLOCK_DURATION_MS;
            // Flat 10h rest check against all existing picks
            const restOk = pickedWindows.every(([s, e]) => {
              const existEnd = (e && e !== Infinity) ? e : s + BLOCK_DURATION_MS;
              return c.blk.startMs >= existEnd + REST_1_2_MS || effEnd <= s - REST_1_2_MS;
            });
            if (!restOk) continue;
            c._picked = true;
            return c;
          }
          return null;
        };

        // Helper: commit a pick to the schedule
        const commitPick = (c) => {
          available.delete(c.idx);
          pickedWindows.push([c.blk.startMs, c.blk.endMs]);
          schedDriverWins[dp.id].push([c.blk.startMs, c.blk.endMs]);
          if (!schedule[dp.id]) schedule[dp.id] = [];
          const matchType = c.blk.seatNum === dp.primarySeat ? "seat" : dp.allSeats.has(c.blk.seatNum) ? "seat2" : "time";
          schedule[dp.id].push({ ...c.blk, matchType, score: c.score });
        };

        // First pass: one from each of 4 buckets
        for (const bucket of buckets) {
          const pick = pickFromBucket(bucket);
          if (pick) {
            commitPick(pick);
            picked++;
          }
        }
        // Second pass: fill remaining from any bucket (best score first)
        const remaining = candidates.filter(c => !c._picked).sort((a, b) => b.score - a.score);
        for (const c of remaining) {
          if (picked >= MAX_BLOCKS) break;
          const effEnd = (c.blk.endMs && c.blk.endMs !== Infinity) ? c.blk.endMs : c.blk.startMs + BLOCK_DURATION_MS;
          const restOk = pickedWindows.every(([s, e]) => {
            const existEnd = (e && e !== Infinity) ? e : s + BLOCK_DURATION_MS;
            return c.blk.startMs >= existEnd + REST_1_2_MS || effEnd <= s - REST_1_2_MS;
          });
          if (!restOk) continue;
          commitPick(c);
          picked++;
        }
      });

      // Collect unassigned
      const unassigned = [];
      available.forEach(idx => unassigned.push(blockList[idx]));

      return { schedule, unassigned };
    }

    // Parse schedule CSV into blocks with domicile extraction
    function parseScheduleBlocks(rows) {
      const blocks = [];
      const blockMap = {}; // blockId → block
      rows.forEach(row => {
        const blockId = (row["Block ID"] || "").trim();
        const operatorId = (row["Operator ID"] || "").trim();
        const driverName = (row["Driver Name"] || "").trim();
        if (!blockId) return;
        if (!blockMap[blockId]) {
          // Extract domicile from Operator ID (e.g., JYRG_LAS_Solo2_1021 → LAS)
          const parts = operatorId.split("_");
          const domicile = parts.length >= 2 ? parts[1] : "UNKNOWN";
          blockMap[blockId] = {
            blockId, operatorId, domicile, driverName,
            trips: [], blockStart: null, blockEnd: null, totalMiles: 0,
          };
          blocks.push(blockMap[blockId]);
        }
        const blk = blockMap[blockId];
        const dist = parseFloat(row["Estimate Distance"] || "0") || 0;
        blk.totalMiles += dist;
        const trip = {
          tripId: (row["Trip ID"] || "").trim(),
          stop1: (row["Stop 1"] || "").trim(), stop2: (row["Stop 2"] || "").trim(),
          distance: dist,
          stop1ArrDate: (row["Stop 1 Planned Arrival Date"] || "").trim(),
          stop1ArrTime: (row["Stop 1 Planned Arrival Time"] || "").trim(),
          stop2ArrDate: (row["Stop 2 Planned Arrival Date"] || "").trim(),
          stop2ArrTime: (row["Stop 2 Planned Arrival Time"] || "").trim(),
          stage: (row["Trip Stage"] || "").trim(),
        };
        blk.trips.push(trip);
        // Update block start/end from trip times
        if (trip.stop1ArrDate && trip.stop1ArrTime) {
          const ts = `${trip.stop1ArrDate} ${trip.stop1ArrTime}`;
          if (!blk.blockStart || ts < blk.blockStart) blk.blockStart = ts;
        }
        if (trip.stop2ArrDate && trip.stop2ArrTime) {
          const ts = `${trip.stop2ArrDate} ${trip.stop2ArrTime}`;
          if (!blk.blockEnd || ts > blk.blockEnd) blk.blockEnd = ts;
        }
      });
      return blocks;
    }
