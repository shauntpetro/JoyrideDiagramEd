<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joyride Logistics LLC — Fleet Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #1c1f26; font-family: 'Montserrat', 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #252830; }
    ::-webkit-scrollbar-thumb { background: #555862; border-radius: 3px; }
    @keyframes blockPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .block-cancel { animation: blockPulse 0.3s ease; }
    .panel-enter { animation: fadeSlideIn 0.25s ease; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

    const B = {
      red: "#C13B40", redLight: "#d4585d", redDark: "#9e2f33",
      redGlow: "rgba(193,59,64,0.15)", redSub: "rgba(193,59,64,0.08)",
      bg: "#1c1f26", header: "#14161c", card: "#252830",
      cardHover: "#2e313b", surface: "#2a2d36",
      bdr: "rgba(255,255,255,0.06)", bdrL: "rgba(255,255,255,0.10)",
      white: "#f0f1f4", text: "#d0d2d8", muted: "#8e919c",
      dim: "#6b6e78", subtle: "#555862",
      green: "#66bb6a", greenL: "#a5d6a7", greenBg: "rgba(102,187,106,0.10)",
      gold: "#ffd54f", goldDim: "#d4a53a", goldBg: "rgba(255,213,79,0.10)",
      bkp: "#ba68c8", bkpL: "#ce93d8", bkpBg: "rgba(186,104,200,0.10)",
      cancelRed: "#ef5350", cancelBg: "rgba(239,83,80,0.10)",
      grad: "linear-gradient(135deg, #C13B40 0%, #363535 60%, #C13B40 100%)",
    };

    const MODELS = {
      current: {
        label: "New System",
        tag: "20 / 10 / 4",
        numDrivers: 20,
        numTrucks: 10,
        blocksPerLoad: 4,
        hasPrimarySecondary: true,
      },
      legacy: {
        label: "Legacy System",
        tag: "20 / 20 / 3",
        numDrivers: 20,
        numTrucks: 20,
        blocksPerLoad: 3,
        hasPrimarySecondary: false,
      },
    };

    const DRIVER_NAMES = [
      "M. Neuer", "J. Kimmich", "D. Upamecano", "M. de Ligt", "A. Davies",
      "J. Musiala", "L. Goretzka", "T. Muller", "L. Sane", "S. Gnabry",
      "H. Kane", "K. Coman", "R. Guerreiro", "N. Mazraoui", "E. Laimer",
      "B. Pavard", "M. Tel", "P. Chupo", "J. Stanisic", "G. Peretz",
    ];

    function buildData(model) {
      const drivers = Array.from({ length: model.numDrivers }, (_, i) => ({ id: i + 1, label: DRIVER_NAMES[i] || `Driver ${i + 1}` }));
      let trucks;
      if (model.hasPrimarySecondary) {
        trucks = Array.from({ length: model.numTrucks }, (_, i) => ({
          id: i + 1, label: `Truck ${i + 1}`,
          primaryDriver: i * 2 + 1, secondaryDriver: i * 2 + 2,
        }));
      } else {
        trucks = Array.from({ length: model.numTrucks }, (_, i) => ({
          id: i + 1, label: `Truck ${i + 1}`,
          primaryDriver: i + 1, secondaryDriver: null,
        }));
      }
      return { drivers, trucks, blocksPerLoad: model.blocksPerLoad, hasPrimarySecondary: model.hasPrimarySecondary };
    }

    // ─── CSV Parser & Data Transformer ───────────────────────────
    function parseCSV(text) {
      const lines = text.split("\n").filter(l => l.trim());
      const headers = lines[0].split(",");
      return lines.slice(1).map(line => {
        const vals = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') { inQuotes = !inQuotes; }
          else if (line[i] === ',' && !inQuotes) { vals.push(current.trim()); current = ""; }
          else { current += line[i]; }
        }
        vals.push(current.trim());
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = vals[i] || ""; });
        return obj;
      });
    }

    function transformCSVData(rows, regionFilter) {
      // ── Step 1: Compute per-driver stats from ALL rows (before filtering) ──
      const driverStats = {}; // name → { totalMiles, tripCount, facilities, blockIds, workTypes }
      const driverSet = new Map(); // name → id
      let nextDriverId = 1;

      rows.forEach(row => {
        const name = (row["Driver Name"] || "").trim();
        if (!name) return;
        if (!driverSet.has(name)) driverSet.set(name, nextDriverId++);
        if (!driverStats[name]) driverStats[name] = { totalMiles: 0, tripCount: 0, facilities: new Set(), blockIds: new Set(), workTypes: new Set() };
        const s = driverStats[name];
        s.tripCount++;
        const dist = parseFloat(row["Estimate Distance"]) || 0;
        s.totalMiles += dist;
        const stop1 = (row["Stop 1"] || "").trim();
        const stop2 = (row["Stop 2"] || "").trim();
        if (stop1) s.facilities.add(stop1);
        if (stop2) s.facilities.add(stop2);
        const blockId = (row["Block ID"] || "").trim();
        if (blockId) s.blockIds.add(blockId);
        const shipper = (row["Shipper Account"] || "").trim();
        if (shipper) s.workTypes.add(shipper);
      });

      // Estimate weekly hours
      Object.values(driverStats).forEach(s => {
        s.estWeeklyHours = Math.round((s.totalMiles / 45) * 10) / 10;
      });

      // ── Step 2: Group by Operator ID (= seat/load) ──
      const byOperator = {};
      rows.forEach(row => {
        const opId = (row["Operator ID"] || "").trim();
        const driverName = (row["Driver Name"] || "").trim();
        const blockId = (row["Block ID"] || "").trim();
        if (!opId && !driverName) return;

        if (opId) {
          if (!byOperator[opId]) byOperator[opId] = { trips: [], drivers: new Set(), blocks: new Set(), facilities: new Set() };
          byOperator[opId].trips.push(row);
          if (driverName) byOperator[opId].drivers.add(driverName);
          if (blockId) byOperator[opId].blocks.add(blockId);
          const s1 = (row["Stop 1"] || "").trim();
          const s2 = (row["Stop 2"] || "").trim();
          if (s1) byOperator[opId].facilities.add(s1);
          if (s2) byOperator[opId].facilities.add(s2);
        }
      });

      // ── Step 3: Extract regions, filter ──
      const regions = new Set();
      Object.keys(byOperator).forEach(opId => {
        const parts = opId.split("_");
        if (parts.length >= 2) regions.add(parts[1]);
      });

      const filteredOps = Object.entries(byOperator).filter(([opId]) => {
        if (!regionFilter || regionFilter === "ALL") return true;
        const parts = opId.split("_");
        return parts.length >= 2 && parts[1] === regionFilter;
      });
      filteredOps.sort(([a], [b]) => a.localeCompare(b));

      // ── Step 4: Build drivers and loads ──
      const allDriverNames = [];
      const trucks = [];
      let loadId = 1;

      filteredOps.forEach(([opId, data]) => {
        const driverArr = [...data.drivers];
        const primary = driverArr[0] ? driverSet.get(driverArr[0]) : null;
        const secondary = driverArr[1] ? driverSet.get(driverArr[1]) : null;
        driverArr.forEach(name => { if (!allDriverNames.includes(name)) allDriverNames.push(name); });

        // Build per-block trip details and per-block driver mapping
        const blockTrips = {};
        const blockDriverMap = {}; // blockId → driverName
        data.trips.forEach(row => {
          const bid = (row["Block ID"] || "").trim();
          if (!bid) return;
          if (!blockTrips[bid]) blockTrips[bid] = [];
          blockTrips[bid].push({
            tripId: (row["Trip ID"] || "").trim(),
            stop1: (row["Stop 1"] || "").trim(),
            stop2: (row["Stop 2"] || "").trim(),
            distance: parseFloat(row["Estimate Distance"]) || 0,
            plannedArr: (row["Stop 1 Planned Arrival"] || "").trim(),
            plannedDep: (row["Stop 1 Planned Departure"] || "").trim(),
            stop2Arr: (row["Stop 2 Planned Arrival"] || "").trim(),
            stage: (row["Trip Stage"] || "").trim(),
            driver: (row["Driver Name"] || "").trim(),
            // Date/time fields (with fallbacks)
            stop1ArrDate: (row["Stop 1 Planned Arrival Date"] || "").trim(),
            stop1ArrTime: (row["Stop 1 Planned Arrival Time"] || "").trim(),
            stop1DepDate: (row["Stop 1  Planned Departure Date"] || "").trim(),
            stop1DepTime: (row["Stop 1  Planned Departure Time"] || "").trim(),
            stop2ArrDate: (row["Stop 2 Planned Arrival Date"] || row["Stop 2  Planned Departure Date"] || "").trim(),
            stop2ArrTime: (row["Stop 2 Planned Arrival Time"] || row["Stop 2  Planned Departure Time"] || "").trim(),
          });
          // Track which driver owns each block
          const dName = (row["Driver Name"] || "").trim();
          if (dName && !blockDriverMap[bid]) blockDriverMap[bid] = dName;
        });

        // Build ordered list of block drivers (index-aligned with blockIds)
        const blockIds = [...data.blocks];
        const blockDrivers = blockIds.map(bid => {
          const dName = blockDriverMap[bid];
          return dName ? (driverSet.get(dName) || null) : null;
        });

        trucks.push({
          id: loadId, label: opId, operatorId: opId,
          primaryDriver: primary, secondaryDriver: secondary || null,
          blockCount: Math.max(data.blocks.size, 1),
          tripData: data.trips, blockIds,
          blockDrivers, // actual driver ID per block index (aligned with blockIds)
          facilities: [...data.facilities],
          blockTrips, // { blockId → [{tripId, stop1, stop2, distance, ...}] }
        });
        loadId++;
      });

      // ── Step 5: Build per-driver block list and domicile info ──
      // Determine each driver's domicile from their most-used Operator ID region
      const driverDomicileMap = {}; // driverName → region
      const driverRegionCount = {}; // driverName → { region → count }
      rows.forEach(row => {
        const name = (row["Driver Name"] || "").trim();
        const opId = (row["Operator ID"] || "").trim();
        if (!name || !opId) return;
        const parts = opId.split("_");
        if (parts.length < 2) return;
        const region = parts[1];
        if (!driverRegionCount[name]) driverRegionCount[name] = {};
        driverRegionCount[name][region] = (driverRegionCount[name][region] || 0) + 1;
      });
      Object.entries(driverRegionCount).forEach(([name, regions]) => {
        driverDomicileMap[name] = Object.entries(regions).sort((a, b) => b[1] - a[1])[0][0];
      });

      // Build per-driver block data (which blocks does each driver actually have)
      const driverBlocksMap = {}; // driverId → [{ blockId, truckId, truckLabel, trips, stage }]
      trucks.forEach(truck => {
        (truck.blockIds || []).forEach((blockId, idx) => {
          const driverId = truck.blockDrivers?.[idx];
          if (!driverId) return;
          if (!driverBlocksMap[driverId]) driverBlocksMap[driverId] = [];
          const trips = truck.blockTrips?.[blockId] || [];
          const stages = trips.map(t => t.stage).filter(Boolean);
          const dominantStage = stages.length > 0
            ? Object.entries(stages.reduce((acc, s) => { acc[s] = (acc[s] || 0) + 1; return acc; }, {})).sort((a, b) => b[1] - a[1])[0]?.[0]
            : null;
          // Compute block start (earliest Stop 1 arrival) and end (latest Stop 2 arrival)
          let blockStart = null, blockEnd = null;
          trips.forEach(t => {
            if (t.stop1ArrDate && t.stop1ArrTime) {
              const dt = `${t.stop1ArrDate} ${t.stop1ArrTime}`;
              if (!blockStart || dt < blockStart) blockStart = dt;
            }
            if (t.stop2ArrDate && t.stop2ArrTime) {
              const dt = `${t.stop2ArrDate} ${t.stop2ArrTime}`;
              if (!blockEnd || dt > blockEnd) blockEnd = dt;
            }
          });

          driverBlocksMap[driverId].push({
            blockId, truckId: truck.id, truckLabel: truck.operatorId,
            trips, stage: dominantStage,
            totalMiles: Math.round(trips.reduce((s, t) => s + t.distance, 0)),
            blockStart, blockEnd,
          });
        });
      });

      // Sort each driver's blocks chronologically and compute total scheduled hours
      const parseBlockDate = (s) => {
        if (!s) return Infinity;
        // Format: "MM/DD/YYYY HH:MM"
        const [datePart, timePart] = s.split(" ");
        if (!datePart) return Infinity;
        const [m, d, y] = datePart.split("/");
        return new Date(`${y}-${m}-${d}T${timePart || "00:00"}`).getTime() || Infinity;
      };
      const driverScheduledHours = {}; // driverId → total hours from block time spans
      Object.entries(driverBlocksMap).forEach(([driverId, blocks]) => {
        blocks.sort((a, b) => parseBlockDate(a.blockStart) - parseBlockDate(b.blockStart));
        // Sum hours from each block's start→end span
        let totalHrs = 0;
        blocks.forEach(blk => {
          const startMs = parseBlockDate(blk.blockStart);
          const endMs = parseBlockDate(blk.blockEnd);
          if (startMs !== Infinity && endMs !== Infinity && endMs > startMs) {
            totalHrs += (endMs - startMs) / 3600000; // ms → hours
          }
        });
        driverScheduledHours[driverId] = Math.round(totalHrs * 10) / 10;
      });

      // ── Step 6: Preferred start time analysis (from block start times) ──
      const driverStartPrefs = {}; // driverId → { preferredStartLabel, preferredShift, shiftConsistency, ... }
      Object.entries(driverBlocksMap).forEach(([driverId, blocks]) => {
        // Extract the hour-of-day from each block's start time
        const blockStartHours = [];
        blocks.forEach(blk => {
          if (!blk.blockStart) return;
          const parts = blk.blockStart.split(" ");
          if (parts.length < 2) return;
          const [hr, min] = parts[1].split(":").map(Number);
          if (!isNaN(hr)) blockStartHours.push(hr + (min || 0) / 60);
        });

        if (blockStartHours.length === 0) {
          driverStartPrefs[driverId] = { avgStartHour: null, modeStartHour: null, preferredShift: null, shiftConsistency: 0, preferredStartLabel: null };
          return;
        }

        // Group into 2-hour windows and find the most common cluster
        const windows = {}; // windowStart → { count, hours[] }
        blockStartHours.forEach(h => {
          // Round down to nearest 2-hour window (0-2, 2-4, 4-6, ..., 22-24)
          const windowStart = Math.floor(h / 2) * 2;
          if (!windows[windowStart]) windows[windowStart] = { count: 0, hours: [] };
          windows[windowStart].count++;
          windows[windowStart].hours.push(h);
        });

        // Find the top window
        const sortedWindows = Object.entries(windows).sort((a, b) => b[1].count - a[1].count);
        const topWindow = sortedWindows[0];
        const topWindowStart = parseInt(topWindow[0], 10);
        const topWindowHours = topWindow[1].hours;

        // Average within the top window for precise preferred time
        const avgInWindow = topWindowHours.reduce((a, b) => a + b, 0) / topWindowHours.length;
        const roundedHour = Math.round(avgInWindow);

        // Shift classification
        const amCount = blockStartHours.filter(h => h >= 4 && h < 10).length;
        const midCount = blockStartHours.filter(h => h >= 10 && h < 15).length;
        const pmCount = blockStartHours.filter(h => h >= 15 && h < 21).length;
        const nightCount = blockStartHours.filter(h => h >= 21 || h < 4).length;
        const shifts = [
          { label: "AM", count: amCount },
          { label: "MID", count: midCount },
          { label: "PM", count: pmCount },
          { label: "NIGHT", count: nightCount },
        ].sort((a, b) => b.count - a.count);
        const preferredShift = shifts[0].label;
        const shiftConsistency = Math.round((shifts[0].count / blockStartHours.length) * 100);

        // Format label — show the average start time in the preferred window
        const displayHr = roundedHour % 12 || 12;
        const displayAmPm = roundedHour >= 12 ? "pm" : "am";
        // Also show minutes if the average isn't on the hour
        const avgMin = Math.round((avgInWindow - Math.floor(avgInWindow)) * 60);
        const preferredStartLabel = avgMin > 5 && avgMin < 55
          ? `${displayHr}:${avgMin.toString().padStart(2, "0")}${displayAmPm}`
          : `${displayHr}${displayAmPm}`;

        driverStartPrefs[driverId] = {
          avgStartHour: Math.round(avgInWindow * 10) / 10,
          modeStartHour: roundedHour,
          preferredShift,
          shiftConsistency,
          preferredStartLabel,
          blockStartCount: blockStartHours.length,
          windowRange: `${topWindowStart}:00-${topWindowStart + 2}:00`,
        };
      });

      // Number drivers within each domicile
      const domicileNumbers = {}; // region → counter
      const driversByDomicile = {}; // region → [driverName]
      allDriverNames.forEach(name => {
        const dom = driverDomicileMap[name] || "OTHER";
        if (!driversByDomicile[dom]) driversByDomicile[dom] = [];
        driversByDomicile[dom].push(name);
      });

      const drivers = allDriverNames.map(name => {
        const s = driverStats[name] || {};
        const dom = driverDomicileMap[name] || "OTHER";
        if (!domicileNumbers[dom]) domicileNumbers[dom] = 1;
        const driverNum = domicileNumbers[dom]++;
        const dId = driverSet.get(name);
        const schedHrs = driverScheduledHours[dId] || 0;
        const estDriveHours = Math.round((s.totalMiles || 0) / 45 * 10) / 10; // miles ÷ 45mph
        const CYCLE_MAX = 70; // 70-hour/8-day cycle
        const cycleUsed = estDriveHours; // best estimate without ELD
        const cycleRemaining = Math.max(Math.round((CYCLE_MAX - cycleUsed) * 10) / 10, 0);
        return {
          id: dId, label: name,
          totalMiles: Math.round(s.totalMiles || 0),
          estDriveHours,
          estWeeklyHours: estDriveHours,
          scheduledHours: schedHrs,
          cycleRemaining,
          tripCount: s.tripCount || 0,
          blockCount: s.blockIds ? s.blockIds.size : 0,
          facilities: s.facilities ? [...s.facilities] : [],
          workTypes: s.workTypes ? [...s.workTypes] : [],
          domicile: dom,
          driverNumber: driverNum,
          blocks: driverBlocksMap[dId] || [],
          // Preferred start time profile (derived from block start times)
          ...(driverStartPrefs[dId] || { avgStartHour: null, modeStartHour: null, preferredShift: null, shiftConsistency: 0, preferredStartLabel: null }),
        };
      });

      const maxBlocks = Math.min(Math.max(...trucks.map(t => t.blockCount), 1), 6);
      const hasPrimSec = trucks.some(t => t.secondaryDriver !== null);

      // Get ordered list of domiciles present
      const domicileOrder = [...new Set(drivers.map(d => d.domicile))].sort();

      return {
        drivers, trucks, blocksPerLoad: maxBlocks, hasPrimarySecondary: hasPrimSec,
        regions: [...regions].sort(), totalTrips: rows.length, csvMode: true,
        driverStats, driverBlocksMap, domicileOrder,
      };
    }

    // ─── Upload Component ──────────────────────────────────────
    const CSVUpload = ({ onUpload, onClear, hasData }) => {
      const [dragging, setDragging] = useState(false);
      const fileRef = useRef(null);

      const handleFile = (file) => {
        if (!file || !file.name.endsWith(".csv")) return;
        const reader = new FileReader();
        reader.onload = (e) => onUpload(e.target.result);
        reader.readAsText(file);
      };

      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {hasData ? (
            <button onClick={onClear} style={{
              background: "rgba(100,100,100,0.3)", color: B.muted, border: `1px solid ${B.subtle}`,
              borderRadius: 4, padding: "5px 12px", fontSize: 10, fontWeight: 700,
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
              letterSpacing: 0.5,
            }}>Demo Mode</button>
          ) : null}
          <div
            onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
            onClick={() => fileRef.current?.click()}
            style={{
              padding: "5px 14px", borderRadius: 6, fontSize: 10, fontWeight: 700,
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
              letterSpacing: 0.5, transition: "all 0.2s",
              background: dragging ? "rgba(102,187,106,0.2)" : hasData ? "rgba(102,187,106,0.1)" : "rgba(193,59,64,0.1)",
              border: dragging ? `2px dashed ${B.green}` : hasData ? `1px solid rgba(102,187,106,0.3)` : `1px solid rgba(193,59,64,0.3)`,
              color: dragging ? B.greenL : hasData ? B.greenL : B.redLight,
            }}
          >
            {hasData ? "CSV Loaded" : "Upload CSV"}
            <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }}
              onChange={(e) => handleFile(e.target.files[0])} />
          </div>
        </div>
      );
    };

    // ─── Region Tabs ─────────────────────────────────────────────
    const RegionTabs = ({ regions, active, onSelect }) => (
      <div style={{ display: "flex", gap: 4 }}>
        {["ALL", ...regions].map(r => (
          <button key={r} onClick={() => onSelect(r)} style={{
            padding: "4px 10px", borderRadius: 4, fontSize: 10, fontWeight: 700,
            cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
            letterSpacing: 0.5, border: "none", transition: "all 0.2s",
            background: active === r ? B.red : "rgba(255,255,255,0.05)",
            color: active === r ? "#fff" : B.muted,
          }}>{r}</button>
        ))}
      </div>
    );

    // ─── Samsara ELD Connect ─────────────────────────────────
    const SamsaraConnect = ({ connected, onConnect, onDisconnect, loading, error, matchInfo }) => {
      const [open, setOpen] = useState(false);
      const [token, setToken] = useState("");
      const dropRef = useRef(null);

      // Close dropdown on outside click
      useEffect(() => {
        const handler = (e) => { if (dropRef.current && !dropRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, []);

      return (
        <div ref={dropRef} style={{ position: "relative" }}>
          <button onClick={() => setOpen(!open)} style={{
            display: "flex", alignItems: "center", gap: 6,
            padding: "5px 12px", borderRadius: 6, fontSize: 10, fontWeight: 700,
            cursor: "pointer", fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
            letterSpacing: 0.5, transition: "all 0.2s", border: "none",
            background: connected ? "rgba(102,187,106,0.12)" : "rgba(193,59,64,0.10)",
            color: connected ? B.greenL : B.redLight,
          }}>
            {connected && <span style={{ width: 6, height: 6, borderRadius: "50%", background: B.green, boxShadow: `0 0 6px ${B.green}`, animation: "pulse 2s infinite" }} />}
            {loading ? "Connecting..." : connected ? "ELD Live" : "Connect ELD"}
          </button>

          {open && (
            <div className="panel-enter" style={{
              position: "absolute", top: "100%", right: 0, marginTop: 6,

    // ─── Fuzzy Name Matching ──────────────────────────────────
    function normalizeName(name) {
      return (name || "").toLowerCase().trim().replace(/[^a-z\s]/g, "").replace(/\s+/g, " ");
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++)
        for (let j = 1; j <= n; j++)
          dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      return dp[m][n];
    }

    function matchDriverNames(csvDrivers, samsaraDrivers) {
      const matchMap = {}; // csvDriverId → samsaraDriverId
      const unmatched = [];
      const samsaraList = (samsaraDrivers || []).map(sd => ({
        id: sd.id,
        name: sd.name || "",
        norm: normalizeName(sd.name),
        parts: normalizeName(sd.name).split(" "),
      }));

      for (const csvD of csvDrivers) {
        const csvNorm = normalizeName(csvD.label);
        const csvParts = csvNorm.split(" ");

        // 1. Exact normalized match
        let match = samsaraList.find(s => s.norm === csvNorm);

        // 2. Last name + first initial
        if (!match && csvParts.length >= 2) {
          const csvLast = csvParts[csvParts.length - 1];
          const csvFirstInit = csvParts[0][0];
          match = samsaraList.find(s =>
            s.parts.length >= 2 &&
            s.parts[s.parts.length - 1] === csvLast &&
            s.parts[0][0] === csvFirstInit
          );
        }

        // 3. Reversed name match (Samsara may store "Last, First")
        if (!match && csvParts.length >= 2) {
          const reversed = [...csvParts].reverse().join(" ");
          match = samsaraList.find(s => s.norm === reversed);
        }

        // 4. Levenshtein similarity > 0.8
        if (!match) {
          let bestScore = 0, bestMatch = null;
          for (const s of samsaraList) {
            const maxLen = Math.max(csvNorm.length, s.norm.length);
            if (maxLen === 0) continue;
            const similarity = 1 - levenshtein(csvNorm, s.norm) / maxLen;
            if (similarity > 0.8 && similarity > bestScore) {
              bestScore = similarity;
              bestMatch = s;
            }
          }
          match = bestMatch;
        }

        if (match) {
          matchMap[csvD.id] = match.id;
        } else {
          unmatched.push(csvD.label);
        }
      }

      return { matchMap, unmatched, matched: csvDrivers.length - unmatched.length, total: csvDrivers.length };
    }

    // ─── Enrich Drivers with HOS Data ─────────────────────────
    function enrichWithHOS(drivers, hosData, matchMap) {
      if (!hosData || !hosData.data) return drivers;
      const hosDrivers = hosData.data;

      return drivers.map(d => {
        const samsaraId = matchMap[d.id];
        if (!samsaraId) return d;

        const hosEntry = hosDrivers.find(h => h.driver?.id === samsaraId);
        if (!hosEntry) return d;

        const clocks = hosEntry.clocks || {};
        // Samsara returns durations in milliseconds
        const driveRemainingMs = clocks.driveRemaining?.timeRemainingMs ?? null;
        const dutyRemainingMs = clocks.shiftRemaining?.timeRemainingMs ?? null;
        const cycleRemainingMs = clocks.cycleRemaining?.timeRemainingMs ?? null;

        const driveRemainingMin = driveRemainingMs !== null ? Math.round(driveRemainingMs / 60000) : null;
        const dutyRemainingMin = dutyRemainingMs !== null ? Math.round(dutyRemainingMs / 60000) : null;
        const cycleRemainingMin = cycleRemainingMs !== null ? Math.round(cycleRemainingMs / 60000) : null;

        // Current duty status
        const currentStatus = hosEntry.currentDutyStatus?.hosStatusType || null;
        const statusMap = {
          "driving": "driving",
          "onDuty": "on_duty",
          "offDuty": "off_duty",
          "sleeperBerth": "sleeper_berth",
        };

        // Calculate real weekly hours from cycle (70-hr cycle minus remaining)
        const cycleMaxMin = 70 * 60; // 70 hours in minutes
        const realWeeklyHours = cycleRemainingMin !== null
          ? Math.round((cycleMaxMin - cycleRemainingMin) / 6) / 10 // hours used, 1 decimal
          : d.estWeeklyHours;

        return {
          ...d,
          hosStatus: statusMap[currentStatus] || currentStatus,
          hosDriveRemaining: driveRemainingMin,
          hosDutyRemaining: dutyRemainingMin,
          hosCycleRemaining: cycleRemainingMin,
          cycleRemaining: cycleRemainingMin !== null ? Math.round(cycleRemainingMin / 6) / 10 : d.cycleRemaining, // minutes → hours
          estWeeklyHours: realWeeklyHours, // Override CSV estimate with real data
          hosSource: "samsara",
        };
      });
    }

    // Format "MM/DD/YYYY HH:MM" → "Mon D h:mma" (compact) or keep date if different day
    function formatBlockTime(dtStr) {
      if (!dtStr) return "";
      const parts = dtStr.split(" ");
      if (parts.length < 2) return dtStr;
      const [month, day] = parts[0].split("/");
      const [hr, min] = parts[1].split(":");
      const h = parseInt(hr, 10);
      const ampm = h >= 12 ? "p" : "a";
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      const months = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${months[parseInt(month, 10)]} ${parseInt(day, 10)} ${h12}:${min}${ampm}`;
    }

    const BlockNode = ({ label, driverLabel, driverName, highlight, cancelled, onCancel, onAssign, assigning, availableBackups, backupAssigned, backupName, onRemoveBackup, dropped, onDrop, onUndrop, compact, tooltip, stageColor, blockStart, blockEnd }) => (

    function JoyrideLogisticsDiagram() {
      const containerRef = useRef(null);

      const truckRefs = useRef({});
      const blockGroupRefs = useRef({});

      const [mode, setMode] = useState("current");

      const [cascadeCancelled, setCascadeCancelled] = useState({});

      const [hoveredDriver, setHoveredDriver] = useState(null);
      const [hoveredTruck, setHoveredTruck] = useState(null);
      const [selectedTruck, setSelectedTruck] = useState(null);
      const [driverSearch, setDriverSearch] = useState("");
      const [selectedDriver, setSelectedDriver] = useState(null);
      const [driverSort, setDriverSort] = useState("default");
      const [pendingBackup, setPendingBackup] = useState(null); // { truckId, blockNum, driverId, driverName } // "default", "available", "name", "miles"
      const [showLines, setShowLines] = useState(true);

      // CSV state
      const [csvRows, setCsvRows] = useState(null);
      const [csvRegion, setCsvRegion] = useState("ALL");
      const [csvRegions, setCsvRegions] = useState([]);
      const [csvStats, setCsvStats] = useState(null);

      // Samsara ELD state
      const [samsaraConnected, setSamsaraConnected] = useState(false);
      const [samsaraDrivers, setSamsaraDrivers] = useState(null);
      const [samsaraHOS, setSamsaraHOS] = useState(null);
      const [samsaraLoading, setSamsaraLoading] = useState(false);
      const [samsaraError, setSamsaraError] = useState(null);
      const [driverMatchMap, setDriverMatchMap] = useState({});
      const [samsaraMatchInfo, setSamsaraMatchInfo] = useState(null);

      // Save/restore state per mode so switching tabs preserves work
      const savedStates = useRef({});

      const handleCSVUpload = (text) => {
        const rows = parseCSV(text);
        setCsvRows(rows);
        const initial = transformCSVData(rows, "ALL");
        setCsvRegions(initial.regions);
        setCsvRegion("ALL");
        setCsvStats({ drivers: initial.drivers.length, loads: initial.trucks.length, trips: initial.totalTrips });
        // Reset diagram state for fresh CSV view
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        savedStates.current = {};
      };

      const handleCSVClear = () => {
        setCsvRows(null);
        setCsvRegion("ALL");
        setCsvRegions([]);
        setCsvStats(null);
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        savedStates.current = {};
      };

      // ─── Samsara ELD Functions ─────────────────────────────
      const fetchSamsaraData = async () => {
        try {
          const [driversRes, hosRes] = await Promise.all([
            fetch("/api/samsara/drivers").then(r => r.json()),
            fetch("/api/samsara/hos/clocks").then(r => r.json()),
          ]);
          setSamsaraDrivers(driversRes);
          setSamsaraHOS(hosRes);
          return { drivers: driversRes, hos: hosRes };
        } catch (e) {
          console.error("Samsara fetch error:", e);
          return null;
        }
      };

      const handleSamsaraConnect = async (token) => {
        setSamsaraLoading(true);
        setSamsaraError(null);
        try {
          const res = await fetch("/api/samsara/connect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
          });
          const data = await res.json();
          if (data.connected) {
            setSamsaraConnected(true);
            const fetched = await fetchSamsaraData();
            // Do initial driver matching if CSV is loaded
            if (fetched?.drivers?.data && csvRows) {
              const csvData = transformCSVData(csvRows, csvRegion);
              const matchResult = matchDriverNames(csvData.drivers, fetched.drivers.data);
              setDriverMatchMap(matchResult.matchMap);
              setSamsaraMatchInfo({ matched: matchResult.matched, total: matchResult.total, unmatched: matchResult.unmatched.length });
            }
          } else {
            setSamsaraError(data.error || "Connection failed");
          }
        } catch (e) {
          setSamsaraError(e.message);
        } finally {
          setSamsaraLoading(false);
        }
      };

      const handleSamsaraDisconnect = async () => {
        try { await fetch("/api/samsara/disconnect", { method: "DELETE" }); } catch {}
        setSamsaraConnected(false);
        setSamsaraDrivers(null);
        setSamsaraHOS(null);
        setDriverMatchMap({});
        setSamsaraMatchInfo(null);
      };

      // Check Samsara connection status on load
      useEffect(() => {
        fetch("/api/samsara/status").then(r => r.json()).then(data => {
          if (data.connected) {
            setSamsaraConnected(true);
            fetchSamsaraData();
          }
        }).catch(() => {});
      }, []);

      // Poll HOS data every 60 seconds when connected
      useEffect(() => {
        if (!samsaraConnected) return;
        const interval = setInterval(fetchSamsaraData, 60000);
        return () => clearInterval(interval);
      }, [samsaraConnected]);

      // Re-match drivers when CSV data or Samsara drivers change
      useEffect(() => {
        if (samsaraConnected && samsaraDrivers?.data && csvRows) {
          const csvData = transformCSVData(csvRows, csvRegion);
          const matchResult = matchDriverNames(csvData.drivers, samsaraDrivers.data);
          setDriverMatchMap(matchResult.matchMap);
          setSamsaraMatchInfo({ matched: matchResult.matched, total: matchResult.total, unmatched: matchResult.unmatched.length });
        }
      }, [csvRows, csvRegion, samsaraDrivers, samsaraConnected]);

      const handleRegionChange = (r) => {
        setCsvRegion(r);
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        setSelectedDriver(null);
      };

      // Build data from CSV or fallback to demo MODELS
      const data = csvRows ? transformCSVData(csvRows, csvRegion) : buildData(MODELS[mode]);
      // Enrich with Samsara HOS data if connected
      if (samsaraConnected && samsaraHOS && csvRows) {
        data.drivers = enrichWithHOS(data.drivers, samsaraHOS, driverMatchMap);
      }
      const { drivers: DRIVERS, trucks: TRUCKS, blocksPerLoad, hasPrimarySecondary } = data;
      const BLOCK_NUMS = Array.from({ length: blocksPerLoad }, (_, i) => i + 1);

      const handleToggle = (newMode) => {
        if (newMode === mode) return;
        // Save current mode's state
        savedStates.current[mode] = {
          cancelledBlocks, droppedBlocks, blockBackups, cascadeCancelled,
        };
        // Clear refs for new layout
        driverRefs.current = {};
        truckRefs.current = {};
        blockGroupRefs.current = {};
        // Restore saved state for new mode, or start fresh
        const saved = savedStates.current[newMode];
        if (saved) {
          setCancelledBlocks(saved.cancelledBlocks);
          setDroppedBlocks(saved.droppedBlocks);
          setBlockBackups(saved.blockBackups);
          setCascadeCancelled(saved.cascadeCancelled);
        } else {
          setCancelledBlocks({});
          setDroppedBlocks({});
          setBlockBackups({});
          setCascadeCancelled({});
        }
        setAssigningBlock(null);
        setSelectedTruck(null);
        setHoveredDriver(null);
        setHoveredTruck(null);
        setMode(newMode);
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      const blockKey = (truckId, blockNum) => `${truckId}-${blockNum}`;

      // Resolve driver ID to name
      const getDriverName = (driverId) => {
        if (!driverId) return "—";
        const d = DRIVERS.find(d => d.id === driverId);
        return d ? d.label : `D${driverId}`;
      };

      const getOriginalDriver = (truckId, blockNum) => {
        const truck = TRUCKS.find((t) => t.id === truckId);
        // In CSV mode, use actual block-driver mapping from CSV data
        if (csvRows && truck.blockDrivers && truck.blockDrivers[blockNum - 1] !== undefined) {
          return truck.blockDrivers[blockNum - 1];
        }
        if (!hasPrimarySecondary) return truck.primaryDriver;
        return blockNum % 2 === 1 ? truck.primaryDriver : truck.secondaryDriver;
      };

      const isDriverBackup = (driverId) => Object.values(blockBackups).includes(driverId);

      const getDriverBackupBlocks = (driverId) => {
        const blocks = [];
        for (const [key, bid] of Object.entries(blockBackups)) {
          if (bid === driverId) {
            const [tid, bnum] = key.split("-").map(Number);
            blocks.push({ truckId: tid, blockNum: bnum });
          }
        }
        return blocks;
      };

      const MAX_BLOCKS_PER_WEEK = 3;

      // Helper to parse block date string → ms timestamp
      const parseBlockDateMs = (s) => {
        if (!s) return null;
        const [datePart, timePart] = s.split(" ");
        if (!datePart) return null;
        const [m, d, y] = datePart.split("/");
        const ts = new Date(`${y}-${m}-${d}T${timePart || "00:00"}`).getTime();
        return isNaN(ts) ? null : ts;
      };

      // Check if two time ranges overlap
      const blocksOverlap = (startA, endA, startB, endB) => {
        if (!startA || !endA || !startB || !endB) return false;
        return startA < endB && startB < endA;
      };

      const getAvailableForBlock = (truckId, blockNum) => {
        const usedAsBackup = new Set(Object.values(blockBackups));
        const truck = TRUCKS.find((t) => t.id === truckId);
        const loadFacilities = truck?.facilities || [];

        // Get the proposed backup block's time window
        const blockIdx = blockNum - 1;
        const proposedBlockId = truck?.blockIds?.[blockIdx];
        const proposedTrips = proposedBlockId && truck.blockTrips?.[proposedBlockId];
        let proposedStart = null, proposedEnd = null;
        if (proposedTrips) {
          proposedTrips.forEach(t => {
            const s = parseBlockDateMs(t.stop1ArrDate && t.stop1ArrTime ? `${t.stop1ArrDate} ${t.stop1ArrTime}` : null);
            const e = parseBlockDateMs(t.stop2ArrDate && t.stop2ArrTime ? `${t.stop2ArrDate} ${t.stop2ArrTime}` : null);
            if (s !== null && (proposedStart === null || s < proposedStart)) proposedStart = s;
            if (e !== null && (proposedEnd === null || e > proposedEnd)) proposedEnd = e;
          });
        }
        // Estimate proposed block duration in hours
        const proposedDurationHrs = (proposedStart && proposedEnd) ? (proposedEnd - proposedStart) / 3600000 : 10; // default 10h if unknown

        // Determine the domicile of the block's seat
        const blockDomicile = truck?.operatorId ? truck.operatorId.split("_")[1] : null;

        const available = DRIVERS.filter((d) => {
          if (usedAsBackup.has(d.id)) return false;
          if (d.id === truck.primaryDriver || d.id === truck.secondaryDriver) return false;
          // In CSV mode, filter out drivers already at max blocks
          if (csvRows && d.blockCount >= MAX_BLOCKS_PER_WEEK) return false;

          // RULE: Only recommend drivers from the same domicile
          if (csvRows && blockDomicile && d.domicile && d.domicile !== blockDomicile) return false;

          // RULE 1: Exclude drivers with < 34h cycle remaining
          if (csvRows && d.cycleRemaining < MIN_CYCLE_FOR_BACKUP) return false;

          // RULE 2: Exclude drivers already executing a block during the proposed backup window
          if (csvRows && proposedStart && proposedEnd && d.blocks) {
            for (const blk of d.blocks) {
              const blkStart = parseBlockDateMs(blk.blockStart);
              const blkEnd = parseBlockDateMs(blk.blockEnd);
              if (blocksOverlap(proposedStart, proposedEnd, blkStart, blkEnd)) {
                return false; // driver is busy during this time
              }
            }
          }

          // Filter out drivers with < 4 hours duty remaining (ELD)
          if (samsaraConnected && d.hosDutyRemaining !== undefined && d.hosDutyRemaining < 240) return false;
          for (const bk of Object.keys(cancelledBlocks)) {
            if (!cancelledBlocks[bk]) continue;
            if (cascadeCancelled[bk]) continue;
            const [tid, bn] = bk.split("-").map(Number);
            if (getOriginalDriver(tid, bn) === d.id && !blockBackups[bk]) return false;
          }
          return true;
        }).map((d) => {
          const homeTruck = TRUCKS.find((t) => t.primaryDriver === d.id || t.secondaryDriver === d.id);
          // Proximity score: count shared facilities between driver and the load
          const driverFacs = d.facilities || [];
          const sharedFacilities = driverFacs.filter(f => loadFacilities.includes(f));
          const proximityScore = sharedFacilities.length;
          // Block capacity: fewer blocks = more available (out of 3 max)
          const blocksUsed = d.blockCount || 0;
          const blocksRemaining = MAX_BLOCKS_PER_WEEK - blocksUsed;
          const homeTruckLabel = homeTruck?.operatorId ? homeTruck.operatorId.split("_").slice(-1)[0] : (homeTruck ? `L${homeTruck.id}` : "");
          return { ...d, homeTruck: homeTruck?.id, homeTruckLabel, proximityScore, sharedFacilities, hoursScore: d.estWeeklyHours || 0, blocksUsed, blocksRemaining };
        });

        // Sort: proximity first, then HOS duty remaining (if Samsara), then blocks used
        available.sort((a, b) => {
          if (b.proximityScore !== a.proximityScore) return b.proximityScore - a.proximityScore;
          // When Samsara connected, prefer drivers with more duty hours remaining
          if (samsaraConnected) {
            const aHOS = a.hosDutyRemaining ?? Infinity;
            const bHOS = b.hosDutyRemaining ?? Infinity;
            if (bHOS !== aHOS) return bHOS - aHOS;
          }
          return a.blocksUsed - b.blocksUsed;
        });

        return available;
      };

      const toggleBlockCancel = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setCancelledBlocks((prev) => {
          const next = { ...prev };
          if (next[key]) {
            delete next[key];
            setBlockBackups((bb) => { const n = { ...bb }; delete n[key]; return n; });
            setCascadeCancelled((cc) => { const n = { ...cc }; delete n[key]; return n; });
          } else {
            next[key] = true;
          }
          return next;
        });
        setAssigningBlock(null);
      };

      // Stage 1: User selects a backup driver → show confirmation
      const requestBackupAssignment = (truckId, blockNum, driverId) => {
        const driverName = getDriverName(driverId);
        setPendingBackup({ truckId, blockNum, driverId, driverName });
      };

      // Stage 2: User confirms → actually assign the backup
      const confirmBackupAssignment = () => {
        if (!pendingBackup) return;
        const { truckId, blockNum, driverId } = pendingBackup;
        const key = blockKey(truckId, blockNum);
        setBlockBackups((prev) => ({ ...prev, [key]: driverId }));
        setAssigningBlock(null);
        setPendingBackup(null);

        // Cascade: In CSV mode, find the backup driver's overlapping block and cancel it
        if (csvRows) {
          const driver = DRIVERS.find(d => d.id === driverId);
          if (driver?.blocks) {
            const truck = TRUCKS.find(t => t.id === truckId);
            const proposedBlockId = truck?.blockIds?.[blockNum - 1];
            const proposedTrips = proposedBlockId && truck.blockTrips?.[proposedBlockId];
            let pStart = null, pEnd = null;
            if (proposedTrips) {
              proposedTrips.forEach(t => {
                const s = parseBlockDateMs(t.stop1ArrDate && t.stop1ArrTime ? `${t.stop1ArrDate} ${t.stop1ArrTime}` : null);
                const e = parseBlockDateMs(t.stop2ArrDate && t.stop2ArrTime ? `${t.stop2ArrDate} ${t.stop2ArrTime}` : null);
                if (s !== null && (pStart === null || s < pStart)) pStart = s;
                if (e !== null && (pEnd === null || e > pEnd)) pEnd = e;
              });
            }
            // Cancel the backup driver's block that overlaps
            for (const blk of driver.blocks) {
              const blkStart = parseBlockDateMs(blk.blockStart);
              const blkEnd = parseBlockDateMs(blk.blockEnd);
              if (blocksOverlap(pStart, pEnd, blkStart, blkEnd)) {
                const homeTruck = TRUCKS.find(t => t.id === blk.truckId);
                if (homeTruck) {
                  const bIdx = homeTruck.blockIds?.indexOf(blk.blockId);
                  if (bIdx >= 0) {
                    const bk = blockKey(homeTruck.id, bIdx + 1);
                    if (!cancelledBlocks[bk]) {
                      setCancelledBlocks((prev) => ({ ...prev, [bk]: true }));
                      setCascadeCancelled((prev) => ({ ...prev, [bk]: true }));
                    }
                  }
                }
              }
            }
          }
        } else {
          // Demo mode: cascade by block number position
          const homeTruck = TRUCKS.find((t) => t.primaryDriver === driverId || t.secondaryDriver === driverId);
          if (homeTruck && getOriginalDriver(homeTruck.id, blockNum) === driverId) {
            const bk = blockKey(homeTruck.id, blockNum);
            if (!cancelledBlocks[bk]) {
              setCancelledBlocks((prev) => ({ ...prev, [bk]: true }));
              setCascadeCancelled((prev) => ({ ...prev, [bk]: true }));
            }
          }
        }
      };

      const cancelPendingBackup = () => {
        setPendingBackup(null);
      };

      const removeBlockBackup = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setBlockBackups((prev) => { const n = { ...prev }; delete n[key]; return n; });
      };

      const dropBlock = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setDroppedBlocks((prev) => ({ ...prev, [key]: true }));
        setAssigningBlock(null);
      };

      const undropBlock = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setDroppedBlocks((prev) => { const n = { ...prev }; delete n[key]; return n; });
      };

      const resetAll = () => {
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        delete savedStates.current[mode];
      };

      const measurePositions = useCallback(() => {
        if (!containerRef.current) return;
        const cr = containerRef.current.getBoundingClientRect();
        const ox = cr.left, oy = cr.top;
        const dp = {}, tp = {}, bp = {};
        for (const [id, el] of Object.entries(driverRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); dp[id] = { x: r.right - ox, y: r.top + r.height / 2 - oy }; }
        }
        for (const [id, el] of Object.entries(truckRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); tp[id] = { left: { x: r.left - ox, y: r.top + r.height / 2 - oy }, right: { x: r.right - ox, y: r.top + r.height / 2 - oy } }; }
        }
        for (const [id, el] of Object.entries(blockGroupRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); bp[id] = { x: r.left - ox, y: r.top + r.height / 2 - oy }; }
        }
        setPositions({ drivers: dp, trucks: tp, blocks: bp });
      }, [mode, csvRegion]);

      useEffect(() => {
        const t = setTimeout(measurePositions, 150);
        window.addEventListener("resize", measurePositions);
        return () => { clearTimeout(t); window.removeEventListener("resize", measurePositions); };
      }, [measurePositions]);

      useLayoutEffect(() => {
        measurePositions();
      }, [mode, csvRegion, measurePositions]);

      useEffect(() => {
        const t = setTimeout(measurePositions, 60);
        return () => clearTimeout(t);
      }, [cancelledBlocks, blockBackups, assigningBlock, measurePositions]);

      // Keyboard shortcuts
      useEffect(() => {
        const handleKey = (e) => {
          if (e.key === "Escape") {
            if (pendingBackup) { setPendingBackup(null); return; }
            setSelectedDriver(null);
            setSelectedTruck(null);
            setAssigningBlock(null);
            setPendingBackup(null);
            setHoveredDriver(null);
            setHoveredTruck(null);
          }
          // Arrow keys to cycle through drivers when one is selected
          if (selectedDriver && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            const filteredDrivers = DRIVERS.filter(d => !driverSearch || d.label.toLowerCase().includes(driverSearch.toLowerCase()));
            const currentIdx = filteredDrivers.findIndex(d => d.id === selectedDriver);
            if (currentIdx === -1) return;
            const nextIdx = e.key === "ArrowDown"
              ? Math.min(currentIdx + 1, filteredDrivers.length - 1)
              : Math.max(currentIdx - 1, 0);
            const nextDriver = filteredDrivers[nextIdx];
            setSelectedDriver(nextDriver.id);
            setSelectedTruck(null);
            // Scroll to the driver's load
            const load = TRUCKS.find(t => t.primaryDriver === nextDriver.id || t.secondaryDriver === nextDriver.id);
            if (load) {
              const loadEl = blockGroupRefs.current[load.id];
              if (loadEl) loadEl.scrollIntoView({ behavior: "smooth", block: "center" });
            }
            // Scroll driver card into view
            const driverEl = driverRefs.current[nextDriver.id];
            if (driverEl) driverEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
        };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [selectedDriver, driverSearch]);

      // Auto-hide lines in CSV mode when sorted or many drivers
      const effectiveShowLines = csvRows
        ? (driverSort === "default" && showLines && DRIVERS.length <= 40) || hoveredDriver || hoveredTruck || selectedDriver
        : true;

      const getLineColor = (driverId, truckId) => {
        if (Object.entries(blockBackups).some(([k, v]) => v === driverId && k.startsWith(`${truckId}-`))) return B.bkp;
        const truck = TRUCKS.find((t) => t.id === truckId);
        if (hoveredDriver === driverId || hoveredTruck === truckId) return B.red;
        if (truck?.primaryDriver === driverId) return B.green;
        return B.gold;
      };

      const getLineOpacity = (driverId) => {
        if (hoveredDriver && hoveredDriver !== driverId) return 0.05;
        if (hoveredTruck && !TRUCKS.find((t) => t.id === hoveredTruck && (t.primaryDriver === driverId || t.secondaryDriver === driverId))) return 0.05;
        return 0.45;
      };

      const getLineWidth = (driverId) => (hoveredDriver === driverId ? 2.5 : 1.2);

      const connections = [];
      for (const truck of TRUCKS) {
        connections.push({ driverId: truck.primaryDriver, truckId: truck.id, type: "primary" });
        if (hasPrimarySecondary && truck.secondaryDriver) {
          connections.push({ driverId: truck.secondaryDriver, truckId: truck.id, type: "secondary" });
        }
      }
      const backupConnectionsAdded = new Set();
      for (const [key, driverId] of Object.entries(blockBackups)) {
        const [tid] = key.split("-").map(Number);
        const connKey = `${driverId}-${tid}`;
        if (!backupConnectionsAdded.has(connKey)) {
          connections.push({ driverId, truckId: tid, type: "backup" });
          backupConnectionsAdded.add(connKey);
        }
      }

      // Determine which loads a selected driver belongs to
      const driverLoadMap = {};
      if (selectedDriver) {
        TRUCKS.forEach((truck) => {
          if (truck.primaryDriver === selectedDriver || truck.secondaryDriver === selectedDriver) {
            driverLoadMap[truck.id] = true;
          }
          // Also check backup assignments
          for (const [key, bid] of Object.entries(blockBackups)) {
            if (bid === selectedDriver) {
              const [tid] = key.split("-").map(Number);
              driverLoadMap[tid] = true;
            }
          }
        });
      }

      // Get selected driver's info
      const selectedDriverInfo = selectedDriver ? DRIVERS.find(d => d.id === selectedDriver) : null;

      const cancelCount = Object.keys(cancelledBlocks).length;
      const backupCount = Object.keys(blockBackups).length;
      const droppedCount = Object.keys(droppedBlocks).length;

      const HEADER_H = 36;
      const SLOT_H = hasPrimarySecondary ? 116 : 90;
      const DRIVER_H = hasPrimarySecondary ? SLOT_H / 2 : SLOT_H;
      const ROW = { boxSizing: "border-box" };

      return (
        <div style={{ fontFamily: "'Montserrat', 'Inter', system-ui, sans-serif", background: B.bg, minHeight: "100vh", color: B.text }}>

          <div style={{
            background: B.header, padding: "14px 28px",
            display: "flex", alignItems: "center", justifyContent: "space-between",
            borderBottom: `2px solid ${B.red}`,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <JoyrideLogo height={36} />
              <div style={{ width: 1, height: 24, background: "rgba(255,255,255,0.12)" }} />
              <span style={{ fontSize: 13, fontWeight: 600, color: B.muted, letterSpacing: 0.5 }}>Fleet Operations</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
              {!csvRows && <ModelToggle mode={mode} onToggle={handleToggle} />}
              {csvRows && csvRegions.length > 0 && (
                <RegionTabs regions={csvRegions} active={csvRegion} onSelect={handleRegionChange} />
              )}
              <CSVUpload onUpload={handleCSVUpload} onClear={handleCSVClear} hasData={!!csvRows} />
              <SamsaraConnect
                connected={samsaraConnected}
                onConnect={handleSamsaraConnect}
                onDisconnect={handleSamsaraDisconnect}
                loading={samsaraLoading}
                error={samsaraError}
                matchInfo={samsaraMatchInfo}
              />
              {csvStats && (() => {
                const avail = DRIVERS.filter(d => d.blockCount < MAX_BLOCKS_PER_WEEK).length;
                const maxed = DRIVERS.filter(d => d.blockCount >= MAX_BLOCKS_PER_WEEK).length;
                const totalDrivers = avail + maxed;
                const pct = totalDrivers > 0 ? Math.round((maxed / totalDrivers) * 100) : 0;
                // Block-level stats
                const totalBlocks = TRUCKS.reduce((s, t) => s + (t.blockIds?.length || 0), 0);
                const atRisk = TRUCKS.reduce((s, t) => {
                  // Count blocks assigned to maxed-out drivers
                  return s + (t.blockIds || []).filter((_, bi) => {
                    const origD = getOriginalDriver(t.id, bi + 1);
                    const dInfo = DRIVERS.find(d => d.id === origD);
                    return dInfo && dInfo.blockCount >= MAX_BLOCKS_PER_WEEK;
                  }).length;
                }, 0);
                return (
                  <div style={{ display: "flex", gap: 8, fontSize: 10, fontWeight: 600, alignItems: "center" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <div style={{ width: 60, height: 6, borderRadius: 3, background: "rgba(255,255,255,0.08)", overflow: "hidden" }}>
                        <div style={{ height: "100%", borderRadius: 3, width: `${pct}%`, background: pct > 80 ? B.cancelRed : pct > 50 ? B.gold : B.green, transition: "width 0.3s" }} />
                      </div>
                      <span style={{ color: B.greenL }}>{avail}</span>
                      <span style={{ color: B.dim }}>/</span>
                      <span style={{ color: B.cancelRed }}>{maxed} full</span>
                    </div>
                    <span style={{ color: B.dim }}>·</span>
                    <span style={{ color: B.muted }}>{TRUCKS.length} seats</span>
                    {cancelCount > 0 && (
                      <>
                        <span style={{ color: B.dim }}>·</span>
                        <span style={{ color: B.cancelRed }}>{cancelCount} cancelled</span>
                        {backupCount > 0 && <span style={{ color: B.bkpL }}>{backupCount} covered</span>}
                      </>
                    )}
                  </div>
                );
              })()}
              {cancelCount > 0 && !csvRows && (
                <div style={{ fontSize: 12, color: "#ef9a9a", fontWeight: 500 }}>
                  {cancelCount} block{cancelCount > 1 ? "s" : ""} called off
                  {backupCount > 0 && ` · ${backupCount} backup${backupCount > 1 ? "s" : ""}`}
                  {droppedCount > 0 && ` · ${droppedCount} dropped`}
                </div>
              )}
              {(cancelCount > 0 || backupCount > 0 || droppedCount > 0) && (
                <button onClick={resetAll} style={{
                  backgroundImage: B.grad, backgroundSize: "200% auto",
                  color: "#fff", border: "none", borderRadius: 4, padding: "7px 18px",
                  fontSize: 11, fontWeight: 700, cursor: "pointer",
                  fontFamily: "'Montserrat', sans-serif", textTransform: "uppercase",
                  letterSpacing: 1, transition: "background-position 0.4s",
                }}
                  onMouseEnter={(e) => (e.currentTarget.style.backgroundPosition = "right center")}
                  onMouseLeave={(e) => (e.currentTarget.style.backgroundPosition = "left center")}
                >Reset All</button>
              )}
            </div>
          </div>

          <div style={{
            display: "flex", gap: 14, padding: "6px 28px",
            background: B.card, borderBottom: `1px solid ${B.bdr}`,
            fontSize: 11, flexWrap: "wrap", alignItems: "center",
          }}>
            {[
              { color: B.green, label: hasPrimarySecondary ? "Primary" : "Assigned", type: "line" },
              ...(hasPrimarySecondary ? [{ color: B.gold, label: "Secondary", type: "line" }] : []),
              { color: B.bkp, label: "Backup", type: "line" },
              { color: B.cancelRed, label: "Cancelled", type: "dot" },

              <span key={item.label} style={{ display: "flex", alignItems: "center", gap: 4, color: B.muted, fontSize: 10 }}>

                {item.label}

            {csvRows && (
              <span style={{ display: "flex", gap: 6, alignItems: "center", marginLeft: 6, borderLeft: `1px solid ${B.bdr}`, paddingLeft: 8 }}>
                <span style={{ fontSize: 8, color: B.dim, fontWeight: 600 }}>STAGE:</span>
                {[
                  { color: "#64b5f6", label: "Upcoming" },
                  { color: B.gold, label: "Tendered" },

                  <span key={s.label} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 9, color: B.muted }}>
                    <span style={{ width: 10, height: 3, background: s.color, borderRadius: 1 }} />
                    {s.label}
                  </span>
                ))}
              </span>

            {samsaraConnected && (
              <span style={{ display: "flex", gap: 5, alignItems: "center", marginLeft: 4, borderLeft: `1px solid ${B.bdr}`, paddingLeft: 8 }}>
                <span style={{ fontSize: 8, color: B.dim, fontWeight: 600 }}>HOS:</span>
                {[
                  { color: B.green, label: "Driving" },
                  { color: B.gold, label: "On Duty" },
                  { color: "#64b5f6", label: "Sleeper" },
                ].map(s => (
                  <span key={s.label} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 9, color: B.muted }}>
                    <span style={{ width: 6, height: 6, borderRadius: "50%", background: s.color }} />
                    {s.label}
                  </span>
                ))}
              </span>
            )}
            {csvRows && (
              <button onClick={() => setShowLines(!showLines)} style={{
                padding: "2px 8px", borderRadius: 3, fontSize: 8, fontWeight: 600,
                cursor: "pointer", fontFamily: "'Montserrat', sans-serif", border: "none",
                background: showLines ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.03)",
                color: showLines ? B.muted : B.dim, transition: "all 0.15s",
              }}>Lines {showLines ? "ON" : "OFF"}</button>
            )}
            <span style={{ color: B.dim, marginLeft: "auto", fontSize: 9 }}>
              Click block to cancel · Click driver to filter · ↑↓ navigate · Esc deselect · Max {MAX_BLOCKS_PER_WEEK} blks/wk
            </span>
          </div>

          {/* ═══ CSV MODE: Driver-centric row layout ═══ */}
          {csvRows && (
            <div key={`csv-${csvRegion}`} ref={containerRef} style={{ padding: "16px 20px", background: B.bg }}>
              {/* Search & Sort Header */}
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: B.red }}>{DRIVERS.length}</span>
                <input
                  placeholder="Search drivers..." value={driverSearch} onChange={(e) => setDriverSearch(e.target.value)}
                  style={{ padding: "5px 10px", borderRadius: 6, background: B.surface, border: `1px solid ${B.bdrL}`, color: B.text, fontSize: 11, fontFamily: "'Montserrat', sans-serif", outline: "none", width: 180 }}
                />
                {["default", "available", "name", "miles"].map(s => (
                  <button key={s} onClick={() => setDriverSort(s)} style={{
                    padding: "3px 8px", borderRadius: 4, fontSize: 9, fontWeight: 600, cursor: "pointer",
                    fontFamily: "'Montserrat', sans-serif", border: "none",
                    background: driverSort === s ? "rgba(193,59,64,0.2)" : "rgba(255,255,255,0.04)",
                    color: driverSort === s ? B.redLight : B.dim,
                  }}>{s === "default" ? "Default" : s === "available" ? "Avail ↑" : s === "name" ? "A-Z" : "Miles ↓"}</button>
                ))}
                <span style={{ marginLeft: "auto", fontSize: 10, color: B.muted }}>
                  {data.domicileOrder?.length || 0} domiciles · {TRUCKS.length} seats · Max {MAX_BLOCKS_PER_WEEK} blks/wk
                </span>
              </div>

              {/* Column headers */}
              <div style={{ display: "flex", alignItems: "center", gap: 0, padding: "6px 0", borderBottom: `1px solid ${B.bdr}`, marginBottom: 4 }}>
                <div style={{ width: 36, fontSize: 8, color: B.dim, fontWeight: 700, textAlign: "center" }}>#</div>
                <div style={{ width: 200, fontSize: 8, color: B.dim, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 }}>Driver</div>
                <div style={{ width: 70, fontSize: 8, color: B.dim, fontWeight: 700, textAlign: "center", textTransform: "uppercase", letterSpacing: 0.5 }}>Status</div>
                {[1, 2, 3].map(n => (
                  <div key={n} style={{ width: 120, fontSize: 8, color: B.dim, fontWeight: 700, textAlign: "center", textTransform: "uppercase", letterSpacing: 0.5 }}>Block {n}</div>
                ))}
              </div>

              {/* Driver rows grouped by domicile */}
              {(data.domicileOrder || [])
                .filter(dom => csvRegion === "ALL" || dom === csvRegion)
                .map(dom => {
                const domDrivers = DRIVERS
                  .filter(d => d.domicile === dom)
                  .filter(d => !driverSearch || d.label.toLowerCase().includes(driverSearch.toLowerCase()))
                  .sort((a, b) => {
                    if (driverSort === "available") return (a.blockCount || 0) - (b.blockCount || 0);
                    if (driverSort === "name") return a.label.localeCompare(b.label);
                    if (driverSort === "miles") return (b.totalMiles || 0) - (a.totalMiles || 0);
                    return a.driverNumber - b.driverNumber;
                  });
                if (domDrivers.length === 0) return null;
                return (
                  <div key={dom}>
                    {/* Domicile section header */}
                    <div style={{
                      display: "flex", alignItems: "center", gap: 8, padding: "10px 0 6px",
                      borderBottom: `1px solid rgba(193,59,64,0.15)`, marginBottom: 2, marginTop: 8,
