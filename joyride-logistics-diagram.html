              const csvData = transformCSVData(csvRows, csvRegion, savedProfiles);
              const matchResult = matchDriverNames(csvData.drivers, fetched.drivers.data);
              setDriverMatchMap(matchResult.matchMap);
              setSamsaraMatchInfo({ matched: matchResult.matched, total: matchResult.total, unmatched: matchResult.unmatched.length });
            }
          } else {
            setSamsaraError(data.error || "Connection failed");
          }
        } catch (e) {
          setSamsaraError(e.message);
        } finally {
          setSamsaraLoading(false);
        }
      };

      const handleSamsaraDisconnect = async () => {
        try { await fetch("/api/samsara/disconnect", { method: "DELETE" }); } catch (e) { console.warn("Samsara disconnect failed:", e); }
        setSamsaraConnected(false);
        setSamsaraDrivers(null);
        setSamsaraHOS(null);
        setDriverMatchMap({});
        setSamsaraMatchInfo(null);
      };

      // Driver profile bank
      const [savedProfiles, setSavedProfiles] = useState(null);
      const [profilesSaved, setProfilesSaved] = useState(false);

      const loadDriverProfiles = () => {
        fetch("/api/profiles").then(r => r.json()).then(data => {
          if (data && typeof data === "object") setSavedProfiles(data);
        }).catch(e => console.warn("API request failed:", e));
      };

      const saveDriverProfiles = () => {
        if (!csvRows || DRIVERS.length === 0) return;
        const profiles = {};
        DRIVERS.forEach(d => {
          const startTimes = (d.blocks || [])
            .filter(b => b.blockStart)
            .map(b => {
              const parts = b.blockStart.split(" ");
              if (parts.length < 2) return null;
              const [hr, min] = parts[1].split(":").map(Number);
              if (isNaN(hr)) return null;
              return { hour: hr + (min || 0) / 60, date: parts[0] };
            })
            .filter(Boolean);
          profiles[d.label] = {
            startTimes,
            domicile: d.domicile,
            preferredStartLabel: d.preferredStartLabel,
            preferredShift: d.preferredShift,
            shiftConsistency: d.shiftConsistency,
          };
        });
        fetch("/api/profiles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ drivers: profiles }),
        }).then(r => r.json()).then(data => {
          if (data.saved) {
            setProfilesSaved(true);
            setTimeout(() => setProfilesSaved(false), 3000);
            loadDriverProfiles(); // refresh
          }
        }).catch(e => console.warn("API request failed:", e));
      };

      // Check Samsara + load profiles on startup
      useEffect(() => {
        fetch("/api/samsara/status").then(r => r.json()).then(data => {
          if (data.connected) {
            setSamsaraConnected(true);
            fetchSamsaraData();
          }
        }).catch(e => console.warn("API request failed:", e));
        loadDriverProfiles();
      }, []);

      // Poll HOS data every 60 seconds when connected
      useEffect(() => {
        if (!samsaraConnected) return;
        const interval = setInterval(fetchSamsaraData, 60000);
        return () => clearInterval(interval);
      }, [samsaraConnected]);

      // Re-match drivers when CSV data or Samsara drivers change
      useEffect(() => {
        if (samsaraConnected && samsaraDrivers?.data && csvRows) {
          const csvData = transformCSVData(csvRows, csvRegion, savedProfiles);
          const matchResult = matchDriverNames(csvData.drivers, samsaraDrivers.data);
          setDriverMatchMap(matchResult.matchMap);
          setSamsaraMatchInfo({ matched: matchResult.matched, total: matchResult.total, unmatched: matchResult.unmatched.length });
        }
      }, [csvRows, csvRegion, samsaraDrivers, samsaraConnected]);

      const handleRegionChange = (r) => {
        setCsvRegion(r);
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        setSelectedDriver(null);
      };

      // Build data from CSV or fallback to demo MODELS
      const data = csvRows ? transformCSVData(csvRows, csvRegion, savedProfiles) : buildData(MODELS[mode]);
      // Enrich with Samsara HOS data if connected
      if (samsaraConnected && samsaraHOS && csvRows) {
        data.drivers = enrichWithHOS(data.drivers, samsaraHOS, driverMatchMap, samsaraLocations, samsaraDrivers);
      }
      const { drivers: DRIVERS, trucks: TRUCKS, blocksPerLoad, hasPrimarySecondary } = data;
      const BLOCK_NUMS = Array.from({ length: blocksPerLoad }, (_, i) => i + 1);

      const handleToggle = (newMode) => {
        if (newMode === mode) return;
        // Save current mode's state
        savedStates.current[mode] = {
          cancelledBlocks, droppedBlocks, blockBackups, cascadeCancelled,
        };
        // Clear refs for new layout
        driverRefs.current = {};
        truckRefs.current = {};
        blockGroupRefs.current = {};
        // Restore saved state for new mode, or start fresh
        const saved = savedStates.current[newMode];
        if (saved) {
          setCancelledBlocks(saved.cancelledBlocks);
          setDroppedBlocks(saved.droppedBlocks);
          setBlockBackups(saved.blockBackups);
          setCascadeCancelled(saved.cascadeCancelled);
        } else {
          setCancelledBlocks({});
          setDroppedBlocks({});
          setBlockBackups({});
          setCascadeCancelled({});
        }
        setAssigningBlock(null);
        setSelectedTruck(null);
        setHoveredDriver(null);
        setHoveredTruck(null);
        setMode(newMode);
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      const blockKey = (truckId, blockNum) => `${truckId}-${blockNum}`;

      // Resolve driver ID to name
      const getDriverName = (driverId) => {
        if (!driverId) return "—";
        const d = DRIVERS.find(d => d.id === driverId);
        return d ? d.label : `D${driverId}`;
      };

      const getOriginalDriver = (truckId, blockNum) => {
        const truck = TRUCKS.find((t) => t.id === truckId);
        // In CSV mode, use actual block-driver mapping from CSV data
        if (csvRows && truck.blockDrivers && truck.blockDrivers[blockNum - 1] !== undefined) {
          return truck.blockDrivers[blockNum - 1];
        }
        if (!hasPrimarySecondary) return truck.primaryDriver;
        return blockNum % 2 === 1 ? truck.primaryDriver : truck.secondaryDriver;
      };

      const isDriverBackup = (driverId) => Object.values(blockBackups).includes(driverId);

      const getDriverBackupBlocks = (driverId) => {
        const blocks = [];
        for (const [key, bid] of Object.entries(blockBackups)) {
          if (bid === driverId) {
            const [tid, bnum] = key.split("-").map(Number);
            blocks.push({ truckId: tid, blockNum: bnum });
          }
        }
        return blocks;
      };

      // Wrapper that returns null instead of Infinity for invalid dates
      const parseBlockDateMs = (s) => {
        const ts = parseBlockDate(s);
        return ts === Infinity ? null : ts;
      };

      // Check if two time ranges overlap
      const blocksOverlap = (startA, endA, startB, endB) => {
        if (!startA || !endA || !startB || !endB) return false;
        return startA < endB && startB < endA;
      };

      const getAvailableForBlock = (truckId, blockNum) => {
        const usedAsBackup = new Set(Object.values(blockBackups));
        const truck = TRUCKS.find((t) => t.id === truckId);
        const loadFacilities = truck?.facilities || [];

        // Get the proposed backup block's time window
        const blockIdx = blockNum - 1;
        const proposedBlockId = truck?.blockIds?.[blockIdx];
        const proposedTrips = proposedBlockId && truck.blockTrips?.[proposedBlockId];
        let proposedStart = null, proposedEnd = null;
        if (proposedTrips) {
          proposedTrips.forEach(t => {
            const s = parseBlockDateMs(t.stop1ArrDate && t.stop1ArrTime ? `${t.stop1ArrDate} ${t.stop1ArrTime}` : null);
            const e = parseBlockDateMs(t.stop2ArrDate && t.stop2ArrTime ? `${t.stop2ArrDate} ${t.stop2ArrTime}` : null);
            if (s !== null && (proposedStart === null || s < proposedStart)) proposedStart = s;
            if (e !== null && (proposedEnd === null || e > proposedEnd)) proposedEnd = e;
          });
        }
        // Estimate proposed block duration in hours
        // Determine the domicile of the block's seat
        const blockDomicile = truck?.operatorId ? truck.operatorId.split("_")[1] : null;

        const available = DRIVERS.filter((d) => {
          if (usedAsBackup.has(d.id)) return false;
          if (d.id === truck.primaryDriver || d.id === truck.secondaryDriver) return false;
          // In CSV mode, filter out drivers already at max blocks
          if (csvRows && d.blockCount >= MAX_BLOCKS_PER_WEEK) return false;

          // RULE: Only recommend drivers from the same domicile
          if (csvRows && blockDomicile && d.domicile && d.domicile !== blockDomicile) return false;

          // RULE 1: Exclude drivers with < 34h cycle remaining
          if (csvRows && d.cycleRemaining < MIN_CYCLE_FOR_BACKUP) return false;

          // RULE 2: Exclude drivers already executing a block during the proposed backup window
          // Include 10-hour mandatory rest period after each block
          const REST_HOURS_MS = 10 * 3600000; // 10 hours in ms
          if (csvRows && proposedStart && proposedEnd && d.blocks) {
            for (const blk of d.blocks) {
              const blkStart = parseBlockDateMs(blk.blockStart);
              const blkEnd = parseBlockDateMs(blk.blockEnd);
              // Block + 10h rest window
              const blkEndWithRest = blkEnd ? blkEnd + REST_HOURS_MS : blkEnd;
              if (blocksOverlap(proposedStart, proposedEnd, blkStart, blkEndWithRest)) {
                return false; // driver is busy or in mandatory rest
              }
            }
          }

          // Filter out drivers with < 4 hours duty remaining (ELD)
          if (samsaraConnected && d.hosDutyRemaining !== undefined && d.hosDutyRemaining < 240) return false;
          for (const bk of Object.keys(cancelledBlocks)) {
            if (!cancelledBlocks[bk]) continue;
            if (cascadeCancelled[bk]) continue;
            const [tid, bn] = bk.split("-").map(Number);
            if (getOriginalDriver(tid, bn) === d.id && !blockBackups[bk]) return false;
          }
          return true;
        }).map((d) => {
          const homeTruck = TRUCKS.find((t) => t.primaryDriver === d.id || t.secondaryDriver === d.id);
          // Proximity score: count shared facilities between driver and the load
          const driverFacs = d.facilities || [];
          const sharedFacilities = driverFacs.filter(f => loadFacilities.includes(f));
          const proximityScore = sharedFacilities.length;
          // Block capacity: fewer blocks = more available (out of MAX_BLOCKS_PER_WEEK)
          const blocksUsed = d.blockCount || 0;
          const blocksRemaining = MAX_BLOCKS_PER_WEEK - blocksUsed;
          const homeTruckLabel = homeTruck?.operatorId ? homeTruck.operatorId.split("_").slice(-1)[0] : (homeTruck ? `L${homeTruck.id}` : "");
          // Start time preference match: how close is the proposed block start to the driver's preferred start?
          let startTimeScore = 0;
          if (proposedStart && d.preferredStartLabels?.length > 0 && d.blocks?.length > 0) {
            const proposedHour = new Date(proposedStart).getHours() + new Date(proposedStart).getMinutes() / 60;
            // Find closest preferred start time
            const prefHours = [];
            (d.blocks || []).forEach(blk => {
              if (!blk.blockStart) return;
              const parts = blk.blockStart.split(" ");
              if (parts.length >= 2) {
                const [h, m] = parts[1].split(":").map(Number);
                if (!isNaN(h)) prefHours.push(h + (m || 0) / 60);
              }
            });
            if (prefHours.length > 0) {
              const avgPref = prefHours.reduce((a, b) => a + b, 0) / prefHours.length;
              const diff = Math.abs(proposedHour - avgPref);
              // Score: 10 = exact match, 0 = 10+ hours apart
              startTimeScore = Math.max(0, Math.round((10 - Math.min(diff, 10)) * 10) / 10);
            }
          }
          return { ...d, homeTruck: homeTruck?.id, homeTruckLabel, proximityScore, sharedFacilities, hoursScore: d.estWeeklyHours || 0, blocksUsed, blocksRemaining, startTimeScore };
        });

        // Sort: start time match first, then proximity, then HOS/blocks
        available.sort((a, b) => {
          // Primary: start time preference match (highest first)
          if (b.startTimeScore !== a.startTimeScore) return b.startTimeScore - a.startTimeScore;
          // Then proximity
          if (b.proximityScore !== a.proximityScore) return b.proximityScore - a.proximityScore;
          // When Samsara connected, prefer drivers with more duty hours remaining
          if (samsaraConnected) {
            const aHOS = a.hosDutyRemaining ?? Infinity;
            const bHOS = b.hosDutyRemaining ?? Infinity;
            if (bHOS !== aHOS) return bHOS - aHOS;
          }
          return a.blocksUsed - b.blocksUsed;
        });

        return available;
      };

      const toggleBlockCancel = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setCancelledBlocks((prev) => {
          const next = { ...prev };
          if (next[key]) {
            delete next[key];
            setBlockBackups((bb) => { const n = { ...bb }; delete n[key]; return n; });
            setCascadeCancelled((cc) => { const n = { ...cc }; delete n[key]; return n; });
          } else {
            next[key] = true;
          }
          return next;
        });
        setAssigningBlock(null);
      };

      // Stage 1: User selects a backup driver → show confirmation
      const requestBackupAssignment = (truckId, blockNum, driverId) => {
        const driverName = getDriverName(driverId);
        setPendingBackup({ truckId, blockNum, driverId, driverName });
      };

      // Stage 2: User confirms → actually assign the backup
      const confirmBackupAssignment = () => {
        if (!pendingBackup) return;
        const { truckId, blockNum, driverId } = pendingBackup;
        const key = blockKey(truckId, blockNum);
        setBlockBackups((prev) => ({ ...prev, [key]: driverId }));
        setAssigningBlock(null);
        setPendingBackup(null);

        // Cascade: In CSV mode, find the backup driver's overlapping block and cancel it
        if (csvRows) {
          const driver = DRIVERS.find(d => d.id === driverId);
          if (driver?.blocks) {
            const truck = TRUCKS.find(t => t.id === truckId);
            const proposedBlockId = truck?.blockIds?.[blockNum - 1];
            const proposedTrips = proposedBlockId && truck.blockTrips?.[proposedBlockId];
            let pStart = null, pEnd = null;
            if (proposedTrips) {
              proposedTrips.forEach(t => {
                const s = parseBlockDateMs(t.stop1ArrDate && t.stop1ArrTime ? `${t.stop1ArrDate} ${t.stop1ArrTime}` : null);
                const e = parseBlockDateMs(t.stop2ArrDate && t.stop2ArrTime ? `${t.stop2ArrDate} ${t.stop2ArrTime}` : null);
                if (s !== null && (pStart === null || s < pStart)) pStart = s;
                if (e !== null && (pEnd === null || e > pEnd)) pEnd = e;
              });
            }
            // Cancel the backup driver's block that overlaps
            for (const blk of driver.blocks) {
              const blkStart = parseBlockDateMs(blk.blockStart);
              const blkEnd = parseBlockDateMs(blk.blockEnd);
              if (blocksOverlap(pStart, pEnd, blkStart, blkEnd)) {
                const homeTruck = TRUCKS.find(t => t.id === blk.truckId);
                if (homeTruck) {
                  const bIdx = homeTruck.blockIds?.indexOf(blk.blockId);
                  if (bIdx >= 0) {
                    const bk = blockKey(homeTruck.id, bIdx + 1);
                    if (!cancelledBlocks[bk]) {
                      setCancelledBlocks((prev) => ({ ...prev, [bk]: true }));
                      setCascadeCancelled((prev) => ({ ...prev, [bk]: true }));
                    }
                  }
                }
              }
            }
          }
        } else {
          // Demo mode: cascade by block number position
          const homeTruck = TRUCKS.find((t) => t.primaryDriver === driverId || t.secondaryDriver === driverId);
          if (homeTruck && getOriginalDriver(homeTruck.id, blockNum) === driverId) {
            const bk = blockKey(homeTruck.id, blockNum);
            if (!cancelledBlocks[bk]) {
              setCancelledBlocks((prev) => ({ ...prev, [bk]: true }));
              setCascadeCancelled((prev) => ({ ...prev, [bk]: true }));
            }
          }
        }
      };

      const cancelPendingBackup = () => {
        setPendingBackup(null);
      };

      // Find blocks that could be suggested for a driver based on schedule fit
      const getSuggestedBlocks = (driverId) => {
        const driver = DRIVERS.find(dd => dd.id === driverId);
        if (!driver) return [];
        const driverDom = driver.domicile;
        const driverBlks = driver.blocks || [];
        const REST_MS = 10 * 3600000;

        // Collect all existing block time windows for this driver (including 10h rest)
        const drvTimeWins = driverBlks.map(b => ({
          start: parseBlockDateMs(b.blockStart),
          end: parseBlockDateMs(b.blockEnd),
        })).filter(w => w.start && w.end);

        // Check if a proposed block fits (no overlap with driver's schedule + 10h rest)
        const fits = (propStart, propEnd) => {
          if (!propStart || !propEnd) return false;
          for (const w of drvTimeWins) {
            const wEndWithRest = w.end + REST_MS;
            const propStartWithRest = propStart - REST_MS;
            // Check overlap: driver busy window (including rest on both sides)
            if (propStart < wEndWithRest && propStartWithRest < w.end) return false;
          }
          return true;
        };

        // Scan all blocks across all seats in the same domicile
        const suggestions = [];
        TRUCKS.forEach(truck => {
          const truckDom = truck.operatorId ? truck.operatorId.split("_")[1] : null;
          if (truckDom !== driverDom) return;

          (truck.blockIds || []).forEach((blockId, idx) => {
            const assignedDriver = truck.blockDrivers?.[idx];
            // Only suggest blocks that are cancelled and need a backup, OR unassigned
            const bn = idx + 1;
            const key = blockKey(truck.id, bn);
            const isCancelled = !!cancelledBlocks[key] && !blockBackups[key];

            if (!isCancelled) return; // only suggest blocks that need coverage

            const trips = truck.blockTrips?.[blockId] || [];
            let blkStart = null, blkEnd = null;
            trips.forEach(t => {
              const s = parseBlockDateMs(t.stop1ArrDate && t.stop1ArrTime ? `${t.stop1ArrDate} ${t.stop1ArrTime}` : null);
              const e = parseBlockDateMs(t.stop2ArrDate && t.stop2ArrTime ? `${t.stop2ArrDate} ${t.stop2ArrTime}` : null);
              if (s !== null && (blkStart === null || s < blkStart)) blkStart = s;
              if (e !== null && (blkEnd === null || e > blkEnd)) blkEnd = e;
            });

            if (!fits(blkStart, blkEnd)) return;

            // Compute start time match score
            let startScore = 0;
            if (blkStart && driver.blocks?.length > 0) {
              const propHour = new Date(blkStart).getHours() + new Date(blkStart).getMinutes() / 60;
              const prefHours = driver.blocks.filter(b => b.blockStart).map(b => {
                const p = b.blockStart.split(" ");
                if (p.length < 2) return null;
                const [h, m] = p[1].split(":").map(Number);
                return isNaN(h) ? null : h + (m || 0) / 60;
              }).filter(Boolean);
              if (prefHours.length > 0) {
                const avg = prefHours.reduce((a, b) => a + b, 0) / prefHours.length;
                startScore = Math.max(0, Math.round((10 - Math.min(Math.abs(propHour - avg), 10)) * 10) / 10);
              }
            }

            const durationHrs = blkStart && blkEnd ? Math.round((blkEnd - blkStart) / 3600000 * 10) / 10 : null;
            const seatLabel = truck.operatorId ? truck.operatorId.split("_").slice(-1)[0] : "";

            suggestions.push({
              blockId, truckId: truck.id, truckLabel: truck.operatorId,
              seatLabel, bn, key,
              blockStart: blkStart && trips.length > 0 ? formatBlockTime(trips[0].stop1ArrDate + " " + trips[0].stop1ArrTime) : "—",
              blockEnd: blkEnd && trips.length > 0 ? formatBlockTime(trips[trips.length - 1].stop2ArrDate + " " + trips[trips.length - 1].stop2ArrTime) : "—",
              durationHrs, startScore,
              originalDriver: getDriverName(assignedDriver),
            });
          });
        });

        // Sort by start time match score
        suggestions.sort((a, b) => b.startScore - a.startScore);
        return suggestions;
      };

      const removeBlockBackup = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setBlockBackups((prev) => { const n = { ...prev }; delete n[key]; return n; });
      };

      const dropBlock = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setDroppedBlocks((prev) => ({ ...prev, [key]: true }));
        setAssigningBlock(null);
      };

      const undropBlock = (truckId, blockNum) => {
        const key = blockKey(truckId, blockNum);
        setDroppedBlocks((prev) => { const n = { ...prev }; delete n[key]; return n; });
      };

      const resetAll = () => {
        setCancelledBlocks({});
        setDroppedBlocks({});
        setBlockBackups({});
        setCascadeCancelled({});
        setAssigningBlock(null);
        setSelectedTruck(null);
        delete savedStates.current[mode];
      };

      const measurePositions = useCallback(() => {
        if (!containerRef.current) return;
        const cr = containerRef.current.getBoundingClientRect();
        const ox = cr.left, oy = cr.top;
        const dp = {}, tp = {}, bp = {};
        for (const [id, el] of Object.entries(driverRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); dp[id] = { x: r.right - ox, y: r.top + r.height / 2 - oy }; }
        }
        for (const [id, el] of Object.entries(truckRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); tp[id] = { left: { x: r.left - ox, y: r.top + r.height / 2 - oy }, right: { x: r.right - ox, y: r.top + r.height / 2 - oy } }; }
        }
        for (const [id, el] of Object.entries(blockGroupRefs.current)) {
          if (el && el.isConnected) { const r = el.getBoundingClientRect(); bp[id] = { x: r.left - ox, y: r.top + r.height / 2 - oy }; }
        }
        setPositions({ drivers: dp, trucks: tp, blocks: bp });
      }, [mode, csvRegion]);

      useEffect(() => {
        const t = setTimeout(measurePositions, 150);
        window.addEventListener("resize", measurePositions);
        return () => { clearTimeout(t); window.removeEventListener("resize", measurePositions); };
      }, [measurePositions]);

      useLayoutEffect(() => {
        measurePositions();
      }, [mode, csvRegion, measurePositions]);

      useEffect(() => {
        const t = setTimeout(measurePositions, 60);
        return () => clearTimeout(t);
      }, [cancelledBlocks, blockBackups, assigningBlock, measurePositions]);

      // Keyboard shortcuts
      useEffect(() => {
        const handleKey = (e) => {
          if (e.key === "Escape") {
            if (suggestingFor) { setSuggestingFor(null); return; }
            if (pendingBackup) { setPendingBackup(null); return; }
            setSelectedDriver(null);
            setSelectedTruck(null);
            setAssigningBlock(null);
            setPendingBackup(null);
            setHoveredDriver(null);
            setHoveredTruck(null);
          }
          // Arrow keys to cycle through drivers when one is selected
          if (selectedDriver && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            const filteredDrivers = DRIVERS.filter(d => !driverSearch || d.label.toLowerCase().includes(driverSearch.toLowerCase()));
            const currentIdx = filteredDrivers.findIndex(d => d.id === selectedDriver);
            if (currentIdx === -1) return;
            const nextIdx = e.key === "ArrowDown"
              ? Math.min(currentIdx + 1, filteredDrivers.length - 1)
              : Math.max(currentIdx - 1, 0);
            const nextDriver = filteredDrivers[nextIdx];
            setSelectedDriver(nextDriver.id);
            setSelectedTruck(null);
            // Scroll to the driver's load
            const load = TRUCKS.find(t => t.primaryDriver === nextDriver.id || t.secondaryDriver === nextDriver.id);
            if (load) {
              const loadEl = blockGroupRefs.current[load.id];
              if (loadEl) loadEl.scrollIntoView({ behavior: "smooth", block: "center" });
            }
            // Scroll driver card into view
            const driverEl = driverRefs.current[nextDriver.id];
            if (driverEl) driverEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
        };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [selectedDriver, driverSearch]);

      // Auto-hide lines in CSV mode when sorted or many drivers
      const effectiveShowLines = csvRows
        ? (driverSort === "default" && showLines && DRIVERS.length <= 40) || hoveredDriver || hoveredTruck || selectedDriver
        : true;

      const getLineColor = (driverId, truckId) => {
        if (Object.entries(blockBackups).some(([k, v]) => v === driverId && k.startsWith(`${truckId}-`))) return B.bkp;
        const truck = TRUCKS.find((t) => t.id === truckId);
        if (hoveredDriver === driverId || hoveredTruck === truckId) return B.red;
        if (truck?.primaryDriver === driverId) return B.green;

                      .sort((a, b) => { const pT = (s) => { if (!s) return Infinity; const p = s.split(" "); if (p.length < 2) return Infinity; const [mo,dy,yr]=p[0].split("/").map(Number); const [hr,mn]=p[1].split(":").map(Number); return new Date(yr,mo-1,dy,hr,mn||0).getTime(); }; return pT(a.blockStart) - pT(b.blockStart); });
                    // Time-bucket domicile unassigned blocks into 4 columns

                    const openSlotColumns = [[], [], [], []];

                    const bucketMinT = allTimesForBucket.length > 0 ? Math.min(...allTimesForBucket) : 0;

                    domUnassigned.forEach(ub => {

                      openSlotColumns[slotIdx].push(ub);
                    });
                    const openNumRows = Math.max(...openSlotColumns.map(c => c.length), 0);
                    const openSlotRows = Array.from({ length: openNumRows }, (_, ri) =>

                        {domDrivers.map((d, dIdx) => {

                          // Strategy: sort chronologically, then use gaps to determine vacant slot position
                          const rawBlocks = (proposedSchedule[d.id] || []).slice();
                          const parseTB = (str) => { if (!str) return Infinity; const p = str.split(" "); if (p.length < 2) return Infinity; const [mo,dy,yr]=p[0].split("/").map(Number); const [hr,mn]=p[1].split(":").map(Number); return new Date(yr,mo-1,dy,hr,mn||0).getTime(); };
                          rawBlocks.sort((a, b) => (a.startMs || parseTB(a.blockStart)) - (b.startMs || parseTB(b.blockStart)));

                          const slots = [null, null, null, null];
                          if (rawBlocks.length >= 4) {
                            // 4+ blocks: first 4 in chronological order
                            slots[0] = rawBlocks[0]; slots[1] = rawBlocks[1]; slots[2] = rawBlocks[2]; slots[3] = rawBlocks[3];
                          } else if (rawBlocks.length === 3) {
                            // 3 blocks: find the largest gap to determine which slot is vacant
                            const times = rawBlocks.map(b => b.startMs || parseTB(b.blockStart));
                            const gaps = [
                              { idx: 0, gap: times[0] - (bucketMinT || times[0]) },
                              { idx: 1, gap: times[1] - times[0] },
                              { idx: 2, gap: times[2] - times[1] },
                              { idx: 3, gap: (bucketMaxT || times[2]) - times[2] },
                            ];
                            // Largest gap determines where the vacant slot goes
                            const largestGap = gaps.sort((a, b) => b.gap - a.gap)[0];
                            const vacantIdx = largestGap.idx;
                            let bi = 0;
                            for (let si = 0; si < 4; si++) {
                              if (si === vacantIdx) continue;
                              slots[si] = rawBlocks[bi++];
                            }
                          } else if (rawBlocks.length === 2) {
                            // 2 blocks: place based on gap size relative to week span
                            const t0 = rawBlocks[0].startMs || parseTB(rawBlocks[0].blockStart);
                            const t1 = rawBlocks[1].startMs || parseTB(rawBlocks[1].blockStart);
                            const pct0 = (t0 - bucketMinT) / bucketSpan;
                            const pct1 = (t1 - bucketMinT) / bucketSpan;
                            const s0 = Math.min(3, Math.floor(pct0 * 4));
                            let s1 = Math.min(3, Math.floor(pct1 * 4));
                            if (s1 <= s0) s1 = Math.min(3, s0 + 1);
                            slots[s0] = rawBlocks[0]; slots[s1] = rawBlocks[1];
                          } else if (rawBlocks.length === 1) {
                            // 1 block: place based on where in the week it falls
                            const t = rawBlocks[0].startMs || parseTB(rawBlocks[0].blockStart);
                            const pct = (t - bucketMinT) / bucketSpan;
                            slots[pct < 0.25 ? 0 : pct < 0.5 ? 1 : pct < 0.75 ? 2 : 3] = rawBlocks[0];
                          }
                          const driverBlocks = slots;

                          return (

                                  // Compute which unassigned blocks fit this driver
                                  const getSuggestionsForDriver = () => {
                                    if (!isSuggesting) return [];
                                    const parseTFn = (str) => { if (!str) return Infinity; const p = str.split(" "); if (p.length < 2) return Infinity; const [mo,dy,yr]=p[0].split("/").map(Number); const [hr,mn]=p[1].split(":").map(Number); return new Date(yr,mo-1,dy,hr,mn||0).getTime(); };
                                    const existingWins = (proposedSchedule[d.id] || []).map(b => {
                                      const pT = (str) => { if (!str) return Infinity; const p = str.split(" "); if (p.length < 2) return Infinity; const [mo,dy,yr]=p[0].split("/").map(Number); const [hr,mn]=p[1].split(":").map(Number); return new Date(yr,mo-1,dy,hr,mn||0).getTime(); };
                                      return [b.startMs || pT(b.blockStart), b.endMs || pT(b.blockEnd)];

                                    return unassignedBlocks

                                        // Same domicile required

                                        const dDom = d.domicile || "";
                                        if (ubDom && dDom && ubDom !== dDom) return false;
                                        // 10h rest check
                                        const parseT = (str) => { if (!str) return Infinity; const p = str.split(" "); if (p.length < 2) return Infinity; const [mo,dy,yr]=p[0].split("/").map(Number); const [hr,mn]=p[1].split(":").map(Number); return new Date(yr,mo-1,dy,hr,mn||0).getTime(); };
                                        const bs = ub.startMs || parseT(ub.blockStart);
                                        const be = ub.endMs || parseT(ub.blockEnd);
                                        if (bs === Infinity) return true;
                                        const effectiveEnd = (be && be !== Infinity) ? be : bs + 37*3600000;
                                        if (existingWins.length === 0) return true;
                                        // Flat 10h rest between any two blocks
                                        const reqRest = 10*3600000;
                                        return existingWins.every(([s, e]) => {
                                          const existEnd = (e && e !== Infinity) ? e : s + 37*3600000;
                                          return bs >= existEnd + reqRest || effectiveEnd <= s - reqRest;
                                        });
                                      })
                                      .map(ub => {
                                        // Score by start time match
                                        const blockHour = (() => { if (!ub.blockStart) return null; const p = ub.blockStart.split(" "); if (p.length < 2) return null; const [h,m]=p[1].split(":").map(Number); return isNaN(h)?null:h+(m||0)/60; })();
                                        let timeScore = 0;
                                        if (blockHour !== null && d.blockStartHours && d.blockStartHours.length > 0) {
                                          let minDelta = 24;
                                          d.blockStartHours.forEach(h => { const diff = Math.min(Math.abs(blockHour-h), 24-Math.abs(blockHour-h)); if (diff < minDelta) minDelta = diff; });
                                          timeScore = minDelta <= 6 ? Math.round((1 - minDelta/6) * 100) : 0;
                                        }
                                        return { ...ub, timeScore };
                                      })
                                      .sort((a, b) => b.timeScore - a.timeScore)
                                      .slice(0, 12);

                                              <div style={{ flex: 1 }}>
                                                <div style={{ fontWeight: 700, color: B.text }}>{sb.blockId.slice(0, 8)} <span style={{ fontWeight: 400, color: B.dim, fontSize: 8 }}>{sb.operatorId?.split("_").pop()}</span></div>
                                                <div style={{ fontSize: 8, color: B.muted, marginTop: 1 }}>{formatBlockTime(sb.blockStart)} → {formatBlockTime(sb.blockEnd)}</div>

                                              </div>
                                            </div>
                                          ))}
                                        </div>

                                    </div>

                                }
                                return (
                                  <div key={idx} style={{ width: 140, flexShrink: 0, padding: "0 3px", position: "relative" }}

                                      if (!dragSource || !dragSource.block) return;
                                      const blkDom = (dragSource.block.operatorId || "").split("_")[1] || dragSource.block.domicile || "";

                                      e.preventDefault();
                                      e.currentTarget.style.outline = "none";
                                      if (!dragSource || !dragSource.block) return;
                                      if (dragSource.driverId === d.id && dragSource.blockId === blk.blockId) return; // same block
                                      // Validate: domicile match
                                      const blkDom = (dragSource.block.operatorId || "").split("_")[1] || dragSource.block.domicile || "";
                                      if (blkDom && d.domicile && blkDom !== d.domicile) return;

                                      </div>

                                        {DRIVERS.filter(cd => cd.domicile === d.domicile && cd.id !== d.id && (proposedSchedule[cd.id] || []).length < MAX_BLOCKS_PER_WEEK).map(cd => (
                                          <div key={cd.id} onClick={() => {
                                            // Move block from current driver to new driver
                                            const newSchedule = { ...proposedSchedule };

                                            setProposedSchedule(newSchedule);
                                            setReassigningBlock(null);

                                        }}>
